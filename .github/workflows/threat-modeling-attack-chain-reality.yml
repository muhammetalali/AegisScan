name: Threat Modeling Attack Chain Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/services/test_threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/routers/threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/threat-modeling-attack-chain-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/services/test_threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/routers/threat_modeling.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/threat-modeling-attack-chain-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threat-model-attack-chain-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  threat-model-attack-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-threat-model-django-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-threat-model-jwt-secret-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-threat-model-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-threat-model-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile threat modeling plane
        run: |
          python -m py_compile \
            aegis-platform/backend/fastapi_app/services/threat_modeling.py \
            aegis-platform/backend/fastapi_app/services/test_threat_modeling.py \
            aegis-platform/backend/fastapi_app/routers/threat_modeling.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          from django.db import connection
          assert connection.vendor == 'postgresql', connection.vendor
          print('THREAT_MODEL_DATABASE=POSTGRESQL')
          PY

      - name: Evidence-backed threat model and attack-chain suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_threat_modeling.py \
            --junitxml=/tmp/threat-model-attack-chain-junit.xml

      - name: Verify API and non-fabrication contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          paths = set(app.openapi().get('paths', {}))
          expected = {
              '/api/v1/threat-model/projects/{project_id}/build',
              '/api/v1/threat-model/projects/{project_id}',
              '/api/v1/threat-model/projects/{project_id}/attack-paths/{attack_path_id}/validate',
          }
          assert expected.issubset(paths), sorted(expected - paths)
          from fastapi_app.services import threat_modeling as model
          assert 'observed-reference-only' in open(model.__file__, encoding='utf-8').read()
          assert 'CWE-to-CAPEC mapping is fabricated' in open(model.__file__, encoding='utf-8').read()
          print('THREAT_MODEL_API=PASS')
          print('CAPEC_NON_FABRICATION=PASS')
          PY

      - name: Retain threat modeling reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threat-model-attack-chain-reality-${{ github.sha }}
          path: /tmp/threat-model-attack-chain-junit.xml
          retention-days: 30
          if-no-files-found: warn
