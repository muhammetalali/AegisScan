name: Cache Origin Bootstrap

on:
  push:
    branches: [codex/cache-origin-dns-security-2026-09-12]
    paths:
      - 'tools/cache_origin_bootstrap.py'
      - '.github/workflows/cache-origin-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/cache-origin-dns-security-2026-09-12
          fetch-depth: 0
      - name: Apply cache origin security integration
        run: python tools/cache_origin_bootstrap.py
      - name: Remove bootstrap-only files and validate diff
        shell: bash
        run: |
          set -euo pipefail
          rm tools/cache_origin_bootstrap.py .github/workflows/cache-origin-bootstrap.yml
          git diff --check
          python -m py_compile \
            aegis-platform/backend/fastapi_app/contracts/cache_origin_security.py \
            aegis-platform/backend/fastapi_app/services/cache_origin_security.py \
            aegis-platform/backend/fastapi_app/services/test_cache_origin_security.py \
            aegis-platform/backend/fastapi_app/services/test_cache_origin_credential_scope.py \
            aegis-platform/backend/fastapi_app/routers/web_security.py \
            aegis-platform/backend/fastapi_app/services/credential_execution.py \
            aegis-platform/backend/enterprise/web_security_models.py
      - name: Commit integrated product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aegisscan-ci'
          git config user.email 'aegisscan-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat(cache): governed cache DNS origin security plane'
          git push origin HEAD:codex/cache-origin-dns-security-2026-09-12
