name: Identity Protocol Credential Scope Patch

on:
  push:
    branches:
      - codex/identity-protocol-security-2026-09-12
    paths:
      - 'aegis-platform/scripts/patch_identity_protocol_credential_scope.py'
      - '.github/workflows/identity-protocol-credential-scope-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/identity-protocol-security-2026-09-12
          fetch-depth: 0

      - name: Apply governed credential scope integration
        run: python aegis-platform/scripts/patch_identity_protocol_credential_scope.py

      - name: Verify identity protocol capability is scope-governed
        run: grep -F "'identity-protocol.security-validation'" aegis-platform/backend/fastapi_app/services/credential_execution.py

      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aegis-platform/backend/fastapi_app/services/credential_execution.py
          git commit -m 'fix(identity): enforce Vault protocol scope and identity binding'
          git push origin HEAD:codex/identity-protocol-security-2026-09-12
