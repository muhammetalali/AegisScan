name: Branch Hygiene Reality

'on':
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-merged-pr-head:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact merged internal PR head
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const headRepo = pr.head.repo?.full_name ?? null;
            const headRef = pr.head.ref;
            const mergedHeadSha = pr.head.sha;

            if (headRepo !== `${owner}/${repo}`) {
              core.info(`External fork head ${headRepo ?? 'unknown'} is not owned by this repository; nothing to delete.`);
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            if (headRef === defaultBranch || headRef.startsWith('archive/')) {
              core.setFailed(`Refusing to delete protected historical/default branch: ${headRef}`);
              return;
            }

            let liveRef;
            try {
              ({ data: liveRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${headRef}`,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`Merged branch ${headRef} is already absent.`);
                return;
              }
              throw error;
            }

            const liveSha = liveRef.object.sha;
            if (liveSha !== mergedHeadSha) {
              core.setFailed(
                `Merged branch ${headRef} advanced after merge: merged SHA ${mergedHeadSha}, live SHA ${liveSha}; retaining ref.`
              );
              return;
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${headRef}`,
            });

            core.summary
              .addHeading('Branch Hygiene Reality')
              .addRaw(`Merged PR: #${pr.number}\\n\\n`)
              .addRaw(`Deleted head: ${headRef}\\n\\n`)
              .addRaw(`Verified SHA: ${mergedHeadSha}\\n\\n`)
              .write();

            core.info(JSON.stringify({
              pull_request: pr.number,
              deleted_head: headRef,
              verified_sha: mergedHeadSha,
              default_branch: defaultBranch,
            }, null, 2));
