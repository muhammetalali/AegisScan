name: Branch Hygiene Reality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune-fully-merged-codex-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only fully merged codex branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === \`\${owner}/\${repo}\`)
                .map((pr) => pr.head.ref)
            );

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const candidates = branches
              .map((branch) => branch.name)
              .filter((name) => name.startsWith('codex/'))
              .filter((name) => name !== defaultBranch)
              .filter((name) => !openHeads.has(name));

            const deleted = [];
            const retained = [];
            const failed = [];

            for (const branch of candidates) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: \`\${defaultBranch}...\${branch}\`,
                });

                if (comparison.ahead_by !== 0) {
                  retained.push({ branch, ahead_by: comparison.ahead_by });
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: \`heads/\${branch}\`,
                });
                deleted.push(branch);
              } catch (error) {
                failed.push({ branch, status: error.status ?? null, message: error.message });
              }
            }

            core.summary
              .addHeading('Branch Hygiene Reality')
              .addRaw(\`Default branch: \${defaultBranch}\\n\\n\`)
              .addRaw(\`Open PR heads skipped: \${openHeads.size}\\n\\n\`)
              .addRaw(\`Fully merged codex branches deleted: \${deleted.length}\\n\\n\`)
              .addRaw(\`Codex branches retained with unique commits: \${retained.length}\\n\\n\`)
              .addRaw(\`Delete/compare failures: \${failed.length}\\n\\n\`)
              .write();

            core.info(JSON.stringify({
              default_branch: defaultBranch,
              deleted_count: deleted.length,
              retained_count: retained.length,
              failed_count: failed.length,
              retained: retained.slice(0, 100),
              failed: failed.slice(0, 100),
            }, null, 2));

            if (failed.length > 0) {
              core.setFailed(\`Branch hygiene encountered \${failed.length} GitHub API failures\`);
            }
