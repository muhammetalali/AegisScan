name: Security Reality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Install dependencies
        working-directory: aegis-platform/backend
        run: python -m pip install -r requirements.txt
      - name: Django check
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python manage.py check
      - name: Migration check
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput
      - name: Production Django checks
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-production-secret-not-used-at-runtime
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-production-jwt-secret-not-used-at-runtime
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          AUTH_COOKIE_SECURE: 'True'
        run: python manage.py check --deploy
      - name: Python compile check
        working-directory: aegis-platform/backend
        run: python -m compileall -q django_project fastapi_app celery_app
      - name: Redis connectivity smoke test
        working-directory: aegis-platform/backend
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python -c "import os, redis; r=redis.from_url(os.environ['REDIS_URL']); assert r.ping() is True; print('Redis: OK')"
      - name: Celery configuration smoke test
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','django_project.settings'); import django; django.setup(); from django.conf import settings; from celery import Celery; app=Celery('aegis'); app.conf.broker_url=settings.CELERY_BROKER_URL; print('Celery broker:', app.conf.broker_url)"
      - name: Tests
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aegis-platform/frontend/package-lock.json
      - name: Install dependencies
        working-directory: aegis-platform/frontend
        run: npm ci
      - name: Typecheck
        working-directory: aegis-platform/frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: aegis-platform/frontend
        run: npm run build
