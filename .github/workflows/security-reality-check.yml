name: Security Reality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Install dependencies
        working-directory: aegis-platform/backend
        run: python -m pip install -r requirements.txt
      - name: Django check
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python manage.py check
      - name: Generate and commit Django migrations
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          python manage.py makemigrations --noinput
          if git diff --quiet -- '*migrations/*.py'; then
            echo "No new Django migrations generated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '**/migrations/*.py'
            git commit -m "chore: add generated Django migrations"
            git push origin HEAD:main
          fi
      - name: Migration check
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput
      - name: Python compile check
        working-directory: aegis-platform/backend
        run: python -m compileall -q .
      - name: Tests
        working-directory: aegis-platform/backend
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aegis-platform/frontend/package-lock.json
      - name: Install dependencies
        working-directory: aegis-platform/frontend
        run: npm ci
      - name: Typecheck
        working-directory: aegis-platform/frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: aegis-platform/frontend
        run: npm run build
