name: Provider Approval Enterprise Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/provider_approval_models.py'
      - 'aegis-platform/backend/enterprise/burp_mcp_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0042_provider_approval_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/services/test_provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/burp_mcp_gateway.py'
      - 'aegis-platform/backend/fastapi_app/services/test_burp_mcp_gateway.py'
      - 'aegis-platform/backend/fastapi_app/routers/provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/routers/burp_mcp.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/provider-approval-enterprise-reality.yml'
      - '.github/workflows/burp-mcp-gateway-reality.yml'
  push:
    branches: [main, chatgpt-a/provider-approval-plane-20260922]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/provider_approval_models.py'
      - 'aegis-platform/backend/enterprise/burp_mcp_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0042_provider_approval_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/services/test_provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/burp_mcp_gateway.py'
      - 'aegis-platform/backend/fastapi_app/services/test_burp_mcp_gateway.py'
      - 'aegis-platform/backend/fastapi_app/routers/provider_approval.py'
      - 'aegis-platform/backend/fastapi_app/routers/burp_mcp.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/provider-approval-enterprise-reality.yml'
      - '.github/workflows/burp-mcp-gateway-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-approval-enterprise-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  provider-approval-enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-provider-approval-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-provider-approval-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-provider-approval-evidence-hmac-0123456789abcdef
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-provider-approval-credential-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'
      BURP_MCP_ALLOW_INSECURE_LOCAL: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile Provider Approval Plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/provider_approval_models.py \
            aegis-platform/backend/enterprise/migrations/0042_provider_approval_plane.py \
            aegis-platform/backend/enterprise/burp_mcp_models.py \
            aegis-platform/backend/fastapi_app/services/provider_approval.py \
            aegis-platform/backend/fastapi_app/services/test_provider_approval.py \
            aegis-platform/backend/fastapi_app/services/burp_mcp_gateway.py \
            aegis-platform/backend/fastapi_app/services/test_burp_mcp_gateway.py \
            aegis-platform/backend/fastapi_app/routers/provider_approval.py \
            aegis-platform/backend/fastapi_app/routers/burp_mcp.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: PostgreSQL migration and schema reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()

          from django.db import connection
          from enterprise.provider_approval_models import ProviderApprovalDecision
          from enterprise.burp_mcp_models import BurpMCPSession

          assert connection.vendor == 'postgresql', connection.vendor
          decision_fields = {field.name for field in ProviderApprovalDecision._meta.fields}
          session_fields = {field.name for field in BurpMCPSession._meta.fields}
          assert {
              'organization', 'project', 'legacy_approval', 'predecessor', 'reviewed_by',
              'provider_name', 'provider_version', 'capability', 'provider_identity_sha256',
              'status', 'trust_state', 'decision_version', 'manifest_sha256',
              'capability_manifest_sha256', 'supply_chain_sha256', 'request_fingerprint',
          } <= decision_fields
          assert 'provider_governance_decision' in session_fields
          assert ProviderApprovalDecision._meta.db_table in connection.introspection.table_names()
          print('PROVIDER_APPROVAL_DATABASE=POSTGRESQL')
          print('PROVIDER_APPROVAL_SCHEMA=WIRED')
          print('BURP_PROVIDER_DECISION_PIN=WIRED')
          PY

      - name: Provider approval version revocation trust and tenant reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_provider_approval.py \
            --junitxml=/tmp/provider-approval-enterprise-junit.xml

      - name: Burp provider enforcement regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_burp_mcp_gateway.py

      - name: Legacy provider compatibility regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_web_security_foundation.py -k 'provider'

      - name: Prove enterprise provider policy wiring
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()

          from fastapi_app.services.provider_approval import PROVIDER_APPROVAL_POLICY_VERSION

          service = Path('fastapi_app/services/provider_approval.py').read_text()
          burp = Path('fastapi_app/services/burp_mcp_gateway.py').read_text()
          router = Path('fastapi_app/routers/provider_approval.py').read_text()
          models = Path('enterprise/provider_approval_models.py').read_text()

          assert PROVIDER_APPROVAL_POLICY_VERSION == 'provider-approval-enterprise.v1'
          assert 'decision_version' in models
          assert 'predecessor' in models
          assert 'supply_chain_sha256' in models
          assert 'provider_identity_sha256' in models
          assert 'signature_verified' in service
          assert 'sbom_sha256' in service
          assert 'provenance_sha256' in service
          assert 'artifact_sha256' in service
          assert 'current_provider_decision' in service
          assert 'evaluate_provider_admissibility(' in burp
          assert 'provider_governance_decision' in burp
          assert "ConfigDict(extra='forbid')" in router
          print('PROVIDER_APPROVAL_IMMUTABLE_HISTORY=PROVEN')
          print('PROVIDER_APPROVAL_LATEST_STATE=FAIL_CLOSED')
          print('PROVIDER_APPROVAL_SUPPLY_CHAIN=PINNED')
          print('PROVIDER_APPROVAL_BURP_ENFORCEMENT=WIRED')
          PY

      - name: Retain Provider Approval Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-approval-enterprise-${{ github.sha }}
          path: /tmp/provider-approval-enterprise-junit.xml
          retention-days: 30
          if-no-files-found: warn
