name: AegisScan ITSM Sandbox E2E

on:
  push:
    branches:
      - feature/enterprise-platform-ui-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-itsm-e2e:
    name: Jira + ServiceNow sandbox E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: django_project.settings
      SECRET_KEY: ci-sandbox-secret-key-012345678901234567890123
      JWT_SECRET_KEY: ci-sandbox-jwt-secret-key-012345678901234567890123
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegisdb
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      WS_ALLOW_QUERY_TOKEN: "0"
      LOG_TO_FILE: "0"
      AEGIS_ITSM_MODE: sandbox
      AEGIS_ITSM_E2E_ENABLE: "1"
      AEGIS_ITSM_E2E_ACTOR: github-actions-sandbox-e2e
      AEGIS_ITSM_E2E_OWNER: security-engineering
      SERVICENOW_IDEMPOTENCY_FIELD: correlation_id

    defaults:
      run:
        working-directory: packages/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile backend
        run: python -m compileall -q fastapi_app tests scripts
      - name: Run sandbox contracts
        run: python -m pytest -q tests/test_itsm_sandbox.py tests/test_itsm_configuration.py tests/test_itsm_provider_health.py tests/test_itsm_capability.py
      - name: Migrate database
        run: python manage.py migrate --noinput
      - name: Run deterministic sandbox E2E with retry idempotency check
        run: python scripts/itsm_real_e2e.py
