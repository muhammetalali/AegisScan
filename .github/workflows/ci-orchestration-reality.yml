name: CI Orchestration Reality

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_ci_concurrency_policy.py'
      - 'tests/test_ci_concurrency_inventory.py'
      - 'tests/test_ci_workflow_yaml.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_ci_concurrency_policy.py'
      - 'tests/test_ci_concurrency_inventory.py'
      - 'tests/test_ci_workflow_yaml.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-orchestration-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  concurrency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install policy test dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2
      - name: Prove workflow syntax and concurrency semantics
        run: python -m pytest -q tests/test_ci_workflow_yaml.py tests/test_ci_concurrency_policy.py tests/test_ci_concurrency_inventory.py
