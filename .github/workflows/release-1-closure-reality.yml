name: Release 1 Closure Reality

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release1-closure-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  AEGIS_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release1-closure-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_SHA }}

      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$AEGIS_EXACT_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Release 1 closure verifier
        run: |
          python -m py_compile scripts/ci/release1_closure.py tests/test_release1_closure.py

      - name: Prove fail-closed Release 1 manifest contract
        run: |
          python -m pip install pytest==9.1.1
          pytest -q tests/test_release1_closure.py

      - name: Prove lifecycle orchestration contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          final_workflow = Path('.github/workflows/release-1-final-closure.yml').read_text(encoding='utf-8')
          live_workflow = Path('.github/workflows/production-live-deploy.yml').read_text(encoding='utf-8')
          request = json.loads(Path('.github/deployment-requests/internal-production.json').read_text(encoding='utf-8'))

          assert "Final Internal Production Governance" in final_workflow
          assert "scripts/ci/release1_closure.py" in final_workflow
          assert "Final Red Blue SRE Acceptance" in final_workflow
          assert "Final Governance Closure" in final_workflow
          assert "Production Resilience Acceptance" in final_workflow
          assert "Supply Chain Release" in final_workflow
          assert "open_pull_requests" in final_workflow
          assert ".github/deployment-requests/internal-production.json" in live_workflow
          assert request['schema'] == 'aegisscan.internal-production-deployment-request.v1'
          assert request['confirm'] == 'DEPLOY'
          assert request['deployment_mode'] == 'internal'
          assert request['requested_branch'] == 'main'
          assert re.fullmatch(r'[0-9a-f]{40}', request['requested_base_sha'])
          print('RELEASE1_LIFECYCLE_ORCHESTRATION=PASS')
          PY
