name: Native Capability Reality

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scanner-native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject arbitrary shell execution in native runtime
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'shell=True' aegis-platform/backend/fastapi_app/services/native_tool_runtime.py aegis-platform/backend/fastapi_app/tasks/native_capabilities.py
          ! grep -R --line-number 'additional_args\|arbitrary_flags' aegis-platform/backend/fastapi_app/services/native_tool_runtime.py
      - name: Build scanner image with native capabilities
        run: docker build -f aegis-platform/backend/Dockerfile.django -t aegisscan-native-capability:ci aegis-platform/backend
      - name: Prove packaged binaries and native argv runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh aegisscan-native-capability:ci -c '
            set -eu
            command -v strings
            command -v objdump
            command -v readelf
            command -v checksec
            command -v binwalk
            command -v xxd
            command -v gdb
            command -v exiftool
            command -v dnsenum
            command -v fierce
            command -v nbtscan
            command -v gobuster
            command -v dirb
            command -v ffuf
            command -v wafw00f
            command -v curl
            command -v chromium
            command -v aegis-browser-security
            command -v httpx
            command -v subfinder
            command -v katana
            command -v trivy
            command -v trufflehog
            command -v checkov
            test -s /opt/aegis-wordlists/web-common.txt
          '
          docker run --rm --entrypoint python aegisscan-native-capability:ci -c '
          from fastapi_app.services.native_tool_runtime import run_native_tool
          result = run_native_tool("binary.strings", "/bin/sh", {})
          assert result.exit_code == 0, result.stderr
          assert result.stdout.strip()
          xxd = run_native_tool("binary.xxd", "/bin/sh", {})
          assert xxd.exit_code == 0, xxd.stderr
          assert xxd.stdout.strip()
          print("native-runtime-ok")
          '
      - name: Prove real web discovery, headers, and browser DOM security capture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh aegisscan-native-capability:ci -c '
            set -eu
            mkdir -p /tmp/aegis-katana-fixture
            printf "%s\n" "<html><head><title>Aegis Fixture</title><meta http-equiv=Content-Security-Policy content=\"default-src self\"><script src=\"https://cdn.example.invalid/app.js\"></script></head><body><a href=/admin>admin</a><a href=/api/v1/health>health</a><form action=\"http://127.0.0.1:18080/login\" method=post><input type=password name=password value=secret-browser-password-value></form><img src=\"http://127.0.0.1:18080/insecure.png\"><script>console.log(1)</script></body></html>" > /tmp/aegis-katana-fixture/index.html
            printf "%s\n" "ok" > /tmp/aegis-katana-fixture/admin
            mkdir -p /tmp/aegis-katana-fixture/api/v1
            printf "%s\n" "{\"status\":\"ok\"}" > /tmp/aegis-katana-fixture/api/v1/health
            python -m http.server 18080 --bind 127.0.0.1 --directory /tmp/aegis-katana-fixture >/tmp/aegis-katana-http.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid >/dev/null 2>&1 || true" EXIT
            ready=0
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:18080/ >/dev/null; then ready=1; break; fi
              sleep 0.25
            done
            test "$ready" -eq 1
            katana -u http://127.0.0.1:18080 -d 1 -silent -jsonl > /tmp/aegis-katana.jsonl
            test -s /tmp/aegis-katana.jsonl
            grep -q "127.0.0.1:18080" /tmp/aegis-katana.jsonl
            grep -q "/admin" /tmp/aegis-katana.jsonl
            AUTHORIZED_SCAN_TARGETS=127.0.0.1/32 python - <<"PY"
          import json
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          from fastapi_app.services.native_output_normalizer import normalize_native_output
          from fastapi_app.services.native_tool_runtime import run_native_tool

          result = run_native_tool("web.security-headers", "http://127.0.0.1:18080", {})
          assert result.exit_code == 0, result.stderr
          assert "HTTP/" in result.stdout, result.stdout
          assert "Server:" in result.stdout, result.stdout
          normalized = normalize_native_output("web.security-headers", result.stdout)
          assert normalized["count"] >= 1, normalized
          assert normalized["observations"][0]["status"] == 200, normalized

          browser = run_native_tool(
              "browser.dom-snapshot",
              "http://127.0.0.1:18080",
              {"virtual_time_budget_ms": 2000, "max_dom_bytes": 131072},
          )
          assert browser.exit_code == 0, browser.stderr
          payload = json.loads(browser.stdout)
          assert payload["schema"] == "aegis.browser-security.v1", payload
          assert payload["dom_sha256"], payload
          assert payload["navigation_policy"]["javascript_disabled"] is False, payload
          assert payload["navigation_policy"]["third_party_dns_blocked"] is False, payload
          observation = payload["observations"][0]
          assert observation["kind"] == "browser-dom-security-snapshot", observation
          assert observation["title"] == "Aegis Fixture", observation
          assert observation["password_field_count"] == 1, observation
          assert observation["meta_csp_present"] is True, observation
          assert "cdn.example.invalid" in observation["third_party_resource_hosts"], observation
          assert "secret-browser-password-value" not in browser.stdout
          assert "secret-browser-password-value" not in browser.stderr
          normalized_browser = normalize_native_output("browser.dom-snapshot", browser.stdout)
          assert normalized_browser["count"] == 1, normalized_browser
          assert normalized_browser["observations"][0]["password_field_count"] == 1, normalized_browser

          secret = "native-vault-fixture-token-789"
          seen = []
          class Handler(BaseHTTPRequestHandler):
              def do_HEAD(self):
                  seen.append(self.headers.get("Authorization", ""))
                  if seen[-1] == f"Bearer {secret}":
                      self.send_response(200)
                      self.send_header("X-Aegis-Auth", "accepted")
                  else:
                      self.send_response(401)
                      self.send_header("X-Aegis-Auth", "missing")
                  self.end_headers()
              def log_message(self, format, *args):
                  return

          server = ThreadingHTTPServer(("127.0.0.1", 18081), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              authenticated = run_native_tool(
                  "web.security-headers",
                  "http://127.0.0.1:18081",
                  {},
                  credential_materials=({
                      "credential_ref": "ci-fixture",
                      "kind": "token",
                      "version": 1,
                      "secret": secret,
                  },),
              )
          finally:
              server.shutdown()
              thread.join(timeout=3)
              server.server_close()
          assert authenticated.exit_code == 0, authenticated.stderr
          assert seen == [f"Bearer {secret}"]
          assert "X-Aegis-Auth: accepted" in authenticated.stdout, authenticated.stdout
          assert secret not in authenticated.stdout
          assert secret not in authenticated.stderr
          print("security-headers-real-curl-ok")
          print("credential-bound-native-runtime-ok")
          print("browser-dom-security-real-chromium-ok")
          PY
            echo web-discovery-headers-and-browser-ok
          '
      - name: Prove real pause resume cancel process control
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python aegisscan-native-capability:ci - <<'PY'
          from fastapi_app.services.native_tool_runtime import (
              NATIVE_TOOL_SPECS, NativeExecutionCancelled, NativeToolSpec, run_native_tool,
          )
          NATIVE_TOOL_SPECS['ci.sleep'] = NativeToolSpec(
              'ci.sleep', 'sleep', 'ci', 'CI process control probe', 'file', ('file',),
              'passive', 'image', timeout=10,
          )
          states = iter(['paused', 'paused', 'running', 'running', 'running'])
          result = run_native_tool('ci.sleep', '1', {}, state_getter=lambda: next(states, 'running'), poll_interval=0.2)
          assert result.exit_code == 0
          calls = {'n': 0}
          def cancel_state():
              calls['n'] += 1
              return 'cancelled' if calls['n'] >= 2 else 'running'
          try:
              run_native_tool('ci.sleep', '10', {}, state_getter=cancel_state, poll_interval=0.2)
          except NativeExecutionCancelled:
              print('native-process-control-ok')
          else:
              raise AssertionError('cancel did not terminate native process')
          PY
      - name: Prove packaging, planning and normalization contracts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DEBUG=True \
            -e SECRET_KEY=ci-only-native-capability-secret-key-0123456789abcdef \
            --entrypoint python aegisscan-native-capability:ci -m pytest -q \
            --confcutdir=fastapi_app/services \
            fastapi_app/services/test_native_output_normalizer.py \
            fastapi_app/services/test_browser_security_probe.py
          docker run --rm --entrypoint python aegisscan-native-capability:ci -c '
          from fastapi_app.services.capability_planner import planning_summary
          from fastapi_app.services.native_packaging import PACKAGED_NATIVE_CAPABILITIES
          from fastapi_app.services.native_tool_runtime import NATIVE_TOOL_SPECS
          assert PACKAGED_NATIVE_CAPABILITIES <= set(NATIVE_TOOL_SPECS)
          assert len(PACKAGED_NATIVE_CAPABILITIES) >= 24
          assert "web.katana" in PACKAGED_NATIVE_CAPABILITIES
          assert "web.security-headers" in PACKAGED_NATIVE_CAPABILITIES
          assert "browser.dom-snapshot" in PACKAGED_NATIVE_CAPABILITIES
          web = planning_summary("website", "standard")
          assert web["ready"] >= 8
          assert any(item["id"] == "browser.dom-snapshot" and item["execution_ready"] for item in web["plan"])
          code = planning_summary("repository", "quick")
          assert code["ready"] >= 2
          file_plan = planning_summary("file", "quick")
          assert file_plan["ready"] >= 8
          print(sorted(PACKAGED_NATIVE_CAPABILITIES))
          '
