name: Domain Contract Reality

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-ui-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aegis-platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Full UI audit
        run: npm run audit:ui
      - name: Typecheck and build
        run: npm run build

  backend-domain-contract:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-secret
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-secret
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      AUTHORIZED_SCAN_TARGETS: '127.0.0.1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt
      - name: Install package and backend dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Django checks and migrations
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: API contract reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python -m pytest -q fastapi_app/routers/test_contract_surfaces.py fastapi_app/routers/test_attack_path_real.py fastapi_app/routers/test_compliance_contract_real.py
      - name: Unified validation contract reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python -m pytest -q fastapi_app/routers/test_contract_surfaces.py
      - name: Live threat intelligence reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python -m pytest -q fastapi_app/routers/test_intelligence_real.py
