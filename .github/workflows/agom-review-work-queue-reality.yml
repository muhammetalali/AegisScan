name: AGOM Review Work Queue Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/assurance_obligation_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0032_review_obligation_work_queue.py'
      - 'aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/test_review_work_queue_governance.py'
      - 'aegis-platform/backend/fastapi_app/routers/assurance_obligations.py'
      - '.github/workflows/agom-review-work-queue-reality.yml'
  push:
    branches: [main, chatgpt-a/review-obligations-work-queue-2026-09-19]
    paths:
      - 'aegis-platform/backend/enterprise/assurance_obligation_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0032_review_obligation_work_queue.py'
      - 'aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/test_review_work_queue_governance.py'
      - 'aegis-platform/backend/fastapi_app/routers/assurance_obligations.py'
      - '.github/workflows/agom-review-work-queue-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agom-review-work-queue-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  review-work-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-agom-review-work-queue-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-agom-review-work-queue-jwt-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-agom-review-work-queue-evidence-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-agom-review-work-queue-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile review obligation plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/assurance_obligation_models.py \
            aegis-platform/backend/enterprise/migrations/0032_review_obligation_work_queue.py \
            aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py \
            aegis-platform/backend/fastapi_app/services/test_review_work_queue_governance.py \
            aegis-platform/backend/fastapi_app/routers/assurance_obligations.py

      - name: Verify PostgreSQL schema and migration drift
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.assurance_obligation_models import AssuranceObligation, AssuranceObligationEvent

          assert connection.vendor == 'postgresql', connection.vendor
          fields = {field.name for field in AssuranceObligation._meta.fields}
          required = {
              'assigned_to', 'assigned_by', 'assigned_at', 'acknowledged_by', 'acknowledged_at',
              'priority', 'sla_status', 'escalation_level', 'escalation_targets',
              'last_escalated_at', 'policy_id', 'policy_version',
          }
          assert required <= fields, sorted(required - fields)
          names = {constraint.name for constraint in AssuranceObligation._meta.constraints}
          assert 'assurance_obligation_assignment_shape' in names
          assert 'assurance_obligation_ack_shape' in names
          assert {'assigned', 'acknowledged', 'sla_at_risk', 'sla_breached', 'sla_closed'} <= set(AssuranceObligationEvent.EventType.values)
          print('AGOM_REVIEW_WORK_QUEUE_SCHEMA=WIRED')
          PY

      - name: Run review queue PostgreSQL Reality tests
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q --junitxml=/tmp/agom-review-work-queue-junit.xml \
            fastapi_app/services/test_review_work_queue_governance.py

      - name: Run assurance obligation regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_assurance_obligation_governance.py \
            fastapi_app/services/test_assurance_recurrence_obligation_governance.py \
            fastapi_app/services/test_assurance_drift_governance.py

      - name: Verify API and source-of-truth contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          import django
          django.setup()

          from fastapi_app.main import app
          from enterprise.assurance_obligation_models import AssuranceObligation
          from fastapi_app.services.assurance_obligation_governance import list_review_work_queue

          paths = app.openapi()['paths']
          base = '/api/v1/assurance/drift/projects/{project_id}'
          assert base + '/obligations/{obligation_id}/assign' in paths
          assert base + '/obligations/{obligation_id}/acknowledge' in paths
          assert base + '/work-queue' in paths
          assert list_review_work_queue.__name__ == 'list_review_work_queue'
          assert AssuranceObligation._meta.db_table == 'enterprise_assuranceobligation'
          print('OBLIGATION_TO_ASSIGNMENT_TO_SLA_TO_QUEUE=WIRED')
          PY

      - name: Retain review work queue Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agom-review-work-queue-${{ github.sha }}
          path: /tmp/agom-review-work-queue-junit.xml
          retention-days: 30
          if-no-files-found: warn
