# Final-head reality proof for governed business-logic mutation concurrency.
name: Business Logic Concurrency Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/routers/decision_actions.py'
      - 'aegis-platform/backend/fastapi_app/services/decision_action_orchestration.py'
      - 'aegis-platform/backend/fastapi_app/services/test_decision_action_orchestration.py'
      - 'aegis-platform/backend/fastapi_app/services/test_business_logic_concurrency.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_remediation_concurrency.py'
      - '.github/workflows/business-logic-concurrency-reality.yml'
  push:
    branches: [main, codex/business-logic-concurrency-2026-09-13]
    paths:
      - 'aegis-platform/backend/fastapi_app/routers/decision_actions.py'
      - 'aegis-platform/backend/fastapi_app/services/decision_action_orchestration.py'
      - 'aegis-platform/backend/fastapi_app/services/test_decision_action_orchestration.py'
      - 'aegis-platform/backend/fastapi_app/services/test_business_logic_concurrency.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_remediation_concurrency.py'
      - '.github/workflows/business-logic-concurrency-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-logic-concurrency-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  business-logic-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-business-logic-django-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-business-logic-jwt-secret-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-business-logic-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-business-logic-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile business logic concurrency plane
        run: |
          python -m py_compile \
            aegis-platform/backend/fastapi_app/services/decision_action_orchestration.py \
            aegis-platform/backend/fastapi_app/services/test_business_logic_concurrency.py \
            aegis-platform/backend/fastapi_app/routers/decision_actions.py \
            aegis-platform/backend/fastapi_app/routers/test_remediation_concurrency.py
      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          from django.db import connection
          assert connection.vendor == 'postgresql', connection.vendor
          print('BUSINESS_LOGIC_DATABASE=POSTGRESQL')
          PY
      - name: State machine CAS idempotency replay and race suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_business_logic_concurrency.py \
            fastapi_app/services/test_decision_action_orchestration.py \
            fastapi_app/routers/test_remediation_concurrency.py \
            --junitxml=/tmp/business-logic-concurrency-junit.xml
      - name: Verify API concurrency contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.routers.decision_actions import ActionCreate, ActionTransition

          paths = app.openapi()['paths']
          assert '/api/v1/decision/actions' in paths
          assert '/api/v1/decision/actions/{action_id}/transition' in paths
          assert ActionCreate.model_fields['idempotency_key'].is_required()
          assert ActionTransition.model_fields['expected_version'].is_required()
          assert ActionTransition.model_fields['idempotency_key'].is_required()
          assert ActionCreate.model_config.get('extra') == 'forbid'
          assert ActionTransition.model_config.get('extra') == 'forbid'
          print('BUSINESS_LOGIC_API_CAS=PASS')
          print('BUSINESS_LOGIC_API_IDEMPOTENCY=PASS')
          print('BUSINESS_LOGIC_API_STRICT_CONTRACT=PASS')
          PY
      - name: Retain business logic concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-logic-concurrency-reality-${{ github.sha }}
          path: /tmp/business-logic-concurrency-junit.xml
          retention-days: 30
          if-no-files-found: warn
