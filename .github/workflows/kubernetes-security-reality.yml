name: Kubernetes Security Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/kubernetes_*.py'
      - 'aegis-platform/backend/fastapi_app/services/native_tool_runtime.py'
      - 'aegis-platform/backend/fastapi_app/services/native_packaging.py'
      - 'aegis-platform/backend/fastapi_app/services/native_output_normalizer.py'
      - 'aegis-platform/backend/fastapi_app/services/native_finding_projection.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_credential_scope_regression.py'
      - 'aegis-platform/backend/fastapi_app/services/capability_registry.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_kubernetes_capability_api.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/django_project/system/credential_models.py'
      - 'aegis-platform/backend/django_project/system/migrations/0004_alter_credentialsecret_kind.py'
      - 'aegis-platform/backend/django_project/evidence/test_kubernetes_security_plane.py'
      - 'aegis-platform/backend/Dockerfile.django'
      - 'aegis-platform/e2e/kubernetes_security_e2e.py'
      - '.github/workflows/kubernetes-security-reality.yml'
      - 'tests/test_kubernetes_workflow.py'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/kubernetes_*.py'
      - 'aegis-platform/backend/fastapi_app/services/native_tool_runtime.py'
      - 'aegis-platform/backend/fastapi_app/services/native_packaging.py'
      - 'aegis-platform/backend/fastapi_app/services/native_output_normalizer.py'
      - 'aegis-platform/backend/fastapi_app/services/native_finding_projection.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_credential_scope_regression.py'
      - 'aegis-platform/backend/fastapi_app/services/capability_registry.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/django_project/system/credential_models.py'
      - 'aegis-platform/backend/django_project/system/migrations/0004_alter_credentialsecret_kind.py'
      - 'aegis-platform/backend/Dockerfile.django'
      - 'aegis-platform/e2e/kubernetes_security_e2e.py'
      - '.github/workflows/kubernetes-security-reality.yml'
      - 'tests/test_kubernetes_workflow.py'
  workflow_dispatch:

concurrency:
  group: kubernetes-security-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  KIND_LINUX_AMD64_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  kubernetes-security-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-kubernetes-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-kubernetes-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      AUTHORIZED_SCAN_TARGETS: '127.0.0.1/32'
      AEGIS_CELERY_NODE: 'kubernetes-reality@ci'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Test packaged analyzer workflow boundary
        run: python -m pytest -q tests/test_kubernetes_workflow.py

      - name: Configure ephemeral credential-vault keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import os
          print('CREDENTIAL_VAULT_KEYS=' + base64.urlsafe_b64encode(os.urandom(32)).decode())
          print('CREDENTIAL_FINGERPRINT_KEY=' + os.urandom(32).hex())
          PY

      - name: Compile migrate and test Kubernetes contracts
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q \
            fastapi_app/services/kubernetes_security.py \
            fastapi_app/services/kubernetes_capability.py \
            fastapi_app/services/native_tool_runtime.py \
            fastapi_app/services/credential_execution.py
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python -m pytest -q \
            fastapi_app/services/test_kubernetes_security.py \
            fastapi_app/services/test_kubernetes_capability_contract.py \
            fastapi_app/services/test_credential_scope_regression.py \
            fastapi_app/routers/test_kubernetes_capability_api.py \
            django_project/evidence/test_kubernetes_security_plane.py

      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl 'https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl'
          curl -fsSLo /tmp/kubectl.sha256 'https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256'
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Create real disposable Kubernetes cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name aegis-kube-ci --wait 120s
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Provision read-only scanner identity and risky fixtures
        shell: bash
        run: |
          set -euo pipefail
          cat <<'YAML' | kubectl apply -f -
          apiVersion: v1
          kind: Namespace
          metadata:
            name: aegis-fixture
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: aegis-scanner
            namespace: aegis-fixture
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: aegis-readonly-posture
          rules:
            - nonResourceURLs: ['/version']
              verbs: ['get']
            - apiGroups: ['']
              resources: ['namespaces', 'pods']
              verbs: ['get', 'list']
            - apiGroups: ['apps']
              resources: ['deployments']
              verbs: ['get', 'list']
            - apiGroups: ['rbac.authorization.k8s.io']
              resources: ['clusterroles', 'clusterrolebindings']
              verbs: ['get', 'list']
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: aegis-readonly-posture
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: aegis-readonly-posture
          subjects:
            - kind: ServiceAccount
              name: aegis-scanner
              namespace: aegis-fixture
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: deliberately-unsafe
            namespace: aegis-fixture
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: deliberately-unsafe
            template:
              metadata:
                labels:
                  app: deliberately-unsafe
              spec:
                hostPID: true
                containers:
                  - name: unsafe
                    image: registry.k8s.io/pause:3.10
                    securityContext:
                      privileged: true
                      allowPrivilegeEscalation: true
                      runAsUser: 0
                      capabilities:
                        add: ['ALL']
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: aegis-deliberate-wildcard
          rules:
            - apiGroups: ['*']
              resources: ['*']
              verbs: ['*']
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: aegis-deliberate-wildcard-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: aegis-deliberate-wildcard
          subjects:
            - kind: ServiceAccount
              name: default
              namespace: aegis-fixture
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: aegis-deliberate-default-admin
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - kind: ServiceAccount
              name: default
              namespace: aegis-fixture
          YAML
          kubectl -n aegis-fixture rollout status deployment/deliberately-unsafe --timeout=120s

      - name: Build minimal scoped kubeconfig and prove least privilege
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          CA_DATA="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')"
          TOKEN="$(kubectl -n aegis-fixture create token aegis-scanner --duration=20m)"
          test -n "$SERVER"
          test -n "$CA_DATA"
          test -n "$TOKEN"
          cat > /tmp/aegis-readonly.kubeconfig <<EOF
          apiVersion: v1
          kind: Config
          current-context: aegis-readonly
          clusters:
            - name: cluster
              cluster:
                server: ${SERVER}
                certificate-authority-data: ${CA_DATA}
          contexts:
            - name: aegis-readonly
              context:
                cluster: cluster
                user: scanner
          users:
            - name: scanner
              user:
                token: ${TOKEN}
          EOF
          chmod 0600 /tmp/aegis-readonly.kubeconfig
          echo "AEGIS_KUBE_TARGET=${SERVER}" >> "$GITHUB_ENV"
          echo 'AEGIS_KUBECONFIG_FILE=/tmp/aegis-readonly.kubeconfig' >> "$GITHUB_ENV"

          test "$(kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig auth can-i list pods --all-namespaces)" = 'yes'
          test "$(kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig auth can-i list deployments.apps --all-namespaces)" = 'yes'
          test "$(kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig auth can-i get secrets --all-namespaces || true)" = 'no'
          test "$(kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig auth can-i create pods -n aegis-fixture || true)" = 'no'
          test "$(kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig auth can-i delete deployments.apps -n aegis-fixture || true)" = 'no'
          kubectl --kubeconfig /tmp/aegis-readonly.kubeconfig get pods --all-namespaces >/dev/null

      - name: Build scanner image and prove packaged Kubernetes executable
        shell: bash
        run: |
          set -euo pipefail
          docker build -f aegis-platform/backend/Dockerfile.django -t aegisscan-kubernetes:ci aegis-platform/backend
          docker run --rm --entrypoint sh aegisscan-kubernetes:ci -c '
            set -eu
            test "$(id -u)" = "10001"
            command -v aegis-kubernetes-security
            test -x /app/fastapi_app/services/kubernetes_security.py
          '

      - name: Run packaged analyzer against real cluster
        shell: bash
        run: |
          set -euo pipefail
          sudo cp /tmp/aegis-readonly.kubeconfig /tmp/aegis-container.kubeconfig
          sudo chown 10001:10001 /tmp/aegis-container.kubeconfig
          sudo chmod 0400 /tmp/aegis-container.kubeconfig
          docker run --rm --network host \
            --env "AUTHORIZED_SCAN_TARGETS=${AUTHORIZED_SCAN_TARGETS:?explicit scan scope is required}" \
            -v /tmp/aegis-container.kubeconfig:/tmp/aegis-kubeconfig:ro \
            --entrypoint /usr/local/bin/aegis-kubernetes-security \
            aegisscan-kubernetes:ci \
            "$AEGIS_KUBE_TARGET" --kubeconfig /tmp/aegis-kubeconfig > /tmp/kubernetes-container-result.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/kubernetes-container-result.json', encoding='utf-8'))
          assert data['schema'] == 'aegis.kubernetes-security.v1', data
          summary = data['observations'][0]
          assert summary['read_only'] is True, summary
          assert summary['secrets_endpoint_requested'] is False, summary
          rules = {x.get('rule_id') for x in data['observations'] if x.get('kind') == 'kubernetes-security-finding'}
          required = {
              'kubernetes.workload.privileged-container',
              'kubernetes.rbac.bound-wildcard-clusterrole',
              'kubernetes.rbac.default-service-account-cluster-admin',
          }
          assert required <= rules, (required, rules)
          print('packaged-kubernetes-real-cluster-ok')
          PY
          TOKEN="$(python - <<'PY'
          import yaml
          data=yaml.safe_load(open('/tmp/aegis-readonly.kubeconfig', encoding='utf-8'))
          print(data['users'][0]['user']['token'])
          PY
          )"
          ! grep -Fq "$TOKEN" /tmp/kubernetes-container-result.json

      - name: Install source executable for real Celery worker
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 aegis-platform/backend/fastapi_app/services/kubernetes_security.py
          mkdir -p /tmp/aegis-bin
          ln -sf "$GITHUB_WORKSPACE/aegis-platform/backend/fastapi_app/services/kubernetes_security.py" /tmp/aegis-bin/aegis-kubernetes-security
          echo '/tmp/aegis-bin' >> "$GITHUB_PATH"

      - name: Start real scanner Celery worker
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          celery -A celery_app worker --loglevel=INFO --pool=solo -Q scanners --hostname="$AEGIS_CELERY_NODE" > /tmp/kubernetes-worker.log 2>&1 &
          echo "$!" > /tmp/kubernetes-worker.pid
          ready=0
          for _ in $(seq 1 40); do
            # Consume the complete CLI response: grep -q can close its pipe before
            # Celery prints its node summary, making a healthy ping fail under pipefail.
            if celery -A celery_app inspect ping --timeout=3 --destination="$AEGIS_CELERY_NODE" --json > /tmp/kubernetes-worker-ping.json 2>/tmp/kubernetes-worker-ping.stderr &&
              python -c 'import json, os; data=json.load(open("/tmp/kubernetes-worker-ping.json")); assert data.get(os.environ["AEGIS_CELERY_NODE"]) == {"ok": "pong"}'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/kubernetes-worker-ping.stderr
            cat /tmp/kubernetes-worker-ping.json
            cat /tmp/kubernetes-worker.log
            exit 1
          fi

      - name: Prove Celery Vault Finding Evidence E2E against real cluster
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/e2e/kubernetes_security_e2e.py | tee /tmp/kubernetes-e2e.json
          grep -Fq '"status": "ok"' /tmp/kubernetes-e2e.json
          grep -Fq '"read_only": true' /tmp/kubernetes-e2e.json
          grep -Fq '"secrets_endpoint_requested": false' /tmp/kubernetes-e2e.json

      - name: Verify scanner queue and worker state
        working-directory: aegis-platform/backend
        shell: bash
        run: |
          set -euo pipefail
          celery -A celery_app inspect active --timeout=3 --destination="$AEGIS_CELERY_NODE"
          celery -A celery_app inspect reserved --timeout=3 --destination="$AEGIS_CELERY_NODE"
          celery -A celery_app inspect scheduled --timeout=3 --destination="$AEGIS_CELERY_NODE"
          test -s /tmp/kubernetes-worker.log
          ! grep -Eiq '(Traceback|WorkerLostError|task.*failed unexpectedly)' /tmp/kubernetes-worker.log

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo '=== kind clusters ==='
          kind get clusters || true
          echo '=== Kubernetes objects ==='
          kubectl get pods,deployments -A -o wide || true
          kubectl get clusterroles,clusterrolebindings | tail -n 80 || true
          echo '=== Celery worker ==='
          cat /tmp/kubernetes-worker.log 2>/dev/null || true
          echo '=== E2E result ==='
          cat /tmp/kubernetes-e2e.json 2>/dev/null || true
          echo '=== container result ==='
          cat /tmp/kubernetes-container-result.json 2>/dev/null || true

      - name: Cleanup real worker and cluster
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/kubernetes-worker.pid ]; then
            kill "$(cat /tmp/kubernetes-worker.pid)" 2>/dev/null || true
          fi
          kind delete cluster --name aegis-kube-ci || true
          rm -f -- /tmp/aegis-readonly.kubeconfig
          sudo rm -f -- /tmp/aegis-container.kubeconfig
