name: Kali Runner Foundation Reality

on:
  pull_request:
    paths:
      - 'aegis-platform/kali/**'
      - '.github/workflows/kali-runner-foundation-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AEGIS_BASE_DIGEST: sha256:c6d78f57ebfdd9fec428a8b04f74876e66fddd08dfd328c076224a552e7332a3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up isolated Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Prove checkout is exact PR head
        run: test "$(git rev-parse HEAD)" = "${AEGIS_EXACT_HEAD}"
      - name: Run fail-closed contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -c /dev/null -p no:cacheprovider aegis-platform/kali/tests/test_runner_contract.py
      - name: Reject unpinned Kali base or foundation packages
        run: |
          grep -Eq '^FROM kalilinux/kali-rolling@sha256:[0-9a-f]{64}$' aegis-platform/kali/Dockerfile.base
          grep -q "AEGIS_BASE_IMAGE_DIGEST=${AEGIS_BASE_DIGEST}" aegis-platform/kali/Dockerfile.base
          ! grep -R 'REPLACE_WITH_VERIFIED_DIGEST' aegis-platform/kali
          python - <<'PY'
          from pathlib import Path
          text = Path('aegis-platform/kali/Dockerfile.base').read_text()
          for package in ('ca-certificates','coreutils','jq','procps','python3','tini'):
              if f'{package}=' not in text:
                  raise SystemExit(f'unpinned foundation package: {package}')
          PY
      - name: Build byte-reproducible pinned non-root base twice
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          for suffix in a b; do
            docker buildx build --no-cache --provenance=false \
              --build-arg BUILD_COMMIT="${AEGIS_EXACT_HEAD}" \
              --build-arg AEGIS_RUNNER_VERSION=0.1.0 \
              --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
              --tag aegis-kali:base \
              --output "type=docker,dest=/tmp/aegis-kali-base-${suffix}.tar,rewrite-timestamp=true" \
              -f aegis-platform/kali/Dockerfile.base \
              aegis-platform/kali
          done
          sha_a="$(sha256sum /tmp/aegis-kali-base-a.tar | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aegis-kali-base-b.tar | awk '{print $1}')"
          printf 'first=%s\nsecond=%s\n' "${sha_a}" "${sha_b}"
          if [ "${sha_a}" != "${sha_b}" ]; then
            python - <<'PY'
          import hashlib, json, tarfile, tempfile
          from pathlib import Path

          archives = [Path('/tmp/aegis-kali-base-a.tar'), Path('/tmp/aegis-kali-base-b.tar')]
          snapshots = []
          for archive in archives:
              root = Path(tempfile.mkdtemp(prefix='aegis-repro-'))
              with tarfile.open(archive) as tf:
                  tf.extractall(root)
              manifest = json.loads((root / 'manifest.json').read_text())[0]
              config = json.loads((root / manifest['Config']).read_text())
              layers = []
              for layer in manifest['Layers']:
                  payload = (root / layer).read_bytes()
                  layers.append(hashlib.sha256(payload).hexdigest())
              snapshots.append((manifest, config, layers))

          left, right = snapshots
          print('CONFIG_A', json.dumps(left[1], sort_keys=True, separators=(',', ':')))
          print('CONFIG_B', json.dumps(right[1], sort_keys=True, separators=(',', ':')))
          for index, (a, b) in enumerate(zip(left[2], right[2])):
              print(f'LAYER_{index}: {a} {b} equal={a == b}')
          if len(left[2]) != len(right[2]):
              print(f'LAYER_COUNT: {len(left[2])} {len(right[2])}')
          PY
            exit 1
          fi
          printf 'sha256:%s\n' "${sha_a}" > /tmp/aegis-image-digest.txt
          docker load -i /tmp/aegis-kali-base-a.tar
      - name: Verify runtime identity manifest and isolation contract
        run: |
          test "$(docker run --rm --entrypoint id aegis-kali:base -u)" = "10001"
          docker run --rm --entrypoint cat aegis-kali:base /opt/aegis-runner/runtime-manifest.json | tee /tmp/runtime-manifest.json
          grep -q "\"build_commit\":\"${AEGIS_EXACT_HEAD}\"" /tmp/runtime-manifest.json
          grep -q "\"base_image_digest\":\"${AEGIS_BASE_DIGEST}\"" /tmp/runtime-manifest.json
          mkdir -p /tmp/aegis-kali-reality
          printf '%s\n' '{"execution_id":"exec-reality","capability_id":"foundation.contract","asset_id":"asset-reality","authorization_id":"auth-reality","authorization_decision":"authorized","risk_level":"passive","profile":"base","options":{}}' > /tmp/aegis-kali-reality/job.json
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v /tmp/aegis-kali-reality/job.json:/workspace/job.json:ro \
            aegis-kali:base | tee /tmp/aegis-kali-reality/result.json
          grep -q '"status": "accepted-no-dispatch"' /tmp/aegis-kali-reality/result.json
          grep -q "\"build_commit\": \"${AEGIS_EXACT_HEAD}\"" /tmp/aegis-kali-reality/result.json
          grep -q '"runtime_manifest_digest": "sha256:' /tmp/aegis-kali-reality/result.json
      - name: Verify denied authorization fails closed
        run: |
          printf '%s\n' '{"execution_id":"exec-denied","capability_id":"foundation.contract","asset_id":"asset-reality","authorization_id":"auth-denied","authorization_decision":"denied","risk_level":"passive","profile":"base","options":{}}' > /tmp/aegis-kali-reality/denied.json
          if docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true -e AEGIS_JOB_MANIFEST=/workspace/denied.json -v /tmp/aegis-kali-reality/denied.json:/workspace/denied.json:ro aegis-kali:base; then
            echo 'denied authorization unexpectedly executed' >&2
            exit 1
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: aegis-kali:base
          format: spdx-json
          output-file: aegis-kali-base.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate build provenance
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          image_digest = Path('/tmp/aegis-image-digest.txt').read_text().strip()
          runtime_manifest = Path('/tmp/runtime-manifest.json').read_bytes()
          sbom = Path('aegis-kali-base.spdx.json').read_bytes()
          payload = {
              'runtime': 'aegis-kali',
              'runner_version': '0.1.0',
              'profile': 'base',
              'base_image_digest': os.environ['AEGIS_BASE_DIGEST'],
              'image_digest': image_digest,
              'runtime_manifest_digest': 'sha256:' + hashlib.sha256(runtime_manifest).hexdigest(),
              'sbom_digest': 'sha256:' + hashlib.sha256(sbom).hexdigest(),
              'build_commit': os.environ['AEGIS_EXACT_HEAD'],
          }
          Path('aegis-kali-base-provenance.json').write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n')
          PY
          cat aegis-kali-base-provenance.json
      - name: Upload foundation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-kali-base-foundation-evidence
          path: |
            aegis-kali-base.spdx.json
            aegis-kali-base-provenance.json
          if-no-files-found: error
