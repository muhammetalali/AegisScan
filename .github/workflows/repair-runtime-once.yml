name: One-time runtime repair
on:
  push:
    branches: [feature/enterprise-platform-ui-v2]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/backend/fastapi_app/main.py'); s=p.read_text(); s=s.replace('async def disable_engine(engine_name: str, user=Depends(get_current_user))\n    :','async def disable_engine(engine_name: str, user=Depends(get_current_user)):'); p.write_text(s)
          p=Path('packages/backend/fastapi_app/services/active_surface_scanner.py'); s=p.read_text(); s=s.replace('import xml.etree.ElementTree as ET','from defusedxml import ElementTree as ET'); p.write_text(s)
          p=Path('packages/backend/requirements.txt'); s=p.read_text(); p.write_text(s if 'defusedxml>=' in s else s+'\ndefusedxml>=0.7.1\n')
          p=Path('packages/backend/fastapi_app/services/itsm_remediation.py'); s=p.read_text(); s=s.replace('from psycopg2.pool import ThreadedConnectionPool','from psycopg2 import sql\nfrom psycopg2.pool import ThreadedConnectionPool'); old='set_sql = ", ".join(f"{k}=%s" for k, _ in updates) + ", updated_at=%s"\n    values = [json.dumps(v) if isinstance(v, (dict, list)) else v for _, v in updates] + [_now(), record_id]\n    pool = _db(); conn = pool.getconn()\n    try:\n        with conn.cursor() as cur:\n            cur.execute(f"UPDATE remediation_integration_records SET {set_sql} WHERE record_id=%s", values); conn.commit()\n'; new='values = [json.dumps(v) if isinstance(v, (dict, list)) else v for _, v in updates] + [_now(), record_id]\n    assignments = [sql.SQL("{}=%s").format(sql.Identifier(k)) for k, _ in updates]\n    statement = sql.SQL("UPDATE remediation_integration_records SET {} , updated_at=%s WHERE record_id=%s").format(sql.SQL(", ").join(assignments))\n    pool = _db(); conn = pool.getconn()\n    try:\n        with conn.cursor() as cur:\n            cur.execute(statement, values); conn.commit()\n';
          if old not in s: raise SystemExit('SQL block not found'); p.write_text(s.replace(old,new))
          p=Path('packages/platform/docker-compose.yml'); s=p.read_text(); marker='    environment:\n      SECRET_KEY: ${FASTAPI_SECRET_KEY:-aegisscan-local-fastapi-secret-change-me}\n'; repl='    environment:\n      DJANGO_SETTINGS_MODULE: django_project.settings\n      SECRET_KEY: ${FASTAPI_SECRET_KEY:-aegisscan-local-fastapi-secret-change-me}\n';
          if marker not in s: raise SystemExit('FastAPI environment block not found'); p.write_text(s.replace(marker,repl,1))
          PY
          python -m compileall -q packages/backend/fastapi_app
          python -m pip install -q -r packages/backend/requirements.txt
          bandit -r packages/backend/django_project packages/backend/fastapi_app -ll -x '*/migrations/*'
          rm .github/workflows/repair-runtime-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/backend/fastapi_app/main.py packages/backend/fastapi_app/services/active_surface_scanner.py packages/backend/fastapi_app/services/itsm_remediation.py packages/backend/requirements.txt packages/platform/docker-compose.yml .github/workflows/repair-runtime-once.yml
          git commit -m 'fix(runtime): repair startup and bandit findings [runtime-repaired]'
          git push
