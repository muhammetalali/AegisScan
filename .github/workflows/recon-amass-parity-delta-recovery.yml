name: Recon Amass Parity Delta Recovery

'on':
  push:
    branches:
      - chatgpt-a/recon-amass-runtime-parity-2026-09-15
    paths:
      - '.github/workflows/recon-amass-parity-delta-recovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-failed-semantic-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact failed job log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FAILED_JOB_ID: '104559314502'
        run: |
          set -euo pipefail
          mkdir -p recovered
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/jobs/${FAILED_JOB_ID}/logs" \
            -o recovered/failed-job.log
          test -s recovered/failed-job.log

      - name: Extract semantic comparison failure window
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text=Path('recovered/failed-job.log').read_text(encoding='utf-8',errors='replace')
          markers=(
              'Compare real normalized Amass semantics fail closed',
              'semantic_equivalent',
              'observation_equivalent',
              'AssertionError',
              'ExecutionSemanticParityReport',
          )
          lines=text.splitlines()
          selected=[]
          for index,line in enumerate(lines):
              if any(marker in line for marker in markers):
                  start=max(0,index-25)
                  end=min(len(lines),index+60)
                  selected.extend(lines[start:end])
          if not selected:
              raise SystemExit('semantic failure markers not found in recovered job log')
          dedup=[]
          seen=set()
          for line in selected:
              if line in seen:
                  continue
              seen.add(line)
              dedup.append(line)
          Path('recovered/semantic-delta-window.txt').write_text('\n'.join(dedup)+'\n',encoding='utf-8')
          print('\n'.join(dedup[-160:]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: recon-amass-semantic-delta-recovery-${{ github.sha }}
          path: recovered/
          if-no-files-found: error
          retention-days: 7
