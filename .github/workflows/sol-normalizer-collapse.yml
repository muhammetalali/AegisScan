name: Sol Normalizer Collapse Migration

on:
  push:
    branches:
      - sol-web-messaging-validator
    paths:
      - .github/workflows/sol-normalizer-collapse.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-web-messaging-validator
          fetch-depth: 0
      - name: Merge web messaging normalization into canonical normalizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          services = Path('aegis-platform/backend/fastapi_app/services')
          source_path = services / 'native_output_normalizer_core.py'
          target_path = services / 'native_output_normalizer.py'
          if not source_path.is_file():
              raise SystemExit('temporary normalizer core is missing')
          text = source_path.read_text(encoding='utf-8')

          old_counter = """                'post_message_send_count': _positive_int(item.get('post_message_send_count'), 100000),\n                'inner_html_write_count': _positive_int(item.get('inner_html_write_count'), 1000000),\n"""
          new_counter = """                'post_message_send_count': _positive_int(item.get('post_message_send_count'), 100000),\n                'post_message_receive_count': _positive_int(item.get('post_message_receive_count'), 100000),\n                'inner_html_write_count': _positive_int(item.get('inner_html_write_count'), 1000000),\n"""
          if text.count(old_counter) != 1:
              raise SystemExit(f'expected one browser summary counter insertion point, found {text.count(old_counter)}')
          text = text.replace(old_counter, new_counter, 1)

          marker = """        if kind in {'browser-page-route', 'browser-websocket-channel'}:\n"""
          if text.count(marker) != 1:
              raise SystemExit(f'expected one browser observation insertion point, found {text.count(marker)}')
          assessment = """        if kind == 'browser-web-messaging-assessment':\n            records: list[dict[str, Any]] = []\n            rows = item.get('records') if isinstance(item.get('records'), list) else []\n            for row in rows[:128]:\n                if not isinstance(row, dict):\n                    continue\n                direction = str(row.get('direction') or '').lower()\n                if direction not in {'send', 'receive'}:\n                    continue\n                data_type = str(row.get('data_type') or 'unknown').lower()\n                if data_type not in {\n                    'array', 'boolean', 'bigint', 'function', 'null', 'number', 'object',\n                    'string', 'symbol', 'undefined', 'unknown',\n                }:\n                    data_type = 'unknown'\n                peer_origin = str(row.get('peer_origin') or '')[:512]\n                if peer_origin not in {'*', '/', 'null', 'same-origin-default'} and not peer_origin.startswith(('http://', 'https://')):\n                    peer_origin = 'null'\n                keys = row.get('data_keys') if isinstance(row.get('data_keys'), list) else []\n                records.append({\n                    'direction': direction,\n                    'peer_origin': peer_origin,\n                    'same_origin_peer': row.get('same_origin_peer') is True,\n                    'data_type': data_type,\n                    'data_keys': sorted({\n                        str(value)[:80]\n                        for value in keys[:32]\n                        if isinstance(value, str)\n                        and value\n                        and not any(ch in value for ch in '\\\\r\\\\n\\\\x00')\n                    })[:32],\n                })\n            status = str(item.get('status') or '')\n            if status not in {'observed', 'not-observed'}:\n                status = 'not-observed'\n            limitations = item.get('limitations') if isinstance(item.get('limitations'), list) else []\n            result.append({\n                'kind': kind,\n                'wstg_id': 'WSTG-CLNT-11',\n                'observation_only': True,\n                'final_decision': False,\n                'status': status,\n                'listener_count': _positive_int(item.get('listener_count'), 100000),\n                'send_count': _positive_int(item.get('send_count'), 100000),\n                'receive_count': _positive_int(item.get('receive_count'), 100000),\n                'metadata_record_count': len(records),\n                'wildcard_target_count': _positive_int(item.get('wildcard_target_count'), 128),\n                'explicit_target_origin_count': _positive_int(item.get('explicit_target_origin_count'), 128),\n                'cross_origin_receive_count': _positive_int(item.get('cross_origin_receive_count'), 128),\n                'wildcard_target_observed': item.get('wildcard_target_observed') is True,\n                'cross_origin_receive_observed': item.get('cross_origin_receive_observed') is True,\n                'origin_validation_confirmed': False,\n                'payload_values_captured': False,\n                'synthetic_cross_origin_messages_injected': False,\n                'limitations': [\n                    str(value)[:500]\n                    for value in limitations[:4]\n                    if isinstance(value, str)\n                ],\n                'records': records,\n            })\n            continue\n"""
          text = text.replace(marker, assessment + marker, 1)
          target_path.write_text(text, encoding='utf-8')
          PY
      - name: Commit collapsed normalizer
        shell: bash
        run: |
          git rm aegis-platform/backend/fastapi_app/services/native_output_normalizer_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aegis-platform/backend/fastapi_app/services/native_output_normalizer.py
          git commit -m 'Integrate web messaging normalizer without duplication'
          git push origin HEAD:sol-web-messaging-validator
