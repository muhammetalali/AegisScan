name: Identity Protocol Semantic Patch

on:
  push:
    branches:
      - codex/identity-protocol-security-2026-09-12
    paths:
      - 'aegis-platform/scripts/patch_identity_protocol_semantics.py'
      - '.github/workflows/identity-protocol-semantic-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/identity-protocol-security-2026-09-12
          fetch-depth: 0
      - name: Apply identity protocol semantic precision patch
        run: python aegis-platform/scripts/patch_identity_protocol_semantics.py
      - name: Verify semantic guards
        run: |
          grep -F "unsigned JWT alg=none token was accepted" aegis-platform/backend/fastapi_app/services/identity_protocol_security.py
          grep -F "saml_signature_policy" aegis-platform/backend/fastapi_app/services/identity_protocol_security.py
      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aegis-platform/backend/fastapi_app/services/identity_protocol_security.py
          git commit -m 'fix(identity): harden JWT and SAML validation semantics'
          git push origin HEAD:codex/identity-protocol-security-2026-09-12
