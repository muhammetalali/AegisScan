name: Attack Replay Sandbox Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/attack_replay_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0047_attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/services/attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/services/test_attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/routers/attack_replay.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/attack-replay-sandbox-reality.yml'
  push:
    branches: [main, chatgpt-a/attack-replay-sandbox-20260922]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/attack_replay_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0047_attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/services/attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/services/test_attack_replay_sandbox.py'
      - 'aegis-platform/backend/fastapi_app/routers/attack_replay.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/attack-replay-sandbox-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attack-replay-sandbox-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  attack-replay-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-attack-replay-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-attack-replay-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-attack-replay-evidence-hmac-0123456789abcdef
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-attack-replay-credential-fingerprint-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile Attack Replay Sandbox
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/attack_replay_models.py \
            aegis-platform/backend/enterprise/migrations/0047_attack_replay_sandbox.py \
            aegis-platform/backend/fastapi_app/services/attack_replay_sandbox.py \
            aegis-platform/backend/fastapi_app/services/test_attack_replay_sandbox.py \
            aegis-platform/backend/fastapi_app/routers/attack_replay.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: PostgreSQL migration and schema reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.attack_replay_models import AttackReplayRun, AttackReplayScenario

          assert connection.vendor == 'postgresql', connection.vendor
          scenario_fields = {field.name for field in AttackReplayScenario._meta.fields}
          run_fields = {field.name for field in AttackReplayRun._meta.fields}
          assert {
              'organization', 'project', 'attack_path_validation', 'isolation_contract',
              'source_snapshot', 'expected_controls', 'scenario_sha256', 'request_fingerprint',
          } <= scenario_fields
          assert {
              'organization', 'project', 'scenario', 'observed_controls', 'observation_evidence',
              'result_snapshot', 'outcome', 'input_sha256', 'result_sha256', 'comparison_sha256',
          } <= run_fields
          assert AttackReplayScenario._meta.db_table in connection.introspection.table_names()
          assert AttackReplayRun._meta.db_table in connection.introspection.table_names()
          print('ATTACK_REPLAY_DATABASE=POSTGRESQL')
          print('ATTACK_REPLAY_SCHEMA=WIRED')
          PY

      - name: Deterministic replay evidence isolation and tenant reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_attack_replay_sandbox.py \
            --junitxml=/tmp/attack-replay-sandbox-junit.xml

      - name: Validated attack-chain regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_validated_attack_chain.py

      - name: Prove sandbox cannot perform external execution
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()
          from fastapi_app.services.attack_replay_sandbox import (
              ATTACK_REPLAY_ISOLATION_CONTRACT, ATTACK_REPLAY_POLICY_VERSION,
          )

          service = Path('fastapi_app/services/attack_replay_sandbox.py').read_text()
          router = Path('fastapi_app/routers/attack_replay.py').read_text()
          assert ATTACK_REPLAY_POLICY_VERSION == 'attack-replay-sandbox.v1'
          assert ATTACK_REPLAY_ISOLATION_CONTRACT['execution_mode'] == 'deterministic-simulation'
          assert ATTACK_REPLAY_ISOLATION_CONTRACT['network'] == 'deny'
          assert ATTACK_REPLAY_ISOLATION_CONTRACT['credentials'] == 'none'
          assert ATTACK_REPLAY_ISOLATION_CONTRACT['external_side_effects'] is False
          for forbidden in ('subprocess', 'os.system', 'requests.', 'socket.', 'shell=True'):
              assert forbidden not in service
          assert "metadata.get('replay_controls')" in service
          assert "ConfigDict(extra='forbid')" in router
          assert "'production_execution_performed': False" in service
          assert "'network_access_performed': False" in service
          assert "'credentials_used': False" in service
          print('ATTACK_REPLAY_EXTERNAL_SIDE_EFFECTS=DENIED')
          print('ATTACK_REPLAY_CONTROL_EVIDENCE=EXPLICIT')
          print('ATTACK_REPLAY_DETERMINISM=WIRED')
          PY

      - name: Retain Attack Replay Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-replay-sandbox-${{ github.sha }}
          path: /tmp/attack-replay-sandbox-junit.xml
          retention-days: 30
          if-no-files-found: warn
