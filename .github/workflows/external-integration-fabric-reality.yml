name: External Integration Fabric Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/**'
      - 'aegis-platform/backend/fastapi_app/services/external_fabric.py'
      - 'aegis-platform/backend/fastapi_app/routers/plugin_registry.py'
      - 'aegis-platform/backend/fastapi_app/routers/enterprise_extra.py'
      - 'aegis-platform/backend/fastapi_app/routers/intelligence.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/external-integration-fabric-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/**'
      - 'aegis-platform/backend/fastapi_app/services/external_fabric.py'
      - 'aegis-platform/backend/fastapi_app/routers/plugin_registry.py'
      - 'aegis-platform/backend/fastapi_app/routers/enterprise_extra.py'
      - 'aegis-platform/backend/fastapi_app/routers/intelligence.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/external-integration-fabric-reality.yml'

permissions:
  contents: read

concurrency:
  group: external-integration-fabric-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  reality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      AUTHORIZED_SCAN_TARGETS: '127.0.0.1'
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile integration fabric
        run: |
          python -m compileall -q             aegis-platform/backend/enterprise             aegis-platform/backend/fastapi_app/services/external_fabric.py             aegis-platform/backend/fastapi_app/routers/plugin_registry.py             aegis-platform/backend/fastapi_app/routers/enterprise_extra.py             aegis-platform/backend/fastapi_app/routers/intelligence.py             aegis-platform/backend/fastapi_app/routers/capabilities.py
      - name: Validate migrations are complete
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Prove external integration fabric
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q enterprise/test_external_integration_fabric.py
      - name: Prove FastAPI integration import
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          paths=set(app.openapi().get('paths', {}))
          required={
              '/api/v1/plugins/packages',
              '/api/v1/plugins/packages/{package_id}/approve',
              '/api/v1/plugins/packages/{package_id}/activate',
              '/api/v1/intelligence/indicator/{provider}/{indicator}',
              '/api/v1/enterprise/integrations/{integration_id}/sync',
          }
          missing=sorted(required-paths)
          assert not missing, missing
          print('external-integration-fabric-import=PASS')
          PY
