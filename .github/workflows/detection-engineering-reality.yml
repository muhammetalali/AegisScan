name: Detection Engineering Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/detection_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0022_detection_as_code_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/services/test_detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/routers/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/routers/enterprise_gap.py'
      - '.github/workflows/detection-engineering-reality.yml'
  push:
    branches: [main, codex/detection-as-code-plane-2026-09-13]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/detection_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0022_detection_as_code_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/services/test_detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/routers/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/routers/enterprise_gap.py'
      - '.github/workflows/detection-engineering-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detection-engineering-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  detection-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-detection-engineering-django-secret-key-0123456789abcdef
      JWT_SECRET_KEY: ci-detection-engineering-jwt-secret-key-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-detection-engineering-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-detection-engineering-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile detection engineering plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/apps.py \
            aegis-platform/backend/enterprise/detection_models.py \
            aegis-platform/backend/enterprise/migrations/0022_detection_as_code_plane.py \
            aegis-platform/backend/fastapi_app/services/detection_engineering.py \
            aegis-platform/backend/fastapi_app/routers/detection_engineering.py \
            aegis-platform/backend/fastapi_app/routers/enterprise_gap.py \
            aegis-platform/backend/fastapi_app/services/test_detection_engineering.py
      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.detection_models import DetectionRule, DetectionRevision, DetectionValidation, DetectionPublication, DetectionEvent
          assert connection.vendor == 'postgresql', connection.vendor
          assert DetectionRule._meta.app_label == 'enterprise'
          assert DetectionRevision._meta.get_field('content_sha256').max_length == 64
          assert any(c.name == 'uniq_detection_validation_input' for c in DetectionValidation._meta.constraints)
          assert any(c.name == 'uniq_detection_publication_package' for c in DetectionPublication._meta.constraints)
          assert DetectionEvent._meta.get_field('entry_sha256').unique is True
          print('DETECTION_ENGINEERING_DATABASE=POSTGRESQL')
          print('DETECTION_ENGINEERING_DB_INVARIANTS=PASS')
          PY
      - name: Verify detection API and compiler contracts
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.routers.detection_engineering import DetectionRevisionCreate, DetectionValidationCreate, DetectionPublicationCreate
          from fastapi_app.services.detection_engineering import compile_spec
          paths=app.openapi()['paths']
          base='/api/v1/enterprise-gap/detections/projects/{project_id}'
          assert base + '/rules' in paths
          assert base + '/revisions/{revision_id}/validate' in paths
          assert base + '/revisions/{revision_id}/publish' in paths
          for model in (DetectionRevisionCreate, DetectionValidationCreate, DetectionPublicationCreate):
              assert model.model_config.get('extra') == 'forbid'
          compiled=compile_spec({'logsource':'endpoint.process','condition':'all','match':[{'field':'process.name','operator':'equals','value':'powershell.exe'}],'severity':'high','attack_techniques':['T1059.001'],'description':''})
          assert set(compiled)=={'splunk','elastic_kql','sentinel_kql','qradar_aql'}
          print('DETECTION_ENGINEERING_API=PASS')
          print('DETECTION_ENGINEERING_COMPILERS=PASS')
          PY
      - name: Run detection behavior and transport reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_detection_engineering.py --junitxml=/tmp/detection-engineering-junit.xml
      - name: Run governed finding regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_finding_confirmation.py fastapi_app/services/test_finding_disposition.py --junitxml=/tmp/detection-regression-junit.xml
      - name: Retain detection engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-engineering-reality-${{ github.sha }}
          path: |
            /tmp/detection-engineering-junit.xml
            /tmp/detection-regression-junit.xml
          retention-days: 30
          if-no-files-found: warn
