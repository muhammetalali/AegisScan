name: IAST Enterprise Security Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/iast_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0040_iast_enterprise_security_plane.py'
      - 'aegis-platform/backend/django_project/evidence/models.py'
      - 'aegis-platform/backend/fastapi_app/services/iast_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_iast_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/iast.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/iast-enterprise-security-reality.yml'
  push:
    branches: [main, chatgpt-a/iast-enterprise-security-plane-20260921]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/iast_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0040_iast_enterprise_security_plane.py'
      - 'aegis-platform/backend/django_project/evidence/models.py'
      - 'aegis-platform/backend/fastapi_app/services/iast_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_iast_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/iast.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/iast-enterprise-security-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iast-enterprise-security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  iast-enterprise-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-iast-enterprise-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-iast-enterprise-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-iast-evidence-hmac-key-0123456789abcdef
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-iast-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile IAST plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/iast_models.py \
            aegis-platform/backend/enterprise/migrations/0040_iast_enterprise_security_plane.py \
            aegis-platform/backend/fastapi_app/services/iast_security.py \
            aegis-platform/backend/fastapi_app/services/test_iast_security.py \
            aegis-platform/backend/fastapi_app/routers/iast.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: PostgreSQL schema and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()

          from django.db import connection
          from enterprise.iast_models import IASTObservation, IASTSession

          assert connection.vendor == 'postgresql', connection.vendor
          session_fields = {field.name for field in IASTSession._meta.fields}
          observation_fields = {field.name for field in IASTObservation._meta.fields}
          assert {
              'organization', 'project', 'asset', 'scan', 'authorization_decision',
              'provider_identity_sha256', 'request_fingerprint', 'contract_fingerprint',
          } <= session_fields
          assert {
              'session', 'finding', 'evidence', 'qualification', 'observation_sha256',
              'request_fingerprint', 'data_labels',
          } <= observation_fields
          print('IAST_DATABASE=POSTGRESQL')
          print('IAST_SCHEMA=WIRED')
          PY

      - name: IAST tenant authorization evidence and replay reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_iast_security.py \
            --junitxml=/tmp/iast-enterprise-junit.xml

      - name: Evidence qualification and governed evidence regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_evidence_qualification.py \
            django_project/evidence/test_governed_oast_runtime.py

      - name: Prove IAST redaction and governed lineage wiring
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()

          from fastapi_app.services.iast_security import IAST_CAPABILITY_ID, IAST_POLICY_VERSION

          service = Path('fastapi_app/services/iast_security.py').read_text()
          router = Path('fastapi_app/routers/iast.py').read_text()
          evidence = Path('django_project/evidence/models.py').read_text()
          assert IAST_CAPABILITY_ID == 'iast.runtime-taint-flow'
          assert IAST_POLICY_VERSION == 'iast-enterprise.v1'
          assert "'raw_values_captured': False" in service
          assert "ConfigDict(extra='forbid')" in router
          assert "{'oast', 'iast'}" in evidence
          assert 'qualify_evidence(' in service
          assert 'authorization_decision_id' in service
          assert 'execution_ref' in service
          print('IAST_REDACTION=FAIL_CLOSED')
          print('IAST_EVIDENCE_QUALIFICATION=WIRED')
          print('IAST_AUTHORIZATION_LINEAGE=WIRED')
          PY

      - name: Retain IAST Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iast-enterprise-security-${{ github.sha }}
          path: /tmp/iast-enterprise-junit.xml
          retention-days: 30
          if-no-files-found: warn
