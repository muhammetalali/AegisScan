name: External Identity Live Provider Reality

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VALIDATE to execute configured real external identity acceptance'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/live-acceptance-requests/external-identity.json'

permissions:
  contents: read

concurrency:
  group: external-identity-live-provider-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  external-identity-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      OIDC_DISCOVERY_URL: ${{ secrets.AEGIS_IDENTITY_OIDC_DISCOVERY_URL }}
      OIDC_EXPECTED_ISSUER: ${{ secrets.AEGIS_IDENTITY_OIDC_EXPECTED_ISSUER }}
      SAML_METADATA_URL: ${{ secrets.AEGIS_IDENTITY_SAML_METADATA_URL }}
      SCIM_BASE_URL: ${{ secrets.AEGIS_IDENTITY_SCIM_BASE_URL }}
      SCIM_BEARER_TOKEN: ${{ secrets.AEGIS_IDENTITY_SCIM_BEARER_TOKEN }}
      IDENTITY_CA_BUNDLE: ${{ secrets.AEGIS_IDENTITY_CA_BUNDLE }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Authorize exact-main external identity acceptance
        shell: bash
        env:
          AEGIS_EVENT_BEFORE: ${{ github.event.before }}
          AEGIS_LIVE_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python aegis-platform/scripts/live_acceptance_request.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --current-sha "$GITHUB_SHA" \
            --event-before "${AEGIS_EVENT_BEFORE:-}" \
            --confirm "${AEGIS_LIVE_CONFIRM:-}" \
            --request-file .github/live-acceptance-requests/external-identity.json \
            --scope external-identity \
            --required-confirm VALIDATE \
            | tee /tmp/aegis-external-identity-authorization.json
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Install live identity dependencies
        run: python -m pip install requests cryptography defusedxml

      - name: Require at least one complete external identity binding
        id: configured
        shell: bash
        run: |
          set -euo pipefail
          count=0
          if { [ -n "${OIDC_DISCOVERY_URL:-}" ] && [ -z "${OIDC_EXPECTED_ISSUER:-}" ]; } || \
             { [ -z "${OIDC_DISCOVERY_URL:-}" ] && [ -n "${OIDC_EXPECTED_ISSUER:-}" ]; }; then
            echo '::error::OIDC discovery URL and expected issuer must be configured together'
            exit 78
          fi
          if [ -n "${OIDC_DISCOVERY_URL:-}" ]; then count=$((count + 1)); fi
          if [ -n "${SAML_METADATA_URL:-}" ]; then count=$((count + 1)); fi
          if { [ -n "${SCIM_BASE_URL:-}" ] && [ -z "${SCIM_BEARER_TOKEN:-}" ]; } || \
             { [ -z "${SCIM_BASE_URL:-}" ] && [ -n "${SCIM_BEARER_TOKEN:-}" ]; }; then
            echo '::error::SCIM base URL and bearer token must be configured together'
            exit 78
          fi
          if [ -n "${SCIM_BASE_URL:-}" ]; then count=$((count + 1)); fi
          if [ "$count" -lt 1 ]; then
            echo '::error::External Identity Live Provider Reality requires at least one real OIDC, SAML, or SCIM binding'
            exit 78
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Configured external identity surfaces: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize protected identity material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/external-identity"
          if [ -n "${SCIM_BEARER_TOKEN:-}" ]; then
            printf '%s' "$SCIM_BEARER_TOKEN" > "$RUNNER_TEMP/external-identity/scim.token"
            chmod 0600 "$RUNNER_TEMP/external-identity/scim.token"
          fi
          if [ -n "${IDENTITY_CA_BUNDLE:-}" ]; then
            printf '%s\n' "$IDENTITY_CA_BUNDLE" > "$RUNNER_TEMP/external-identity/ca.pem"
            chmod 0600 "$RUNNER_TEMP/external-identity/ca.pem"
          fi

      - name: Execute real read-only external identity validation
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --source-sha "$GITHUB_SHA"
            --output "$RUNNER_TEMP/external-identity/proof.json"
          )
          if [ -n "${OIDC_DISCOVERY_URL:-}" ]; then
            args+=(--oidc-discovery-url "$OIDC_DISCOVERY_URL" --oidc-expected-issuer "$OIDC_EXPECTED_ISSUER")
          fi
          if [ -n "${SAML_METADATA_URL:-}" ]; then
            args+=(--saml-metadata-url "$SAML_METADATA_URL")
          fi
          if [ -n "${SCIM_BASE_URL:-}" ]; then
            args+=(--scim-base-url "$SCIM_BASE_URL" --scim-bearer-file "$RUNNER_TEMP/external-identity/scim.token")
          fi
          if [ -n "${IDENTITY_CA_BUNDLE:-}" ]; then
            args+=(--ca-bundle "$RUNNER_TEMP/external-identity/ca.pem")
          fi
          python aegis-platform/backend/scripts/external_identity_live_reality.py "${args[@]}"

      - name: Prove secret-safe immutable identity evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'external-identity' / 'proof.json').read_text())
          assert proof['schema'] == 'aegis.external-identity-live-proof.v1'
          assert proof['status'] == 'success'
          assert proof['source_sha'] == os.environ['GITHUB_SHA']
          assert proof['read_only'] is True
          assert proof['ambient_credentials_used'] is False
          assert proof['configured_types']
          print('EXTERNAL_IDENTITY_LIVE_PROOF=PASS')
          PY
          if [ -n "${SCIM_BEARER_TOKEN:-}" ] && grep -R -F -- "$SCIM_BEARER_TOKEN" "$RUNNER_TEMP/external-identity" --exclude=scim.token; then
            echo 'SCIM bearer token leaked into identity evidence' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: external-identity-live-proof-${{ github.sha }}
          path: ${{ runner.temp }}/external-identity/proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy protected identity material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f /tmp/aegis-external-identity-authorization.json
          rm -f "$RUNNER_TEMP/external-identity/scim.token" "$RUNNER_TEMP/external-identity/ca.pem"
