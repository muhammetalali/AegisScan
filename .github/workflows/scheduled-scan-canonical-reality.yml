name: Scheduled Scan Canonical Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/django_project/projects/models.py'
      - 'aegis-platform/backend/django_project/projects/migrations/**'
      - 'aegis-platform/backend/fastapi_app/services/scheduled_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_scheduled_execution.py'
      - 'aegis-platform/backend/fastapi_app/tasks/scheduled_scans.py'
      - 'aegis-platform/backend/fastapi_app/routers/scheduled_scans.py'
      - 'aegis-platform/backend/fastapi_app/celery_app.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/backend/scripts/scheduled_scan_canonical_reality.py'
      - 'aegis-platform/backend/requirements.txt'
      - '.github/workflows/scheduled-scan-canonical-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/django_project/projects/models.py'
      - 'aegis-platform/backend/django_project/projects/migrations/**'
      - 'aegis-platform/backend/fastapi_app/services/scheduled_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_scheduled_execution.py'
      - 'aegis-platform/backend/fastapi_app/tasks/scheduled_scans.py'
      - 'aegis-platform/backend/fastapi_app/routers/scheduled_scans.py'
      - 'aegis-platform/backend/fastapi_app/celery_app.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/backend/scripts/scheduled_scan_canonical_reality.py'
      - 'aegis-platform/backend/requirements.txt'
      - '.github/workflows/scheduled-scan-canonical-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-scan-canonical-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-scheduled-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: scheduled-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://aegis:scheduled-ci@127.0.0.1:5432/aegisdb
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      SECRET_KEY: scheduled-ci-django-secret-0123456789abcdef0123456789abcdef
      JWT_SECRET_KEY: scheduled-ci-jwt-secret-0123456789abcdef0123456789abcdef
      DEBUG: 'False'
      SECURE_SSL_REDIRECT: 'False'
      AUTH_COOKIE_SECURE: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost
      CSRF_TRUSTED_ORIGINS: http://localhost
      AUTHORIZED_SCAN_TARGETS: 127.0.0.1/32
      SCANNER_EGRESS_PRIVATE_TARGETS: 127.0.0.1/32
      PYTHONPATH: aegis-platform/backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r aegis-platform/backend/requirements.txt

      - name: Validate Django model and migration contract
        working-directory: aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run scheduled execution contract tests
        working-directory: aegis-platform/backend
        run: pytest -q fastapi_app/services/test_scheduled_execution.py

      - name: Start authorized HTTP target
        working-directory: aegis-platform/backend
        run: |
          python -m http.server 18081 --bind 127.0.0.1 >/tmp/scheduled-http-target.log 2>&1 &
          echo $! >/tmp/scheduled-http-target.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scheduled-http-target.log
          exit 1

      - name: Start real Celery scheduled/scanner worker
        working-directory: aegis-platform/backend
        run: |
          celery -A fastapi_app.celery_app.celery_app worker             --loglevel=INFO             --concurrency=1             -Q default,scanners,browser             --hostname=scheduled-reality@%h             >/tmp/scheduled-celery.log 2>&1 &
          echo $! >/tmp/scheduled-celery.pid
          for _ in $(seq 1 45); do
            if celery -A fastapi_app.celery_app.celery_app inspect ping --timeout=2 2>/dev/null | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scheduled-celery.log
          exit 1

      - name: Prove canonical ScheduledScan end-to-end
        working-directory: aegis-platform/backend
        run: python scripts/scheduled_scan_canonical_reality.py | tee /tmp/scheduled-scan-canonical-reality.json

      - name: Capture diagnostics
        if: always()
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            echo "=== celery ==="
            tail -n 500 /tmp/scheduled-celery.log 2>/dev/null || true
            echo "=== http target ==="
            tail -n 200 /tmp/scheduled-http-target.log 2>/dev/null || true
          } > /tmp/scheduled-scan-canonical-diagnostics.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-scan-canonical-reality-${{ github.run_id }}
          path: |
            /tmp/scheduled-scan-canonical-reality.json
            /tmp/scheduled-scan-canonical-diagnostics.txt
          if-no-files-found: warn
