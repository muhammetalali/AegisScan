name: Generate Enterprise Migration

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: python -m pip install -r aegis-platform/backend/requirements.txt
      - working-directory: aegis-platform/backend
        run: python manage.py makemigrations enterprise
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-migration
          path: aegis-platform/backend/enterprise/migrations/
          if-no-files-found: error
