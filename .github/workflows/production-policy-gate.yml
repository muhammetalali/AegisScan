name: Production Policy Gate

on:
  push:
    branches: [main, codex/full-contract-ui-audit-2026-09-03]
    paths:
      - 'aegis-platform/docker-compose.yml'
      - 'aegis-platform/docker-compose.prod.yml'
      - 'aegis-platform/docker/scanner-egress/**'
      - 'aegis-platform/docker-compose.backup.yml'
      - 'aegis-platform/docker/backup/**'
      - 'aegis-platform/backend/Dockerfile.*'
      - 'aegis-platform/scripts/production_policy_gate.py'
      - 'tests/test_production_policy_gate.py'
      - '.github/workflows/production-policy-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/docker-compose.yml'
      - 'aegis-platform/docker-compose.prod.yml'
      - 'aegis-platform/docker/scanner-egress/**'
      - 'aegis-platform/docker-compose.backup.yml'
      - 'aegis-platform/docker/backup/**'
      - 'aegis-platform/backend/Dockerfile.*'
      - 'aegis-platform/scripts/production_policy_gate.py'
      - 'tests/test_production_policy_gate.py'
      - '.github/workflows/production-policy-gate.yml'
  workflow_dispatch:

concurrency:
  group: production-policy-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  production-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-policy-secret-not-for-production
      SECRET_KEY: ci-policy-django-key-012345678901234567890123456789
      JWT_SECRET_KEY: ci-policy-jwt-key-012345678901234567890123456789
      DATABASE_URL: postgresql://aegis:ci-policy-secret-not-for-production@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-policy-browser-fingerprint-key
      AUTHORIZED_SCAN_TARGETS: production-policy.example
      AEGIS_BACKUP_S3_ENDPOINT: https://backups.example.com
      AEGIS_BACKUP_S3_BUCKET: aegisscan-production-backups
      AEGIS_BACKUP_S3_CREDENTIALS_FILE: /run/aegis-policy/s3.json
      AEGIS_BACKUP_ENCRYPTION_KEY_FILE: /run/aegis-policy/backup.key
      AEGIS_BACKUP_REQUIRE_VERSIONING: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install policy test dependency
        run: python -m pip install pytest==9.1.1
      - name: Prepare non-secret policy environment
        working-directory: aegis-platform
        run: |
          printf '%s\n' \
            'DEBUG=False' \
            'SECRET_KEY=ci-policy-django-key-012345678901234567890123456789' \
            'JWT_SECRET_KEY=ci-policy-jwt-key-012345678901234567890123456789' \
            'DATABASE_URL=postgresql://aegis:ci-policy-secret-not-for-production@postgres:5432/aegisdb' \
            'REDIS_URL=redis://redis:6379/0' \
            'CELERY_BROKER_URL=redis://redis:6379/0' \
            'CELERY_RESULT_BACKEND=redis://redis:6379/0' \
            'ALLOWED_HOSTS=localhost,nginx' \
            'AUTHORIZED_SCAN_TARGETS=production-policy.example' \
            'SCANNER_EGRESS_PRIVATE_TARGETS=' > backend/.env
      - name: Resolve production Compose model
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.backup.yml config --format json > /tmp/aegis-production-compose.json
      - name: Enforce production policy
        run: python aegis-platform/scripts/production_policy_gate.py /tmp/aegis-production-compose.json
      - name: Unit-test fail-closed policy decisions
        run: python -m pytest -q tests/test_production_policy_gate.py
      - name: Build production execution-plane images
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.backup.yml build django fastapi celery_worker scanner_worker browser_worker scanner_egress backup
