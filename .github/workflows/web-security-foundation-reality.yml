name: Web Security Foundation Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/web_security_models.py'
      - 'aegis-platform/backend/enterprise/models.py'
      - 'aegis-platform/backend/enterprise/migrations/0016_web_security_foundation.py'
      - 'aegis-platform/backend/enterprise/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/contracts/web_security_v2.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/e2e/web_security_foundation_e2e.py'
      - 'aegis-platform/e2e/fixtures/bac-target/**'
      - 'aegis-platform/e2e/fixtures/multi-tenant-target/**'
      - '.github/workflows/web-security-foundation-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/web_security_models.py'
      - 'aegis-platform/backend/enterprise/models.py'
      - 'aegis-platform/backend/enterprise/migrations/0016_web_security_foundation.py'
      - 'aegis-platform/backend/enterprise/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/contracts/web_security_v2.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/e2e/web_security_foundation_e2e.py'
      - 'aegis-platform/e2e/fixtures/bac-target/**'
      - 'aegis-platform/e2e/fixtures/multi-tenant-target/**'
      - '.github/workflows/web-security-foundation-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-security-foundation-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-authorization-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-web-security-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-web-security-jwt-signing-key-0123456789abcdef0123456789abcdef
      AEGIS_EVIDENCE_HMAC_KEY: ci-web-security-evidence-hmac-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      CSRF_TRUSTED_ORIGINS: 'http://localhost,http://127.0.0.1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt

      - name: Install package and backend dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile Web Security v2 implementation
        working-directory: aegis-platform/backend
        run: |
          set -euo pipefail
          python -m compileall -q             enterprise/web_security_models.py             enterprise/models.py             fastapi_app/contracts/web_security_v2.py             fastapi_app/services/web_security_foundation.py             fastapi_app/routers/web_security.py             fastapi_app/main.py             ../e2e/web_security_foundation_e2e.py             ../e2e/fixtures/bac-target/app.py             ../e2e/fixtures/multi-tenant-target/app.py

      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Foundation and authorization acceptance suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q             --junitxml=web-security-foundation-results.xml             fastapi_app/services/test_web_security_foundation.py             enterprise/test_web_security_foundation.py             fastapi_app/routers/test_web_security_foundation.py

      - name: Live BAC and multi-tenant HTTP E2E
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
          BAC_TARGET_URL: http://127.0.0.1:18081
          MULTI_TENANT_TARGET_URL: http://127.0.0.1:18082
          WEB_SECURITY_E2E_EVIDENCE: ${{ github.workspace }}/aegis-platform/backend/web-security-foundation-e2e-evidence.json
        run: |
          set -euo pipefail

          PORT=18081 python ../e2e/fixtures/bac-target/app.py > bac-target.log 2>&1 &
          BAC_PID=$!
          PORT=18082 python ../e2e/fixtures/multi-tenant-target/app.py > multi-tenant-target.log 2>&1 &
          TENANT_PID=$!

          cleanup() {
            kill "$BAC_PID" "$TENANT_PID" 2>/dev/null || true
            wait "$BAC_PID" "$TENANT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for target in http://127.0.0.1:18081/health http://127.0.0.1:18082/health; do
            ready=0
            for _attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$target" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Fixture did not become ready: $target" >&2
              exit 1
            fi
          done

          python ../e2e/web_security_foundation_e2e.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('web-security-foundation-e2e-evidence.json')
          data = json.loads(path.read_text())
          assert data['schema'] == 'aegis.web-security-foundation-e2e.v1'
          assert data['summary']['total'] == 6
          assert data['summary']['passed'] == 4
          assert data['summary']['failed'] == 2
          assert data['summary']['cross_tenant_cases'] == 4
          assert len(data['proofs']['true_positive_vulnerable_cases']) == 2
          assert len(data['proofs']['cross_tenant_isolation_fixed']) == 2
          assert data['proofs']['negative_invariant_passed'] is True
          assert data['proofs']['persisted_observation_count'] == 6
          print('web-security-foundation-live-e2e-evidence-ok')
          PY

      - name: Retain foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-security-foundation-reality-${{ github.sha }}
          path: |
            aegis-platform/backend/web-security-foundation-results.xml
            aegis-platform/backend/web-security-foundation-e2e-evidence.json
            aegis-platform/backend/bac-target.log
            aegis-platform/backend/multi-tenant-target.log
          if-no-files-found: error
          retention-days: 30
