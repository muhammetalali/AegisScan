name: AegisScan Production Runtime Reality Gate

on:
  push:
    branches: [main, codex/full-contract-ui-audit-2026-09-03]
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis/**'
      - 'tests/test_production_runtime_imports.py'
      - '.github/workflows/production-runtime-reality-gate.yml'
  pull_request:
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis/**'
      - 'tests/test_production_runtime_imports.py'
      - '.github/workflows/production-runtime-reality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-runtime-reality:
    name: Real application import and runtime integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: django_project.settings
      PYTHONPATH: aegis-platform/backend:.
      SECRET_KEY: ci-production-reality-secret-key-012345678901234567890123
      JWT_SECRET_KEY: ci-production-reality-jwt-secret-key-012345678901234567890123
      DEBUG: '0'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegisdb
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      WS_ALLOW_QUERY_TOKEN: '0'
      LOG_TO_FILE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify canonical checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          echo "Canonical HEAD verified: $actual_sha"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real platform dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r aegis-platform/backend/requirements.txt
          python -m pip install ruff==0.8.6
      - name: Django system checks
        working-directory: aegis-platform/backend
        run: python manage.py check --deploy
      - name: Production backend syntax gate
        run: python -m compileall -q aegis-platform/backend aegis tests
      - name: Undefined-name static gate on production backend
        run: ruff check aegis-platform/backend --select F821 --output-format concise
      - name: Production backend import resolution and runtime tests
        run: python -m pytest -q tests/test_production_runtime_imports.py
