name: Generic Business Logic Security Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0039_business_logic_assessment.py'
      - 'aegis-platform/backend/fastapi_app/services/business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/generic-business-logic-security-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0039_business_logic_assessment.py'
      - 'aegis-platform/backend/fastapi_app/services/business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/business_logic_security.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/generic-business-logic-security-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-business-logic-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  generic-business-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-generic-business-logic-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-generic-business-logic-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-generic-business-logic-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-generic-business-logic-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile generic business logic plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/governed_action_models.py \
            aegis-platform/backend/fastapi_app/services/business_logic_security.py \
            aegis-platform/backend/fastapi_app/services/test_business_logic_security.py \
            aegis-platform/backend/fastapi_app/routers/business_logic_security.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: Django schema and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.governed_action_models import BusinessLogicAssessment
          assert connection.vendor == 'postgresql', connection.vendor
          assert BusinessLogicAssessment._meta.get_field('assessment_sha256').unique is True
          print('GENERIC_BUSINESS_LOGIC_DATABASE=POSTGRESQL')
          print('GENERIC_BUSINESS_LOGIC_IMMUTABLE_DIGEST=PASS')
          PY

      - name: Workflow abuse invariant suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_business_logic_security.py \
            fastapi_app/services/test_governed_action_requests.py \
            fastapi_app/services/test_governed_asset_authorization.py \
            --junitxml=/tmp/generic-business-logic-junit.xml

      - name: Verify API and invariant contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.services.business_logic_security import BUSINESS_LOGIC_CONTRACT_VERSION

          paths = set(app.openapi()['paths'])
          expected = {
              '/api/v1/assurance/governance/business-logic/requests/{request_id}/assess',
              '/api/v1/assurance/governance/business-logic/requests/{request_id}/assessments',
          }
          assert expected.issubset(paths), sorted(path for path in paths if 'business-logic' in path)
          assert BUSINESS_LOGIC_CONTRACT_VERSION == 'aegis.business-logic.v1'
          print('GENERIC_BUSINESS_LOGIC_API=PASS')
          print('GENERIC_BUSINESS_LOGIC_FAIL_CLOSED_INVARIANTS=PASS')
          PY

      - name: Retain generic business logic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-business-logic-${{ github.sha }}
          path: /tmp/generic-business-logic-junit.xml
          retention-days: 30
          if-no-files-found: warn
