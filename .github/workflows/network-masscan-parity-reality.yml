name: Network Masscan Parity Reality

'on':
  pull_request:
    branches: [main]
    paths: &masscan_paths
      - 'aegis-platform/backend/fastapi_app/services/masscan_semantic_parity.py'
      - 'aegis-platform/backend/fastapi_app/services/test_masscan_semantic_parity.py'
      - 'aegis-platform/backend/fastapi_app/services/scanner_adapters.py'
      - 'aegis-platform/backend/fastapi_app/services/test_scanner_adapters_masscan_network.py'
      - 'aegis-platform/kali/runner/network_masscan_parity_service.py'
      - 'aegis-platform/kali/tests/test_network_masscan_parity_contract.py'
      - 'aegis-platform/kali/tool-manifest.json'
      - 'aegis-platform/kali/Dockerfile.profiles'
      - 'docs/NETWORK_MASSCAN_SEMANTIC_PARITY.md'
      - '.github/workflows/network-masscan-parity-reality.yml'
  push:
    branches: [main]
    paths: *masscan_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-masscan-parity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  parity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${AEGIS_EXACT_HEAD}"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile parity contracts
        run: |
          python -m py_compile \
            aegis-platform/kali/runner/network_masscan_parity_service.py \
            aegis-platform/backend/fastapi_app/services/masscan_semantic_parity.py \
            aegis-platform/backend/fastapi_app/services/test_masscan_semantic_parity.py \
            aegis-platform/backend/fastapi_app/services/scanner_adapters.py \
            aegis-platform/backend/fastapi_app/services/test_scanner_adapters_masscan_network.py \
            aegis-platform/kali/tests/test_network_masscan_parity_contract.py
      - name: Prove semantic admission and adapter contracts
        env:
          PYTHONPATH: aegis-platform/backend
        run: >-
          python -m pytest -q -c /dev/null -p no:cacheprovider --noconftest
          aegis-platform/backend/fastapi_app/services/test_masscan_semantic_parity.py
          aegis-platform/backend/fastapi_app/services/test_scanner_adapters_masscan_network.py
          aegis-platform/kali/tests/test_network_masscan_parity_contract.py
      - name: Capture exact-head contract evidence
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/head-sha.txt
          python - <<'PY' > artifacts/network-masscan-parity-contract.json
          import json
          print(json.dumps({
              'schema':'aegis.network-masscan-parity-contract.v1',
              'capability_id':'network.masscan',
              'candidate_profile':'network',
              'candidate_mode':'parity-only',
              'production_cutover':False,
              'legacy_retirement':False,
              'raw_command_fields_allowed':False,
              'loopback_provider_required':True,
              'authorization_binding_required':True,
              'scope_binding_required':True,
              'target_binding_required':True,
              'link_layer_binding_required':True,
              'link_layer_fields':['interface','adapter_ip','adapter_mac','router_mac'],
              'scanner_capabilities':['CAP_NET_RAW'],
              'trusted_namespace_owner_capabilities':['CAP_NET_ADMIN'],
              'semantic_fields':['ip','protocol','port'],
              'real_dual_run_required':True,
              'public_internet_fixture_allowed':False,
          },sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: network-masscan-parity-contract-${{ env.AEGIS_EXACT_HEAD }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
