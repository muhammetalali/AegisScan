name: Performance Load Soak Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis-platform/scripts/load_reality.py'
      - 'aegis-platform/scripts/test_load_reality.py'
      - '.github/workflows/performance-load-soak-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis-platform/scripts/load_reality.py'
      - '.github/workflows/performance-load-soak-reality.yml'

permissions:
  contents: read

concurrency:
  group: performance-load-soak-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  load-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      AUTHORIZED_SCAN_TARGETS: '127.0.0.1'
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Prove load harness measurement semantics
        run: python -m pytest -q aegis-platform/scripts/test_load_reality.py
      - name: Migrate clean database
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python manage.py migrate --noinput
      - name: Prove readiness monitor contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/test_readiness_monitor.py
      - name: Start real FastAPI stack
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          set -euo pipefail
          python -m uvicorn fastapi_app.main:app --host 127.0.0.1 --port 8001 --workers 4 --loop uvloop --http httptools --no-access-log > /tmp/aegis-load-api.log 2>&1 &
          echo $! > /tmp/aegis-load-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aegis-load-api.log
          exit 1
      - name: Warm-up
        run: |
          python aegis-platform/scripts/load_reality.py             --base-url http://127.0.0.1:8001             --path /health --path /ready             --stage 5:5             --stage-warmup-seconds 0             --max-p95-ms 1000 --max-error-rate 0.02 --min-rps 1 --min-requests 20             --output /tmp/warmup.json
      - name: Load capacity and soak reality
        run: |
          python aegis-platform/scripts/load_reality.py             --base-url http://127.0.0.1:8001             --path /health --path /ready             --stage 10:15 --stage 30:20 --stage 60:20 --stage 25:90             --stage-warmup-seconds 2             --max-p95-ms 500 --max-error-rate 0.01 --min-rps 5 --min-requests 500             --output performance-reality.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-load-soak-${{ github.sha }}
          path: performance-reality.json
          retention-days: 30
          if-no-files-found: warn
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/aegis-load-api.pid ]; then kill "$(cat /tmp/aegis-load-api.pid)" 2>/dev/null || true; fi
          cat /tmp/aegis-load-api.log 2>/dev/null || true
