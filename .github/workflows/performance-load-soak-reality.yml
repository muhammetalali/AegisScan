name: Performance Load Soak Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis-platform/scripts/load_reality.py'
      - 'aegis-platform/scripts/release_capacity_reality.py'
      - 'aegis-platform/scripts/test_release_capacity_reality.py'
      - 'aegis-platform/scripts/test_load_reality.py'
      - 'aegis-platform/e2e/external_black_box_e2e.py'
      - 'aegis-platform/docker-compose.nmap-default-kali.yml'
      - 'aegis-platform/kali/**'
      - '.github/workflows/performance-load-soak-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/**'
      - 'aegis-platform/scripts/load_reality.py'
      - 'aegis-platform/scripts/release_capacity_reality.py'
      - 'aegis-platform/scripts/test_release_capacity_reality.py'
      - '.github/workflows/performance-load-soak-reality.yml'

  workflow_dispatch:
    inputs:
      profile:
        description: 'ci uses bounded gates; release executes the extended final soak on exact main SHA'
        required: true
        default: ci
        type: choice
        options: [ci, release]

permissions:
  contents: read

concurrency:
  group: performance-load-soak-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  load-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      DEBUG: 'False'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      AUTHORIZED_SCAN_TARGETS: '127.0.0.1'
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$AEGIS_EXACT_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Prove load harness measurement semantics
        run: python -m pytest -q aegis-platform/scripts/test_load_reality.py
      - name: Migrate clean database
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python manage.py migrate --noinput
      - name: Prove readiness monitor contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/test_readiness_monitor.py
      - name: Start real FastAPI stack
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          set -euo pipefail
          python -m uvicorn fastapi_app.main:app --host 127.0.0.1 --port 8001 --workers 4 --loop uvloop --http httptools --no-access-log > /tmp/aegis-load-api.log 2>&1 &
          echo $! > /tmp/aegis-load-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aegis-load-api.log
          exit 1
      - name: Warm-up
        run: |
          python aegis-platform/scripts/load_reality.py             --base-url http://127.0.0.1:8001             --path /health --path /ready             --stage 5:5             --stage-warmup-seconds 0             --max-p95-ms 1000 --max-error-rate 0.02 --min-rps 1 --min-requests 20             --output /tmp/warmup.json
      - name: Load capacity and soak reality
        run: |
          python aegis-platform/scripts/load_reality.py             --base-url http://127.0.0.1:8001             --path /health --path /ready             --stage 10:15 --stage 30:20 --stage 60:20 --stage 25:90             --stage-warmup-seconds 2             --max-p95-ms 500 --max-error-rate 0.01 --min-rps 5 --min-requests 500             --output performance-reality.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-load-soak-${{ github.sha }}
          path: performance-reality.json
          retention-days: 30
          if-no-files-found: warn
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/aegis-load-api.pid ]; then kill "$(cat /tmp/aegis-load-api.pid)" 2>/dev/null || true; fi
          cat /tmp/aegis-load-api.log 2>/dev/null || true

  capacity-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_DB: aegisdb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      DEBUG: 'False'
      SECURE_SSL_REDIRECT: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://nginx
      AUTH_COOKIE_SECURE: 'False'
      AUTHORIZED_SCAN_TARGETS: aegis-scan-target
      SCANNER_EGRESS_PRIVATE_TARGETS: aegis-scan-target
      SEMGREP_CONFIG: /app/e2e/semgrep-ci.yml
      FRONTEND_URL: http://localhost
      LOG_LEVEL: INFO
      AEGIS_BASE_URL: http://localhost
      AEGIS_DJANGO_URL: http://localhost/api/v1
      AEGIS_FASTAPI_URL: http://localhost
      AEGIS_API_URL: http://localhost/api/v1
      AEGIS_E2E_TARGET: aegis-scan-target
      AEGIS_E2E_TIMEOUT: '900'
      COMPOSE_PROFILES: kali-network
      AEGIS_NMAP_PROVIDER: default-kali
      AEGIS_NMAP_LEGACY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout and release dispatch target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AEGIS_EXACT_HEAD"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.profile }}" = "release" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$AEGIS_EXACT_HEAD"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove capacity evidence contract
        run: |
          python -m pip install pytest requests
          python -m pytest -q aegis-platform/scripts/test_release_capacity_reality.py
          python -m py_compile aegis-platform/scripts/release_capacity_reality.py aegis-platform/e2e/external_black_box_e2e.py
      - name: Prepare isolated full-stack environment
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/.env <<EOF
          DEBUG=${DEBUG}
          SECRET_KEY=${SECRET_KEY}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          CELERY_BROKER_URL=${CELERY_BROKER_URL}
          CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
          AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
          FRONTEND_URL=${FRONTEND_URL}
          AUTHORIZED_SCAN_TARGETS=${AUTHORIZED_SCAN_TARGETS}
          SEMGREP_CONFIG=${SEMGREP_CONFIG}
          LOG_LEVEL=${LOG_LEVEL}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          EOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml config --quiet
      - name: Build governed Kali Nmap provider and pin exact-head provenance
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -C .. log -1 --pretty=%ct)"
          docker build --pull             --build-arg BUILD_COMMIT="$AEGIS_EXACT_HEAD"             --build-arg AEGIS_RUNNER_VERSION=0.1.0             --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH"             -t aegis-kali:base             -f kali/Dockerfile.base kali
          docker build             --build-arg AEGIS_BASE_IMAGE=aegis-kali:base             --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH"             --target profile-network             -t aegis-kali:network             -f kali/Dockerfile.profiles .
          docker build             --build-arg AEGIS_NETWORK_BASE_IMAGE=aegis-kali:network             -t aegis-kali:network-provider             -f kali/Dockerfile.network-provider kali

          IMAGE_ID="$(docker image inspect aegis-kali:network-provider --format '{{.Id}}')"
          case "$IMAGE_ID" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected Kali network provider image ID: $IMAGE_ID" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint cat "$IMAGE_ID" /opt/aegis-runner/runtime-manifest.json             > /tmp/aegis-capacity-kali-runtime-manifest.json
          AUTH_TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          echo "::add-mask::$AUTH_TOKEN"
          echo "AEGIS_KALI_NETWORK_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "AEGIS_KALI_NETWORK_IMAGE=aegis-kali:network-provider" >> "$GITHUB_ENV"
          echo "AEGIS_KALI_NETWORK_EXPECTED_IMAGE_DIGEST=$IMAGE_ID" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib, json, os
          from pathlib import Path
          raw=Path('/tmp/aegis-capacity-kali-runtime-manifest.json').read_bytes()
          runtime=json.loads(raw)
          assert runtime['profile']=='network', runtime
          assert runtime['dispatch_enabled'] is True, runtime
          assert runtime['dispatch_state']=='semantic-network-provider', runtime
          assert runtime['dispatch_capabilities']==['network.nmap'], runtime
          assert runtime['build_commit']==os.environ['AEGIS_EXACT_HEAD'], runtime
          print('AEGIS_KALI_NETWORK_EXPECTED_RUNNER_VERSION='+runtime['runner_version'])
          print('AEGIS_KALI_NETWORK_EXPECTED_BUILD_COMMIT='+runtime['build_commit'])
          print('AEGIS_KALI_NETWORK_EXPECTED_BASE_IMAGE_DIGEST='+runtime['base_image_digest'])
          print('AEGIS_KALI_NETWORK_EXPECTED_TOOL_MANIFEST_DIGEST='+runtime['tool_manifest_digest'])
          print('AEGIS_KALI_NETWORK_EXPECTED_RUNTIME_MANIFEST_DIGEST=sha256:'+hashlib.sha256(raw).hexdigest())
          PY
          echo "CAPACITY_KALI_NETWORK_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: Build full platform once
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml build --pull; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 15
          done
      - name: Start full platform and wait for readiness
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml up -d --no-build
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml logs --tail=250 django fastapi celery_worker scanner_worker scanner_egress kali_network nginx
          exit 1
      - name: Bind isolated scanner target into API and egress policy
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          TARGET_IP="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' aegis-scan-target)"
          test -n "$TARGET_IP"
          echo "AEGIS_MASSCAN_TARGET=$TARGET_IP" >> "$GITHUB_ENV"
          echo "AUTHORIZED_SCAN_TARGETS=aegis-scan-target,$TARGET_IP" >> "$GITHUB_ENV"
          AUTHORIZED_SCAN_TARGETS="aegis-scan-target,$TARGET_IP" \
          SCANNER_EGRESS_PRIVATE_TARGETS="aegis-scan-target,$TARGET_IP" \
            docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml up -d --force-recreate fastapi celery_worker scanner_worker celery_beat kali_network nginx
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise concurrent tenants, PostgreSQL, Celery scanner queue, Kali and controlled recovery
        shell: bash
        run: |
          set -euo pipefail
          tenants=3
          python aegis-platform/scripts/release_capacity_reality.py \
            --compose-root aegis-platform \
            --e2e-script aegis-platform/e2e/external_black_box_e2e.py \
            --base-url http://localhost \
            --tenants "$tenants" \
            --tenant-timeout-seconds 1200 \
            --sample-interval-seconds 2 \
            --minimum-postgres-connections 2 \
            --output release-capacity-reality.json \
            --evidence-dir capacity-evidence
      - name: Execute measured saturation and soak profile after recovery
        shell: bash
        run: |
          set -euo pipefail
          stages=(--stage 20:30 --stage 50:30 --stage 100:30 --stage 25:120)
          min_requests=1200
          min_rps=5
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.profile }}" = "release" ]; then
            stages=(--stage 30:120 --stage 75:180 --stage 125:180 --stage 50:900)
            min_requests=5000
            min_rps=10
          fi
          python aegis-platform/scripts/load_reality.py \
            --base-url http://localhost \
            --path /health --path /ready \
            "${stages[@]}" \
            --stage-warmup-seconds 3 \
            --max-p95-ms 750 \
            --max-error-rate 0.01 \
            --min-rps "$min_rps" \
            --min-requests "$min_requests" \
            --output release-performance-reality.json
      - name: Validate immutable exact-SHA performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          capacity=json.loads(Path('release-capacity-reality.json').read_text())
          performance=json.loads(Path('release-performance-reality.json').read_text())
          assert capacity['schema']=='aegisscan.release-capacity-reality.v1'
          assert capacity['source_sha']==os.environ['AEGIS_EXACT_HEAD']
          assert capacity['passed'] is True
          assert capacity['proof']['multi_tenant_e2e'] is True
          assert capacity['proof']['postgres_concurrent_activity_observed'] is True
          assert capacity['proof']['celery_broker_observed'] is True
          assert capacity['proof']['kali_scanner_concurrency_exercised'] is True
          assert capacity['proof']['controlled_recovery'] is True
          assert performance['schema']=='aegisscan.performance-reality.v1'
          assert performance['passed'] is True
          assert performance['summary']['requests'] > 0
          assert performance['summary']['worst_stage_p95_ms'] <= performance['thresholds']['max_p95_ms']
          print('RELEASE_PERFORMANCE_CAPACITY_SOAK=PASS')
          PY
      - name: Upload release performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-performance-capacity-soak-${{ env.AEGIS_EXACT_HEAD }}-${{ github.run_id }}
          path: |
            release-capacity-reality.json
            release-performance-reality.json
            capacity-evidence/logs/*.log
            capacity-evidence/state/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Capture diagnostics and destroy ephemeral stack
        if: always()
        working-directory: aegis-platform
        shell: bash
        run: |
          set +e
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml logs --tail=250 fastapi django celery_worker scanner_worker scanner_egress kali_network postgres redis nginx
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.nmap-default-kali.yml down -v --remove-orphans
