name: Recon Amass Parity Delta Recovery 2

'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recon-amass-parity-delta-recovery-2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: recon-amass-parity-delta-recovery-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-semantic-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAILED_JOB_ID: '104595446779'
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
      - name: Prove exact diagnostic checkout
        run: test "$(git rev-parse HEAD)" = "${AEGIS_EXACT_HEAD}"
      - name: Recover failed parity job log and semantic delta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            -o artifacts/failed-job.log
          python - <<'PY'
          from pathlib import Path

          path=Path('artifacts/failed-job.log')
          text=path.read_text(encoding='utf-8', errors='replace')
          markers=(
              'Compare real normalized Amass semantics fail closed',
              'Traceback',
              'AssertionError',
              'legacy_normalized',
              'candidate_normalized',
              'semantic_equivalent',
              'observation_equivalent',
              'mismatches',
          )
          lines=text.splitlines()
          selected=set()
          for idx,line in enumerate(lines):
              if any(marker in line for marker in markers):
                  start=max(0, idx-40)
                  end=min(len(lines), idx+80)
                  selected.update(range(start,end))
          with open('artifacts/semantic-delta-window.txt','w',encoding='utf-8') as handle:
              for idx in sorted(selected):
                  handle.write(f'{idx+1:06d}: {lines[idx]}\n')
          if not selected:
              raise SystemExit('semantic delta markers not found in recovered job log')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon-amass-semantic-delta-recovery-2-${{ env.AEGIS_EXACT_HEAD }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
