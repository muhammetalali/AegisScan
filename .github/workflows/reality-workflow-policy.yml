name: Reality Workflow Policy

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/audit_workflow_concurrency.py']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/audit_workflow_concurrency.py']

permissions:
  contents: read

concurrency:
  group: reality-workflow-policy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/audit_workflow_concurrency.py
