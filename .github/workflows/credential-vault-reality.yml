name: Credential Vault Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/django_project/system/credential_*.py'
      - 'aegis-platform/backend/django_project/system/apps.py'
      - 'aegis-platform/backend/django_project/system/migrations/**'
      - 'aegis-platform/backend/django_project/system/test_credential_vault.py'
      - 'aegis-platform/backend/django_project/system/test_credential_execution_integration.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_credential_execution_contract.py'
      - 'aegis-platform/backend/fastapi_app/services/capability_registry.py'
      - 'aegis-platform/backend/fastapi_app/services/native_tool_runtime.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/django_project/urls.py'
      - '.github/workflows/credential-vault-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/django_project/system/credential_*.py'
      - 'aegis-platform/backend/django_project/system/apps.py'
      - 'aegis-platform/backend/django_project/system/migrations/**'
      - 'aegis-platform/backend/django_project/system/test_credential_vault.py'
      - 'aegis-platform/backend/django_project/system/test_credential_execution_integration.py'
      - 'aegis-platform/backend/fastapi_app/routers/capabilities.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_credential_execution_contract.py'
      - 'aegis-platform/backend/fastapi_app/services/capability_registry.py'
      - 'aegis-platform/backend/fastapi_app/services/native_tool_runtime.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/django_project/urls.py'
      - '.github/workflows/credential-vault-reality.yml'
  workflow_dispatch:

concurrency:
  group: credential-vault-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credential-vault-reality:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-vault-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-vault-jwt-signing-key-0123456789abcdef0123456789abcdef
      CREDENTIAL_VAULT_KEYS: 'Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM='
      CREDENTIAL_FINGERPRINT_KEY: 'ci-vault-fingerprint-pepper-not-production'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Prove Django model and migration contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Prove encrypted credential reference and execution planes
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: |
          python -m pytest -q django_project/system/test_credential_vault.py \
            django_project/system/test_credential_execution_integration.py \
            fastapi_app/services/test_credential_execution_contract.py
