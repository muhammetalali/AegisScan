name: WSTG UI Reporting Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_reporting.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_reporting.py'
      - 'aegis-platform/backend/fastapi_app/routers/wstg.py'
      - 'aegis-platform/backend/fastapi_app/routers/reports.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_contract_surfaces.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/backend/scripts/wstg_ui_reporting_reality.py'
      - 'aegis-platform/frontend/src/**'
      - 'aegis-platform/frontend/scripts/ui-contract-audit.mjs'
      - 'docs/WSTG_UI_REPORTING_REALITY.md'
      - '.github/workflows/wstg-ui-reporting-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_reporting.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_reporting.py'
      - 'aegis-platform/backend/fastapi_app/routers/wstg.py'
      - 'aegis-platform/backend/fastapi_app/routers/reports.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_contract_surfaces.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - 'aegis-platform/backend/scripts/wstg_ui_reporting_reality.py'
      - 'aegis-platform/frontend/src/**'
      - 'aegis-platform/frontend/scripts/ui-contract-audit.mjs'
      - 'docs/WSTG_UI_REPORTING_REALITY.md'
      - '.github/workflows/wstg-ui-reporting-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wstg-ui-reporting-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  backend-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt
      - name: Prove checkout is exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install backend dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Django migration and schema hygiene
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: WSTG coverage API report and persistence reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend:${{ github.workspace }}
        run: >-
          python -m pytest -q
          fastapi_app/services/test_wstg_reporting.py
          fastapi_app/services/test_wstg_observation_persistence.py
          fastapi_app/routers/test_contract_surfaces.py
      - name: OpenAPI contract audit
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python scripts/api_contract_audit.py --json

  frontend-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aegis-platform/frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aegis-platform/frontend/package-lock.json
      - name: Prove checkout is exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install frontend dependencies
        run: npm ci
      - name: UI transport and route audit
        run: npm run audit:ui
      - name: i18n audit
        run: npm run i18n:audit
      - name: Lint
        run: npm run lint
      - name: Typecheck and production build
        run: npm run build

  closure-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-reality, frontend-reality]
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend contract dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Capture exact-head UI reporting closure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/head-sha.txt
          PYTHONPATH=aegis-platform/backend             python aegis-platform/backend/scripts/wstg_ui_reporting_reality.py             | tee artifacts/wstg-ui-reporting-reality.json
      - uses: actions/upload-artifact@v4
        with:
          name: wstg-ui-reporting-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
