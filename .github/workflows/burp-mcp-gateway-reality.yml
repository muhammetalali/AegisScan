permissions:
  contents: read

concurrency:
  group: burp-mcp-gateway-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  burp-mcp-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-burp-mcp-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-burp-mcp-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-burp-mcp-evidence-hmac-key-0123456789abcdef
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-burp-mcp-credential-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'
      BURP_MCP_ALLOW_INSECURE_LOCAL: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile Burp MCP gateway plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/burp_mcp_models.py \
            aegis-platform/backend/enterprise/migrations/0041_burp_mcp_gateway.py \
            aegis-platform/backend/enterprise/migrations/0049_burp_invocation_claims.py \
            aegis-platform/backend/enterprise/provider_approval_models.py \
            aegis-platform/backend/enterprise/migrations/0042_provider_approval_plane.py \
            aegis-platform/backend/fastapi_app/services/provider_approval.py \
            aegis-platform/backend/fastapi_app/services/burp_mcp_gateway.py \
            aegis-platform/backend/fastapi_app/services/test_burp_mcp_gateway.py \
            aegis-platform/backend/fastapi_app/routers/burp_mcp.py \
            aegis-platform/backend/fastapi_app/services/burp_mcp_transport.py \
            aegis-platform/backend/fastapi_app/services/burp_http_probe.py \
            aegis-platform/backend/fastapi_app/services/burp_mcp_capability.py \
            aegis-platform/backend/fastapi_app/services/burp_mcp_execution.py \
            aegis-platform/backend/fastapi_app/services/burp_lab_requests.py \
            aegis-platform/backend/fastapi_app/services/lab_verification.py \
            aegis-platform/backend/fastapi_app/services/test_lab_verification.py \
            aegis-platform/backend/enterprise/migrations/0050_web_lab_evidence_immutability.py \
            aegis-platform/backend/enterprise/migrations/0051_web_lab_lifecycle.py \
            aegis-platform/backend/enterprise/web_lab_models.py \
            aegis-platform/backend/enterprise/management/commands/web_lab_lifecycle.py \
            aegis-platform/backend/fastapi_app/services/web_lab_lifecycle.py \
            aegis-platform/backend/fastapi_app/services/test_web_lab_lifecycle.py \
            aegis-platform/backend/fastapi_app/services/web_lab_measurement.py \
            aegis-platform/backend/fastapi_app/services/test_web_lab_measurement.py \
            aegis-platform/scripts/web_lab_measurement_report.py \
            aegis-platform/scripts/web_lab_measurement_case.py \
            aegis-platform/scripts/run_web_lab_p6_acceptance.py \
            aegis-platform/e2e/live_burp_lab_verification.py \
            aegis-platform/e2e/test_live_burp_lab_verification_guard.py \
            aegis-platform/e2e/live_web_lab_measurement.py \
            aegis-platform/e2e/test_live_web_lab_measurement_guard.py \
            aegis-platform/e2e/test_run_web_lab_p6_acceptance_guard.py \
            aegis-platform/backend/fastapi_app/services/test_burp_lab_execution.py \
            aegis-platform/backend/fastapi_app/services/credential_execution.py \
            aegis-platform/backend/fastapi_app/services/test_burp_mcp_transport.py \
            aegis-platform/backend/fastapi_app/services/test_burp_mcp_execution.py \
            aegis-platform/backend/fastapi_app/services/capability_registry.py \
            aegis-platform/backend/fastapi_app/services/capability_planner.py \
            aegis-platform/backend/fastapi_app/services/kali_profile_policy.py \
            aegis-platform/backend/fastapi_app/routers/capabilities.py \
            aegis-platform/backend/fastapi_app/tasks/burp_mcp.py \
            aegis-platform/backend/fastapi_app/celery_app.py \
            aegis-platform/backend/scripts/burp_mcp_sse_probe.py \
            aegis-platform/scripts/inspect_web_lab_runtime.py \
            aegis-platform/scripts/web_lab_host_lifecycle.py \
            aegis-platform/e2e/test_web_lab_host_lifecycle_guard.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: PostgreSQL schema migration and evidence immutability reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()

          from django.db import connection
          from enterprise.burp_mcp_models import BurpMCPInvocation, BurpMCPSession, BurpMCPInvocationClaim
          from enterprise.web_lab_models import WebLabInstance, WebLabLifecycleEvent

          assert connection.vendor == 'postgresql', connection.vendor
          assert {c.name for c in BurpMCPInvocationClaim._meta.constraints} == {
              'uniq_burp_claim_idem', 'uniq_burp_claim_seq', 'burp_claim_known_state', 'burp_claim_commit_binding'}
          assert {c.name for c in WebLabInstance._meta.constraints} == {
              'uniq_weblab_generation', 'weblab_generation_gte_1',
              'weblab_version_gte_1', 'weblab_cleaned_shape'}
          assert {c.name for c in WebLabLifecycleEvent._meta.constraints} == {
              'uniq_weblab_event_sequence', 'uniq_weblab_org_idem',
              'weblab_event_sequence_gte_1', 'weblab_event_generation_gte_1'}
          session_fields = {field.name for field in BurpMCPSession._meta.fields}
          invocation_fields = {field.name for field in BurpMCPInvocation._meta.fields}
          assert {
              'organization', 'project', 'asset', 'scan', 'authorization_decision',
              'provider_approval', 'provider_governance_decision', 'credential_ref', 'provider_identity_sha256',
              'allowed_tools', 'request_fingerprint', 'contract_fingerprint',
          } <= session_fields
          assert {
              'session', 'evidence', 'qualification', 'operation', 'provider_tool_name',
              'request_fingerprint', 'arguments_sha256', 'provider_result_sha256',
          } <= invocation_fields
          with connection.cursor() as cursor:
              cursor.execute("""
                  SELECT tgname
                  FROM pg_trigger
                  WHERE tgrelid = 'evidence_evidence'::regclass
                    AND NOT tgisinternal
              """)
              evidence_triggers = {row[0] for row in cursor.fetchall()}
              cursor.execute("""
                  SELECT tgname
                  FROM pg_trigger
                  WHERE tgrelid = 'enterprise_weblablifecycleevent'::regclass
                    AND NOT tgisinternal
              """)
              lifecycle_triggers = {row[0] for row in cursor.fetchall()}
          assert {'trg_burp_mcp_evidence_immutable', 'trg_web_lab_evidence_immutable'} <= evidence_triggers, evidence_triggers
          assert 'trg_web_lab_lifecycle_event_immutable' in lifecycle_triggers, lifecycle_triggers
          print('BURP_MCP_DATABASE=POSTGRESQL')
          print('BURP_MCP_SCHEMA=WIRED')
          print('BURP_MCP_EVIDENCE_IMMUTABILITY=POSTGRESQL_TRIGGER')
          print('WEB_LAB_LIFECYCLE_IMMUTABILITY=POSTGRESQL_TRIGGER')
          PY

      - name: MCP SSE, Web Lab lifecycle and gateway security regressions (not live Burp)
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_burp_mcp_gateway.py \
            fastapi_app/services/test_web_labs_preparation.py \
            fastapi_app/services/test_burp_mcp_transport.py \
            fastapi_app/services/test_burp_mcp_execution.py \
            fastapi_app/services/test_burp_lab_execution.py \
            fastapi_app/services/test_lab_verification.py \
            fastapi_app/services/test_web_lab_lifecycle.py \
            fastapi_app/services/test_web_lab_measurement.py \
            ../e2e/test_live_burp_lab_verification_guard.py \
            ../e2e/test_live_web_lab_measurement_guard.py \
            ../e2e/test_run_web_lab_p6_acceptance_guard.py \
            ../e2e/test_web_lab_host_lifecycle_guard.py \
            fastapi_app/services/test_finding_confirmation.py \
            fastapi_app/services/test_credential_execution_contract.py \
            fastapi_app/tasks/test_celery_reliability_contract.py \
            fastapi_app/services/test_kali_profile_policy.py \
            fastapi_app/routers/test_governed_execution_contract.py \
            fastapi_app/routers/test_assessment_launcher.py \
            --junitxml=/tmp/burp-mcp-gateway-junit.xml

      - name: Web Lab P6 sealed measurement contract
        working-directory: aegis-platform/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fastapi_app.services.web_lab_measurement import validate_plan
          plan = json.loads(Path('../../docs/web-labs/p6-measurement-plan-v1.json').read_text())
          validated = validate_plan(plan)
          assert len(validated['cases']) == 5
          assert sum(x['split'] == 'held_out' for x in validated['cases']) == 3
          print('WEB_LABS_P6_MEASUREMENT_PLAN=SEALED')
          PY

      - name: Provider approval gate regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_web_security_foundation.py -k 'provider'

      - name: Evidence qualification regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_evidence_qualification.py

      - name: Prove no arbitrary execution and bounded MCP wiring
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()

          from fastapi_app.services.burp_mcp_gateway import (
              BURP_MCP_CAPABILITY_ID,
              BURP_MCP_POLICY_VERSION,
          )

          service = Path('fastapi_app/services/burp_mcp_gateway.py').read_text()
          router = Path('fastapi_app/routers/burp_mcp.py').read_text()
          migration = Path('enterprise/migrations/0041_burp_mcp_gateway.py').read_text()

          assert BURP_MCP_CAPABILITY_ID == 'burp.mcp.gateway'
          assert BURP_MCP_POLICY_VERSION == 'burp-mcp-gateway.v1'
          assert "'method': 'tools/call'" in service
          assert '_OPERATION_ARGUMENTS' in service
          assert "'shell'" in service
          assert "'command'" in service
          assert 'subprocess.' not in service
          assert 'os.system' not in service
          assert 'shell=True' not in service
          assert "ConfigDict(extra='forbid')" in router
          assert 'evaluate_provider_admissibility(' in service
          assert 'provider_governance_decision' in service
          assert 'qualify_evidence(' in service
          assert 'resolve_credential_refs_for_worker(' in service
          assert 'aegis_burp_mcp_evidence_immutable' in migration
          assert 'trg_burp_mcp_evidence_immutable' in migration
          print('BURP_MCP_ARBITRARY_EXECUTION=DENIED')
          print('BURP_MCP_PROVIDER_APPROVAL=ENTERPRISE_PINNED')
          print('BURP_MCP_AUTHORIZATION=REVALIDATED')
          print('BURP_MCP_EVIDENCE_QUALIFICATION=WIRED')
          PY

      - name: Web Lab host lifecycle authority boundary
        run: |
          python aegis-platform/scripts/web_lab_host_lifecycle.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path

          service = Path('aegis-platform/backend/fastapi_app/services/web_lab_lifecycle.py').read_text()
          host = Path('aegis-platform/scripts/web_lab_host_lifecycle.py').read_text()
          inspector = Path('aegis-platform/scripts/inspect_web_lab_runtime.py').read_text()

          assert 'subprocess' not in service
          assert 'docker' not in service.lower()
          assert '/var/run/docker.sock' not in host
          assert 'docker.sock' not in host
          assert 'shell=True' not in host
          assert 'os.system' not in host
          assert 'subprocess.run(' in host
          assert "CONTAINER_RE = re.compile(r'^aegis-web-lab-" in host
          assert "CONTROL_RE = re.compile(" in host
          assert "NETWORK_RE = re.compile(" in host
          for token in [
              "'--read-only'", "'--cap-drop'", "'ALL'",
              "'--security-opt'", "'no-new-privileges:true'",
              "'--user', '10001:10001'", "'--restart', 'no'",
              "'--memory', '256m'", "'--cpus', '1'", "'--pids-limit', '128'",
          ]:
              assert token in host, token
          assert "'verify-chain'" in host
          assert 'verify_lifecycle_chain' in service
          assert 'current_asset_authorization' in service
          assert 'inspect_web_lab_runtime.py' in host
          assert 'host[\'NetworkMode\'].startswith(\'container:\')' in inspector or "host['NetworkMode'].startswith('container:')" in inspector
          print('WEB_LAB_DOCKER_AUTHORITY=HOST_ONLY')
          print('WEB_LAB_LIFECYCLE_CHAIN=REVALIDATED')
          print('WEB_LAB_RUNTIME_BOUNDARY=SEALED')
          PY

      - name: Optional Burp runtime Compose and shell contract
        working-directory: aegis-platform
        env:
          POSTGRES_PASSWORD: ci-compose-only
          AEGIS_BURP_RUNTIME_IMAGE: aegis-burp:ci-config-only
          AEGIS_BURP_PROFILE_PATH: /tmp/ci-burp-profile
          AEGIS_BURP_XAUTHORITY_PATH: /tmp/ci-burp-xauthority
          AEGIS_BURP_ALLOW_LOOPBACK_HTTP: 'true'
        run: |
          sh -n docker/burp-runtime/entrypoint.sh docker/burp-runtime/prepare-build-context.sh
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.burp.yml --profile burp-runtime config --no-env-resolution --format json > /tmp/burp-compose-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          services = json.loads(Path('/tmp/burp-compose-contract.json').read_text())['services']
          runtime = services['burp_runtime']
          assert runtime['network_mode'] == services['scanner_worker']['network_mode'] == 'service:scanner_egress'
          assert not runtime.get('ports')
          assert runtime['cap_drop'] == ['ALL'] and not runtime.get('cap_add')
          assert runtime['read_only'] is True
          assert runtime['restart'] == 'no'
          assert runtime['profiles'] == ['burp-runtime']
          assert runtime['security_opt'] == ['no-new-privileges:true']
          for name in ['scanner_worker', 'fastapi']:
              assert services[name]['environment']['BURP_MCP_ALLOW_INSECURE_LOCAL'] == 'true'
          print('BURP_OPTIONAL_SHARED_NAMESPACE_CONTRACT=PASS')
          PY

      - name: Retain Burp MCP Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burp-mcp-gateway-${{ github.sha }}
          path: /tmp/burp-mcp-gateway-junit.xml
          retention-days: 30
          if-no-files-found: warn

  burp-scanner-release:
    needs: burp-mcp-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove exact checkout and clean build context
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AEGIS_EXACT_HEAD"
          test ! -e aegis-platform/backend/.env
          python -m py_compile aegis-platform/scripts/verify_burp_scanner_release.py
      - name: Build the fully retired scanner release from scratch
        run: |
          set -euo pipefail
          docker build --no-cache --target production-no-legacy-recon \
            --build-arg AEGIS_RETIRE_NMAP=1 \
            --build-arg AEGIS_RETIRE_NUCLEI=1 \
            --build-arg AEGIS_RETIRE_SEMGREP=1 \
            --build-arg AEGIS_RETIRE_MASSCAN=1 \
            --label "org.opencontainers.image.revision=$AEGIS_EXACT_HEAD" \
            -t "aegis-burp-release:$AEGIS_EXACT_HEAD" \
            -f aegis-platform/backend/Dockerfile.django \
            aegis-platform/backend
      - name: Verify embedded source, retirement and the actual Burp producer offline
        run: |
          set -euo pipefail
          python aegis-platform/scripts/verify_burp_scanner_release.py \
            --image "aegis-burp-release:$AEGIS_EXACT_HEAD" \
            --expected-head "$AEGIS_EXACT_HEAD" \
            --source-root aegis-platform/backend \
            --output /tmp/burp-scanner-release-proof.json
      - name: Retain offline scanner image proof
        uses: actions/upload-artifact@v4
        with:
          name: burp-scanner-release-${{ env.AEGIS_EXACT_HEAD }}
          path: /tmp/burp-scanner-release-proof.json
          if-no-files-found: error
          retention-days: 30
