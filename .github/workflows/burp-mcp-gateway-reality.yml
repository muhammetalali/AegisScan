      - 'aegis-platform/backend/fastapi_app/services/lab_verification.py'
      - 'aegis-platform/backend/fastapi_app/services/test_lab_verification.py'
      - 'aegis-platform/e2e/fixtures/bac-target/**'
      - 'aegis-platform/scripts/inspect_web_lab_runtime.py'
      - 'aegis-platform/backend/enterprise/provider_approval_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0042_provider_approval_plane.py'
