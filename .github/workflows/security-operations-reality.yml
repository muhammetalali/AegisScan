name: Security Operations Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/soc_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0023_security_operations_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/security_operations.py'
      - 'aegis-platform/backend/fastapi_app/services/test_security_operations.py'
      - 'aegis-platform/backend/fastapi_app/routers/security_operations.py'
      - 'aegis-platform/backend/fastapi_app/routers/investigation.py'
      - '.github/workflows/security-operations-reality.yml'
  push:
    branches: [main, codex/security-operations-plane-2026-09-13]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/soc_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0023_security_operations_plane.py'
      - 'aegis-platform/backend/fastapi_app/services/security_operations.py'
      - 'aegis-platform/backend/fastapi_app/services/test_security_operations.py'
      - 'aegis-platform/backend/fastapi_app/routers/security_operations.py'
      - 'aegis-platform/backend/fastapi_app/routers/investigation.py'
      - '.github/workflows/security-operations-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-operations-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  security-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-security-operations-django-secret-key-0123456789abcdef
      JWT_SECRET_KEY: ci-security-operations-jwt-secret-key-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-security-operations-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-security-operations-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile security operations plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/apps.py \
            aegis-platform/backend/enterprise/soc_models.py \
            aegis-platform/backend/enterprise/migrations/0023_security_operations_plane.py \
            aegis-platform/backend/fastapi_app/services/security_operations.py \
            aegis-platform/backend/fastapi_app/routers/security_operations.py \
            aegis-platform/backend/fastapi_app/routers/investigation.py \
            aegis-platform/backend/fastapi_app/services/test_security_operations.py
      - name: Django schema reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.soc_models import SecuritySignal, InvestigationCaseState, InvestigationSignalLink, InvestigationAuditEvent
          assert connection.vendor == 'postgresql', connection.vendor
          assert SecuritySignal._meta.get_field('fingerprint').unique is True
          assert InvestigationSignalLink._meta.get_field('signal').unique is True
          assert InvestigationAuditEvent._meta.get_field('entry_hash').unique is True
          assert any(c.name == 'uniq_soc_case_generation' for c in InvestigationCaseState._meta.constraints)
          print('SECURITY_OPERATIONS_DATABASE=POSTGRESQL')
          print('SECURITY_OPERATIONS_DB_INVARIANTS=PASS')
          PY
      - name: Verify API contracts
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.routers.security_operations import SignalIn, CaseTransitionIn, ResponseHandoffIn
          paths=app.openapi()['paths']
          base='/api/v1/investigation/soc/projects/{project_id}'
          assert base + '/signals' in paths
          assert base + '/cases/{case_id}/transition' in paths
          assert base + '/cases/{case_id}/response-action' in paths
          assert base + '/cases/{case_id}/audit/verify' in paths
          for model in (SignalIn, CaseTransitionIn, ResponseHandoffIn):
              assert model.model_config.get('extra') == 'forbid'
          print('SECURITY_OPERATIONS_API=PASS')
          PY
      - name: Run SOC behavior and PostgreSQL concurrency reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_security_operations.py --junitxml=/tmp/security-operations-junit.xml
      - name: Run detection and governed finding regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_detection_engineering.py fastapi_app/services/test_finding_confirmation.py fastapi_app/services/test_finding_disposition.py --junitxml=/tmp/security-operations-regression-junit.xml
      - name: Retain security operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-operations-reality-${{ github.sha }}
          path: |
            /tmp/security-operations-junit.xml
            /tmp/security-operations-regression-junit.xml
          retention-days: 30
          if-no-files-found: warn
