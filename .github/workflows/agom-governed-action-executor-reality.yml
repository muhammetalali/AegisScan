name: AGOM Governed Action Executor Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0030_agom_governed_action_execution.py'
      - 'aegis-platform/backend/fastapi_app/contracts/governed_actions.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/test_governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/routers/governed_action_execution.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_governed_action_execution_api.py'
      - 'aegis-platform/backend/fastapi_app/routers/governance.py'
      - 'aegis-platform/backend/fastapi_app/routers/campaign_objectives.py'
      - '.github/workflows/agom-governed-action-executor-reality.yml'
  push:
    branches: [main, codex/agom-governed-action-executor-2026-09-13]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0030_agom_governed_action_execution.py'
      - 'aegis-platform/backend/fastapi_app/contracts/governed_actions.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/test_governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/routers/governed_action_execution.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_governed_action_execution_api.py'
      - 'aegis-platform/backend/fastapi_app/routers/governance.py'
      - 'aegis-platform/backend/fastapi_app/routers/campaign_objectives.py'
      - '.github/workflows/agom-governed-action-executor-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agom-governed-action-executor-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  governed-action-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-agom-governed-action-django-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-agom-governed-action-jwt-secret-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-agom-governed-action-evidence-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-agom-governed-action-fingerprint-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile governed action execution plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/apps.py \
            aegis-platform/backend/enterprise/governed_action_models.py \
            aegis-platform/backend/enterprise/migrations/0030_agom_governed_action_execution.py \
            aegis-platform/backend/fastapi_app/contracts/governed_actions.py \
            aegis-platform/backend/fastapi_app/services/governed_action_executor.py \
            aegis-platform/backend/fastapi_app/services/test_governed_action_executor.py \
            aegis-platform/backend/fastapi_app/routers/governed_action_execution.py \
            aegis-platform/backend/fastapi_app/routers/test_governed_action_execution_api.py \
            aegis-platform/backend/fastapi_app/routers/governance.py \
            aegis-platform/backend/fastapi_app/routers/campaign_objectives.py
      - name: Verify Django schema reality and migration drift
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          from enterprise.governed_action_models import GovernedActionExecution
          names = {field.name for field in GovernedActionExecution._meta.fields}
          required = {
              'organization', 'project', 'actor', 'action_id', 'entity_type', 'entity_id',
              'expected_version', 'idempotency_key', 'request_fingerprint', 'policy_fingerprint',
              'correlation_id', 'request_payload', 'before_projection', 'gate_snapshot',
              'result_payload', 'after_projection', 'audit_log', 'execution_fingerprint',
          }
          assert required <= names, sorted(required - names)
          assert GovernedActionExecution._meta.get_field('audit_log').one_to_one is True
          print('AGOM_GOVERNED_ACTION_SCHEMA=WIRED')
          PY
      - name: Run governed action Reality tests on PostgreSQL
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q --junitxml=agom-governed-action-junit.xml \
            fastapi_app/services/test_governed_action_executor.py \
            fastapi_app/routers/test_governed_action_execution_api.py
      - name: Run AGOM authority and capability regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_governed_operations.py \
            fastapi_app/services/test_governed_responsibility_authority.py \
            fastapi_app/services/test_governed_responsibility_lock_order.py \
            fastapi_app/services/test_entity_capability_adapters.py \
            fastapi_app/services/test_entity_capability_freshness.py \
            fastapi_app/services/test_entity_capability_scope_guards.py
      - name: Run campaign governance regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_campaign_objective_assurance.py
      - name: Verify API contract and legacy bypass closure
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from fastapi_app.main import app

          schema = app.openapi()
          generic = '/api/v1/assurance/governance/actions/execute'
          legacy = '/api/v1/attack-path/campaigns/projects/{project_id}/{campaign_id}/objectives/{objective_id}/assessments'
          complete = '/api/v1/attack-path/campaigns/projects/{project_id}/{campaign_id}/complete'
          assert generic in schema['paths'], generic
          assert legacy in schema['paths'], legacy
          assert complete in schema['paths'], complete

          source = Path('fastapi_app/routers/campaign_objectives.py').read_text()
          assert 'assess_objective,' not in source
          assert 'complete_campaign,' not in source
          assert "action_id='campaign.objective.assess'" in source
          assert "action_id='campaign.complete'" in source
          assert 'idempotency_key' in source
          print('AGOM_GOVERNED_ACTION_API=WIRED')
          print('AGOM_CAMPAIGN_DIRECT_ROUTER_BYPASS=CLOSED')
          PY
      - name: Retain governed action Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agom-governed-action-${{ github.sha }}
          path: aegis-platform/backend/agom-governed-action-junit.xml
          if-no-files-found: warn
