name: Stateful Protocol Security Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/requirements.txt'
      - 'aegis-platform/backend/enterprise/web_security_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0017_protocol_security_validation_kinds.py'
      - 'aegis-platform/backend/enterprise/migrations/0018_graphql_schema_graph_kinds.py'
      - 'aegis-platform/backend/fastapi_app/contracts/web_security_v2.py'
      - 'aegis-platform/backend/fastapi_app/services/stateful_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_stateful_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_web_security_api.py'
      - 'aegis-platform/e2e/fixtures/protocol-security-target/**'
      - 'aegis-platform/e2e/protocol_security_e2e.py'
      - '.github/workflows/stateful-protocol-security-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/requirements.txt'
      - 'aegis-platform/backend/enterprise/web_security_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0017_protocol_security_validation_kinds.py'
      - 'aegis-platform/backend/enterprise/migrations/0018_graphql_schema_graph_kinds.py'
      - 'aegis-platform/backend/fastapi_app/contracts/web_security_v2.py'
      - 'aegis-platform/backend/fastapi_app/services/stateful_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/web_security_foundation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_stateful_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/test_web_security_api.py'
      - 'aegis-platform/e2e/fixtures/protocol-security-target/**'
      - 'aegis-platform/e2e/protocol_security_e2e.py'
      - '.github/workflows/stateful-protocol-security-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stateful-protocol-security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  stateful-protocol-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-protocol-django-secret-key-0123456789abcdef0123456789abcdef
      JWT_SECRET_KEY: ci-protocol-jwt-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-protocol-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-protocol-credential-fingerprint-key-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile protocol implementation fixtures and E2E
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/web_security_models.py \
            aegis-platform/backend/fastapi_app/contracts/web_security_v2.py \
            aegis-platform/backend/fastapi_app/services/stateful_protocol_security.py \
            aegis-platform/backend/fastapi_app/services/credential_execution.py \
            aegis-platform/backend/fastapi_app/services/test_stateful_protocol_security.py \
            aegis-platform/backend/fastapi_app/routers/web_security.py \
            aegis-platform/backend/fastapi_app/routers/test_web_security_api.py \
            aegis-platform/e2e/fixtures/protocol-security-target/app.py \
            aegis-platform/e2e/protocol_security_e2e.py

      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Protocol invariant and API acceptance suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_stateful_protocol_security.py \
            fastapi_app/routers/test_web_security_api.py \
            --junitxml=/tmp/stateful-protocol-junit.xml

      - name: Generate ephemeral protocol fixture credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for identity in ('ALICE', 'BOB', 'ADMIN', 'EXPIRED'):
                  token = secrets.token_urlsafe(32)
                  print(f'::add-mask::{token}')
                  env.write(f'AEGIS_PROTOCOL_{identity}_TOKEN={token}\n')
          PY

      - name: Start real GraphQL and WebSocket fixture
        run: |
          set -euo pipefail
          PYTHONPATH=aegis-platform/backend \
            python -m uvicorn app:app \
            --app-dir aegis-platform/e2e/fixtures/protocol-security-target \
            --host 127.0.0.1 --port 18085 \
            >/tmp/protocol-security-fixture.log 2>&1 &
          echo $! >/tmp/protocol-security-fixture.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18085/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/protocol-security-fixture.log
          exit 1

      - name: Run live WebSocket GraphQL and cross-protocol E2E
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          set -euo pipefail
          python ../e2e/protocol_security_e2e.py \
            --http-origin http://127.0.0.1:18085 \
            --ws-origin ws://127.0.0.1:18085 \
            --evidence /tmp/stateful-protocol-evidence.json \
            | tee /tmp/stateful-protocol-proof.log
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/stateful-protocol-evidence.json').read_text())
          assert payload['schema'] == 'aegis.protocol-security-e2e.v1'
          assert payload['status'] == 'success'
          assert payload['runs']['websocket']['summary']['failed'] >= 1
          assert payload['runs']['graphql']['summary']['failed'] >= 1
          assert payload['runs']['cross_protocol']['summary']['failed'] == 1
          assert 'websocket_channel' in payload['graph_kinds']
          assert 'graphql_operation' in payload['graph_kinds']
          assert 'graphql_type' in payload['graph_kinds']
          assert 'graphql_field' in payload['graph_kinds']
          assert 'graphql_argument' in payload['graph_kinds']
          rendered = json.dumps(payload, sort_keys=True)
          for secret in ('alice-token', 'expired-token', 'alpha-secret', 'bravo-secret'):
              assert secret not in rendered
          print('STATEFUL_PROTOCOL_EVIDENCE=PASS')
          PY

      - name: Retain stateful protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-protocol-security-reality-${{ github.sha }}
          path: |
            /tmp/stateful-protocol-junit.xml
            /tmp/stateful-protocol-evidence.json
            /tmp/stateful-protocol-proof.log
            /tmp/protocol-security-fixture.log
          retention-days: 30
          if-no-files-found: warn

      - name: Stop protocol fixture
        if: always()
        run: |
          if [ -f /tmp/protocol-security-fixture.pid ]; then
            kill "$(cat /tmp/protocol-security-fixture.pid)" 2>/dev/null || true
          fi
          cat /tmp/protocol-security-fixture.log 2>/dev/null || true
