name: Race TOCTOU Security Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/race_toctou_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_race_toctou_security.py'
      - '.github/workflows/race-toctou-security-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/race_toctou_security.py'
      - 'aegis-platform/backend/fastapi_app/services/test_race_toctou_security.py'
      - '.github/workflows/race-toctou-security-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-toctou-security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  race-toctou-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-race-toctou-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-race-toctou-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-race-toctou-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-race-toctou-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile Race TOCTOU plane
        run: |
          python -m py_compile \
            aegis-platform/backend/fastapi_app/services/governed_action_executor.py \
            aegis-platform/backend/fastapi_app/services/race_toctou_security.py \
            aegis-platform/backend/fastapi_app/services/test_race_toctou_security.py
      - name: PostgreSQL schema reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          from django.db import connection
          assert connection.vendor == 'postgresql', connection.vendor
          print('RACE_TOCTOU_DATABASE=POSTGRESQL')
          PY
      - name: Race and TOCTOU invariant suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_race_toctou_security.py \
            fastapi_app/services/test_governed_action_executor.py \
            fastapi_app/services/test_business_logic_security.py \
            --junitxml=/tmp/race-toctou-junit.xml
      - name: Verify complete manual CAS coverage
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          import django
          django.setup()

          from fastapi_app.services.governed_action_executor import _IMPLEMENTED_ACTIONS
          from fastapi_app.services.governed_operations import list_action_contracts
          from fastapi_app.services.race_toctou_security import (
              RACE_TOCTOU_POLICY_VERSION,
              RACE_TOCTOU_LOCK_ORDER,
          )

          contracts = {
              item.action_id: item
              for item in list_action_contracts()
              if item.action_id in _IMPLEMENTED_ACTIONS
          }
          assert set(contracts) == set(_IMPLEMENTED_ACTIONS)
          missing = sorted(
              action_id
              for action_id, contract in contracts.items()
              if not contract.expected_version_required
          )
          assert not missing, missing
          assert RACE_TOCTOU_POLICY_VERSION == 'agom-race-toctou.v1'
          assert RACE_TOCTOU_LOCK_ORDER[-1] == 'domain_cas'
          print('RACE_TOCTOU_MANUAL_CAS_COVERAGE=PASS')
          print('RACE_TOCTOU_COMMIT_TIME_PROOF=PASS')
          PY
      - name: Retain Race TOCTOU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-toctou-security-${{ github.sha }}
          path: /tmp/race-toctou-junit.xml
          retention-days: 30
          if-no-files-found: warn
