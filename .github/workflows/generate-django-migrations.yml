name: Generate Django migrations

on:
  push:
    branches:
      - feature/enterprise-platform-ui-v2
    paths-ignore:
      - 'aegis-platform/backend/django_project/*/migrations/**'
      - '.github/workflows/generate-django-migrations.yml'

permissions:
  contents: write

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate migrations
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
        run: |
          python manage.py makemigrations
          python manage.py check

      - name: Commit migrations
        working-directory: .
        run: |
          if git diff --quiet -- aegis-platform/backend/django_project/*/migrations; then
            echo "No migration files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aegis-platform/backend/django_project/*/migrations
          git commit -m "chore(backend): add generated Django migrations"
          git push
