name: AegisScan Quality Gates

on:
  push:
    branches:
      - main
      - feature/enterprise-platform-ui-v2
  pull_request:

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: packages/backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff bandit

      - name: Ruff lint
        run: |
          ruff check packages/backend --select E9
          ruff check packages/core/aegis/core/scan_state_machine.py packages/core/aegis/core/feedback.py packages/core/aegis/core/immutable_audit.py packages/core/aegis/core/plugin_registry.py packages/core/aegis/models/provenance.py packages/core/aegis/engines/inference/smart_aggregator.py packages/core/aegis/engines/inference/contextual_enrichment.py --select E4,E7,E9,F,B,I,UP --ignore E501

      - name: Bandit security audit
        run: bandit -r packages/backend/django_project packages/backend/fastapi_app -ll -x "*/migrations/*"

      - name: Python compile audit
        run: python -m compileall -q packages/backend

      - name: Django application audit
        working-directory: packages/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          SECRET_KEY: aegisscan-ci-secret
          DEBUG: "1"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: sqlite:///ci.sqlite3
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "import django; django.setup(); print('DJANGO_SETUP_OK')"

      - name: Django API tests
        working-directory: packages/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          SECRET_KEY: aegisscan-ci-secret
          JWT_SECRET_KEY: aegisscan-ci-jwt-secret
          DEBUG: "1"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: sqlite:///ci.sqlite3
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q tests

      - name: Core pytest suite
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Duplicate-code audit
        # Avoid flagging short, intentionally repeated import scaffolding while
        # still failing on meaningful duplicated implementation blocks.
        run: npx --yes jscpd src --min-lines 8 --min-tokens 80 --reporters console --exit-code 1

  docker-config:
    name: Docker configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f packages/platform/docker-compose.yml config

      - name: Verify service definitions
        shell: bash
        run: |
          set -euo pipefail
          services=$(docker compose -f packages/platform/docker-compose.yml config --services)
          for service in postgres redis django fastapi celery_worker celery_beat frontend; do
            echo "$services" | grep -qx "$service"
          done
