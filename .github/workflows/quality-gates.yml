name: AegisScan Quality Gates

on:
  push:
    branches:
      - main
      - feature/enterprise-platform-ui-v2
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: django_project.settings
      SECRET_KEY: "ci-backend-secret-key-012345678901234567890123"
      JWT_SECRET_KEY: "ci-backend-jwt-secret-012345678901234567890123"
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegisdb
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      WS_ALLOW_QUERY_TOKEN: "0"
      LOG_TO_FILE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: packages/backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff bandit
      - name: Ruff lint
        run: |
          ruff check packages/backend --select E9
          ruff check packages/core/aegis/core/scan_state_machine.py packages/core/aegis/core/feedback.py packages/core/aegis/core/immutable_audit.py packages/core/aegis/core/plugin_registry.py packages/core/aegis/models/provenance.py packages/core/aegis/engines/inference/smart_aggregator.py packages/core/aegis/engines/inference/contextual_enrichment.py --select E4,E7,E9,F,B,I,UP --ignore E501
      - name: Bandit security audit
        run: bandit -r packages/backend/django_project packages/backend/fastapi_app -ll -x "*/migrations/*"
      - name: Python compile audit
        run: python -m compileall -q packages/backend
      - name: Django deployment security audit
        working-directory: packages/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          SECRET_KEY: "ci-production-secret-key-012345678901234567890123"
          JWT_SECRET_KEY: "ci-production-jwt-secret-012345678901234567890123"
          DEBUG: "0"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegisdb
          REDIS_URL: redis://localhost:6379/0
          WS_ALLOW_QUERY_TOKEN: "0"
        run: python manage.py check --deploy
      - name: Django application audit
        working-directory: packages/backend
        run: python -c "import django; django.setup(); print('DJANGO_SETUP_OK')"
      - name: Django API tests
        working-directory: packages/backend
        run: python -m pytest -q tests
      - name: Core pytest suite
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist synchronized lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/enterprise-platform-ui-v2'
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- packages/web/package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/web/package-lock.json
          git commit -m 'chore(web): synchronize npm lockfile [lock-sync]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Clean install from lockfile
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Duplicate-code audit
        run: npx --yes jscpd src --min-lines 8 --min-tokens 80 --reporters console --exit-code 1

  docker-config:
    name: Docker configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f packages/platform/docker-compose.yml config
      - name: Verify service definitions
        shell: bash
        run: |
          set -euo pipefail
          services=$(docker compose -f packages/platform/docker-compose.yml config --services)
          for service in postgres redis django fastapi celery_worker celery_beat frontend; do
            echo "$services" | grep -qx "$service"
          done
      - name: Build frontend production image
        run: docker compose -f packages/platform/docker-compose.yml build --no-cache frontend

  service-e2e:
    name: Service E2E
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: django_project.settings
      SECRET_KEY: "ci-e2e-secret-key-012345678901234567890123"
      JWT_SECRET_KEY: "ci-e2e-jwt-secret-012345678901234567890123"
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegis
      REDIS_URL: redis://localhost:6379/0
      WS_ALLOW_QUERY_TOKEN: "0"
      LOG_TO_FILE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: packages/backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Start data services
        run: docker compose -f packages/platform/docker-compose.yml up -d postgres redis
      - name: Wait for data services
        run: |
          set -euo pipefail
          for i in {1..30}; do
            postgres=$(docker inspect --format='{{.State.Health.Status}}' aegis-postgres 2>/dev/null || true)
            redis=$(docker inspect --format='{{.State.Health.Status}}' aegis-redis 2>/dev/null || true)
            if [ "$postgres" = "healthy" ] && [ "$redis" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose -f packages/platform/docker-compose.yml ps
          exit 1
      - name: Build and migrate Django
        run: |
          docker compose -f packages/platform/docker-compose.yml build django
          docker compose -f packages/platform/docker-compose.yml run --rm django python manage.py migrate --noinput
      - name: Start Django and FastAPI
        run: docker compose -f packages/platform/docker-compose.yml up -d django fastapi
      - name: Wait for application services
        run: |
          set -euo pipefail
          for i in {1..60}; do
            django=$(docker inspect --format='{{.State.Health.Status}}' aegis-django 2>/dev/null || true)
            fastapi=$(docker inspect --format='{{.State.Health.Status}}' aegis-fastapi 2>/dev/null || true)
            if [ "$django" = "healthy" ] && [ "$fastapi" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose -f packages/platform/docker-compose.yml ps
          docker compose -f packages/platform/docker-compose.yml logs --no-color django fastapi
          exit 1
      - name: Run service E2E smoke tests
        run: python -m pytest -q packages/backend/tests/e2e_smoke.py
      - name: Collect service logs
        if: always()
        run: docker compose -f packages/platform/docker-compose.yml logs --no-color django fastapi postgres redis
      - name: Tear down
        if: always()
        run: docker compose -f packages/platform/docker-compose.yml down -v
