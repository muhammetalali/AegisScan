name: External Black-Box E2E
'on':
  pull_request:
    branches: [main]
    paths: ['aegis-platform/e2e/**','aegis-platform/backend/**','aegis-platform/frontend/**','aegis-platform/docker-compose.yml','aegis-platform/docker/**','aegis-platform/docker-compose.ci.yml','.github/workflows/external-black-box-e2e.yml','.github/workflows/domain-contract-reality.yml','.github/workflows/frontend-lock-sync.yml','.github/workflows/production-runtime-reality-gate.yml','CANONICAL_EXECUTION_BASELINE.md']
  push:
    branches: [main, codex/full-contract-ui-audit-2026-09-03]
    paths: ['aegis-platform/e2e/**','aegis-platform/backend/**','aegis-platform/frontend/**','aegis-platform/docker-compose.yml','aegis-platform/docker/**','aegis-platform/docker-compose.ci.yml','.github/workflows/external-black-box-e2e.yml','.github/workflows/domain-contract-reality.yml','.github/workflows/frontend-lock-sync.yml','.github/workflows/production-runtime-reality-gate.yml','CANONICAL_EXECUTION_BASELINE.md']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  external-black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_DB: aegisdb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      DEBUG: 'False'
      SECURE_SSL_REDIRECT: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://nginx
      AUTH_COOKIE_SECURE: 'False'
      AUTHORIZED_SCAN_TARGETS: aegis-scan-target
      SCANNER_EGRESS_PRIVATE_TARGETS: aegis-scan-target
      SEMGREP_CONFIG: /app/e2e/semgrep-ci.yml
      FRONTEND_URL: http://localhost
      LOG_LEVEL: INFO
      AEGIS_BASE_URL: http://nginx
      AEGIS_DJANGO_URL: http://nginx/api/v1
      AEGIS_FASTAPI_URL: http://nginx
      AEGIS_API_URL: http://nginx/api/v1
      AEGIS_E2E_TARGET: aegis-scan-target
      AEGIS_E2E_TIMEOUT: '600'
      AEGIS_E2E_EMAIL: e2e-operator@aegisscan.local
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/.env <<EOF
          DEBUG=${DEBUG}
          SECRET_KEY=${SECRET_KEY}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          CELERY_BROKER_URL=${CELERY_BROKER_URL}
          CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
          AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
          FRONTEND_URL=${FRONTEND_URL}
          AUTHORIZED_SCAN_TARGETS=${AUTHORIZED_SCAN_TARGETS}
          SEMGREP_CONFIG=${SEMGREP_CONFIG}
          LOG_LEVEL=${LOG_LEVEL}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          EOF
      - name: Validate compose configuration
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
      - name: Build real platform images
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml build --pull; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo 'Docker Compose build failed after the bounded retry; refusing to mask the failure.' >&2
              exit 1
            fi
            echo 'Docker Compose build failed once; retrying after a short transient backoff.' >&2
            sleep 15
          done
      - name: Start real platform stack
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build
      - name: Wait for platform readiness
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=250 django fastapi celery_worker scanner_worker scanner_egress scan_target egress_forbidden_target nginx
          exit 1
      - name: Resolve authorized and forbidden scanner targets
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          TARGET_IP="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' aegis-scan-target)"
          FORBIDDEN_IP="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' aegis-egress-forbidden-target)"
          test -n "$TARGET_IP"
          test -n "$FORBIDDEN_IP"
          test "$TARGET_IP" != "$FORBIDDEN_IP"
          echo "Resolved CI scanner target IP: $TARGET_IP"
          echo "Resolved forbidden private target IP: $FORBIDDEN_IP"
          echo "AEGIS_MASSCAN_TARGET=$TARGET_IP" >> "$GITHUB_ENV"
          echo "AEGIS_FORBIDDEN_TARGET_IP=$FORBIDDEN_IP" >> "$GITHUB_ENV"
          echo "AUTHORIZED_SCAN_TARGETS=aegis-scan-target,$TARGET_IP" >> "$GITHUB_ENV"
          AUTHORIZED_SCAN_TARGETS="aegis-scan-target,$TARGET_IP" docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --force-recreate fastapi celery_worker scanner_worker celery_beat nginx
      - name: Wait after scanner environment refresh
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then
              echo 'FastAPI and Nginx are ready after scanner environment refresh.'
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps fastapi celery_worker scanner_worker scanner_egress celery_beat nginx
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=200 fastapi celery_worker scanner_worker scanner_egress celery_beat nginx
          exit 1
      - name: Verify scanner execution-plane isolation
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T scanner_egress nft list table netdev aegis_egress | tee /tmp/aegis-egress-rules.txt
          grep -q 'hook egress' /tmp/aegis-egress-rules.txt
          grep -q '169.254.0.0/16' /tmp/aegis-egress-rules.txt

          GENERAL_CAPS="$(docker inspect -f '{{json .HostConfig.CapAdd}}' aegis-celery-worker)"
          SCANNER_CAPS="$(docker inspect -f '{{json .HostConfig.CapAdd}}' aegis-scanner-worker)"
          EGRESS_CAPS="$(docker inspect -f '{{json .HostConfig.CapAdd}}' aegis-scanner-egress)"
          echo "general worker caps=$GENERAL_CAPS"
          echo "scanner worker bootstrap caps=$SCANNER_CAPS"
          echo "egress caps=$EGRESS_CAPS"
          ! printf '%s' "$GENERAL_CAPS" | grep -qE 'NET_RAW|NET_ADMIN'
          printf '%s' "$SCANNER_CAPS" | grep -q 'NET_RAW'
          printf '%s' "$SCANNER_CAPS" | grep -q 'SETPCAP'
          printf '%s' "$SCANNER_CAPS" | grep -q 'SETUID'
          printf '%s' "$SCANNER_CAPS" | grep -q 'SETGID'
          ! printf '%s' "$SCANNER_CAPS" | grep -q 'NET_ADMIN'
          printf '%s' "$EGRESS_CAPS" | grep -q 'NET_ADMIN'
          ! printf '%s' "$EGRESS_CAPS" | grep -q 'NET_RAW'

          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T scanner_worker python - <<'PY'
          from pathlib import Path

          BITS = {
              'CAP_SETGID': 6,
              'CAP_SETUID': 7,
              'CAP_SETPCAP': 8,
              'CAP_NET_ADMIN': 12,
              'CAP_NET_RAW': 13,
          }

          def read_status(pid: int) -> dict[str, list[str]]:
              values: dict[str, list[str]] = {}
              for line in Path(f'/proc/{pid}/status').read_text(encoding='utf-8').splitlines():
                  if ':' not in line:
                      continue
                  key, value = line.split(':', 1)
                  if key in {'Name', 'Uid', 'Gid', 'CapEff', 'CapAmb'}:
                      values[key] = value.strip().split()
              return values

          celery_pids: list[int] = []
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  cmdline = (proc / 'cmdline').read_bytes().replace(b'\0', b' ').decode(errors='ignore')
              except OSError:
                  continue
              if 'celery' in cmdline and 'worker' in cmdline:
                  celery_pids.append(int(proc.name))
          if not celery_pids:
              raise SystemExit('no celery worker process found inside scanner_worker')

          failures: list[str] = []
          for pid in sorted(set(celery_pids)):
              status = read_status(pid)
              uid = int(status.get('Uid', ['-1'])[0])
              gid = int(status.get('Gid', ['-1'])[0])
              eff = int(status.get('CapEff', ['0'])[0], 16)
              amb = int(status.get('CapAmb', ['0'])[0], 16)
              print(f'scanner-runtime pid={pid} uid={uid} gid={gid} CapEff=0x{eff:x} CapAmb=0x{amb:x}')
              if uid != 10001:
                  failures.append(f'scanner runtime pid {pid} runs as uid {uid}, expected 10001')
              if gid != 10001:
                  failures.append(f'scanner runtime pid {pid} runs as gid {gid}, expected 10001')
              for field_name, caps in (('CapEff', eff), ('CapAmb', amb)):
                  if not caps & (1 << BITS['CAP_NET_RAW']):
                      failures.append(f'scanner runtime pid {pid} {field_name} lacks CAP_NET_RAW')
                  for cap_name in ('CAP_NET_ADMIN', 'CAP_SETUID', 'CAP_SETGID', 'CAP_SETPCAP'):
                      if caps & (1 << BITS[cap_name]):
                          failures.append(f'scanner runtime pid {pid} {field_name} still has {cap_name}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

          EGRESS_ID="$(docker inspect -f '{{.Id}}' aegis-scanner-egress)"
          SCANNER_NETWORK_MODE="$(docker inspect -f '{{.HostConfig.NetworkMode}}' aegis-scanner-worker)"
          EXPECTED_NETWORK_MODE="container:$EGRESS_ID"
          echo "scanner namespace evidence: egress_id=$EGRESS_ID scanner_network_mode=$SCANNER_NETWORK_MODE"
          if [ "$SCANNER_NETWORK_MODE" != "$EXPECTED_NETWORK_MODE" ]; then
            echo "scanner_worker is not attached to the scanner_egress runtime namespace: expected=$EXPECTED_NETWORK_MODE actual=$SCANNER_NETWORK_MODE" >&2
            exit 1
          fi
          echo "shared scanner network namespace=$SCANNER_NETWORK_MODE"

          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T \
            -e ALLOWED_IP="$AEGIS_MASSCAN_TARGET" \
            -e FORBIDDEN_IP="$AEGIS_FORBIDDEN_TARGET_IP" \
            scanner_worker python - <<'PY'
          import os, socket
          allowed = os.environ['ALLOWED_IP']
          forbidden = os.environ['FORBIDDEN_IP']
          with socket.create_connection((allowed, 80), timeout=3):
              pass
          with socket.create_connection(('postgres', 5432), timeout=3):
              pass
          try:
              socket.create_connection((forbidden, 80), timeout=2)
          except OSError:
              print('forbidden private egress blocked: OK')
          else:
              raise SystemExit('forbidden private egress unexpectedly succeeded')
          PY
      - name: Verify scanner target authorization
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T scanner_worker sh -c 'echo "AUTHORIZED_SCAN_TARGETS=$AUTHORIZED_SCAN_TARGETS"'
      - name: Provision CI E2E operator
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          E2E_PASSWORD="$(python - <<'PY'
          import secrets
          print('Aegis-E2E-' + secrets.token_urlsafe(24))
          PY
          )"
          printf 'AEGIS_E2E_PASSWORD=%s\n' "$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$E2E_PASSWORD"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T -e E2E_EMAIL="$AEGIS_E2E_EMAIL" -e E2E_PASSWORD="$E2E_PASSWORD" django python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          from django_project.users.models import UserRole
          User=get_user_model(); email=os.environ['E2E_EMAIL']; password=os.environ['E2E_PASSWORD']
          user,_=User.objects.get_or_create(email=email,defaults={'first_name':'E2E','last_name':'Operator','role':UserRole.SECURITY_MANAGER,'is_active':True,'is_verified':True})
          user.role=UserRole.SECURITY_MANAGER; user.is_active=True; user.is_verified=True; user.set_password(password); user.save()
          assert user.has_permission('project.create') and user.has_permission('scan.create')
          PY
      - name: Run HTTP black-box E2E
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --no-deps -v "$PWD/e2e:/e2e:ro" -e AEGIS_BASE_URL=http://nginx -e AEGIS_DJANGO_URL=http://nginx/api/v1 -e AEGIS_FASTAPI_URL=http://nginx -e AEGIS_API_URL=http://nginx/api/v1 -e AEGIS_E2E_TARGET=aegis-scan-target -e AEGIS_E2E_TIMEOUT=600 -e AEGIS_VERIFY_TLS=false -e AEGIS_E2E_EMAIL="$AEGIS_E2E_EMAIL" -e AEGIS_E2E_PASSWORD="$AEGIS_E2E_PASSWORD" fastapi python /e2e/external_black_box_e2e.py
      - name: Run installed CLI against canonical platform
        env:
          AEGIS_PLATFORM_URL: http://localhost
          AEGIS_EMAIL: ${{ env.AEGIS_E2E_EMAIL }}
          AEGIS_PASSWORD: ${{ env.AEGIS_E2E_PASSWORD }}
        run: |
          python -m pip install -e .
          aegis platform-status --json
      - name: Run all scanner engines E2E
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --no-deps -v "$PWD/e2e:/e2e:ro" -e AEGIS_BASE_URL=http://nginx -e AEGIS_DJANGO_URL=http://nginx/api/v1 -e AEGIS_FASTAPI_URL=http://nginx -e AEGIS_API_URL=http://nginx/api/v1 -e AEGIS_E2E_TARGET=aegis-scan-target -e AEGIS_MASSCAN_TARGET="$AEGIS_MASSCAN_TARGET" -e AEGIS_E2E_TIMEOUT=600 -e AEGIS_VERIFY_TLS=false -e AEGIS_E2E_EMAIL="$AEGIS_E2E_EMAIL" -e AEGIS_E2E_PASSWORD="$AEGIS_E2E_PASSWORD" fastapi python /e2e/scanner_engines_e2e.py
      - name: Verify scanner queue consumption
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color scanner_worker > /tmp/scanner-worker.log
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color celery_worker > /tmp/general-worker.log
          for task in \
            fastapi_app.tasks.security_scan.run_nmap_scan \
            fastapi_app.tasks.security_scan.run_nuclei_scan \
            fastapi_app.tasks.advanced_scans.run_masscan_scan \
            fastapi_app.tasks.advanced_scans.run_semgrep_scan; do
            grep -F "Task ${task}[" /tmp/scanner-worker.log | grep -q 'received'
            if grep -F "Task ${task}[" /tmp/general-worker.log | grep -q 'received'; then
              echo "General worker consumed scanner task: $task" >&2
              exit 1
            fi
          done
      - name: Print stack state
        if: always()
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
      - name: Capture failure diagnostics
        if: failure()
        working-directory: aegis-platform
        shell: bash
        run: |
          set +e
          mkdir -p ci-artifacts
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a > ci-artifacts/compose-ps.txt 2>&1
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --timestamps django fastapi celery_worker scanner_worker scanner_egress celery_beat scan_target egress_forbidden_target nginx > ci-artifacts/compose.log 2>&1
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T scanner_egress nft list table netdev aegis_egress > ci-artifacts/scanner-egress-rules.txt 2>&1 || true
          docker images --digests > ci-artifacts/docker-images.txt 2>&1
          docker system df > ci-artifacts/docker-system-df.txt 2>&1
          tail -n 300 ci-artifacts/compose.log || true
          exit 0
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-black-box-${{ github.run_id }}-${{ github.run_attempt }}
          path: aegis-platform/ci-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Stop real platform stack
        if: always()
        working-directory: aegis-platform
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
