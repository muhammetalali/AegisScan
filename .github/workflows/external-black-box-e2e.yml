name: External Black-Box E2E

on:
  push:
    branches: [fix/finding-validation-loop]
    paths:
      - 'aegis-platform/e2e/**'
      - 'aegis-platform/backend/**'
      - 'aegis-platform/frontend/**'
      - 'aegis-platform/docker-compose.yml'
      - 'aegis-platform/docker/**'
      - '.github/workflows/external-black-box-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-black-box:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: aegisdb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ci-only-secret
      JWT_SECRET_KEY: ci-only-jwt-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      AUTH_COOKIE_SECURE: 'False'
      AUTHORIZED_SCAN_TARGETS: aegis-scan-target
      FRONTEND_URL: http://localhost
      LOG_LEVEL: INFO
      AEGIS_BASE_URL: http://nginx
      AEGIS_DJANGO_URL: http://nginx/api/v1
      AEGIS_FASTAPI_URL: http://nginx
      AEGIS_E2E_TARGET: aegis-scan-target
      AEGIS_E2E_TIMEOUT: '180'
      AEGIS_E2E_EMAIL: e2e-operator@aegisscan.local
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/.env <<EOF
          DEBUG=${DEBUG}
          SECRET_KEY=${SECRET_KEY}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          CELERY_BROKER_URL=${CELERY_BROKER_URL}
          CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
          AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
          FRONTEND_URL=${FRONTEND_URL}
          AUTHORIZED_SCAN_TARGETS=${AUTHORIZED_SCAN_TARGETS}
          LOG_LEVEL=${LOG_LEVEL}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          EOF
          test -s backend/.env
          grep -q '^DATABASE_URL=' backend/.env
          grep -q '^REDIS_URL=' backend/.env
      - name: Start real platform stack
        working-directory: aegis-platform
        run: docker compose up -d --build
      - name: Wait for platform readiness
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 django fastapi celery_worker scan_target nginx
          exit 1
      - name: Provision CI E2E operator
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          E2E_PASSWORD="$(python - <<'PY'
          import secrets
          print('Aegis-E2E-' + secrets.token_urlsafe(24))
          PY
          )"
          printf 'AEGIS_E2E_PASSWORD=%s\n' "$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$E2E_PASSWORD"
          docker compose exec -T \
            -e E2E_EMAIL="$AEGIS_E2E_EMAIL" \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            django python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          from django_project.users.models import UserRole
          User = get_user_model()
          email = os.environ['E2E_EMAIL']
          password = os.environ['E2E_PASSWORD']
          user, _ = User.objects.get_or_create(
              email=email,
              defaults={'first_name':'E2E','last_name':'Operator','role':UserRole.SECURITY_MANAGER,'is_active':True,'is_verified':True},
          )
          user.first_name = 'E2E'
          user.last_name = 'Operator'
          user.role = UserRole.SECURITY_MANAGER
          user.is_active = True
          user.is_verified = True
          user.set_password(password)
          user.save(update_fields=['first_name','last_name','role','is_active','is_verified','password'])
          assert user.has_permission('project.create')
          assert user.has_permission('scan.create')
          print(f'Provisioned E2E operator: {email} ({user.role})')
          PY
      - name: Run HTTP-only black-box E2E
        working-directory: aegis-platform
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps \
            -v "$PWD/e2e:/e2e:ro" \
            -e AEGIS_BASE_URL=http://nginx \
            -e AEGIS_DJANGO_URL=http://nginx/api/v1 \
            -e AEGIS_FASTAPI_URL=http://nginx \
            -e AEGIS_E2E_TARGET=aegis-scan-target \
            -e AEGIS_E2E_TIMEOUT=180 \
            -e AEGIS_VERIFY_TLS=false \
            -e AEGIS_E2E_EMAIL="$AEGIS_E2E_EMAIL" \
            -e AEGIS_E2E_PASSWORD="$AEGIS_E2E_PASSWORD" \
            fastapi python /e2e/external_black_box_e2e.py
      - name: Print stack state
        if: always()
        working-directory: aegis-platform
        run: docker compose ps
      - name: Collect failure logs
        if: failure()
        working-directory: aegis-platform
        run: docker compose logs --tail=300 django fastapi celery_worker scan_target nginx
      - name: Stop real platform stack
        if: always()
        working-directory: aegis-platform
        run: docker compose down -v
