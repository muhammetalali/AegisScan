name: External Black-Box E2E

on:
  push:
    branches: [fix/finding-validation-loop]
    paths:
      - 'aegis-platform/e2e/**'
      - 'aegis-platform/backend/**'
      - 'aegis-platform/docker-compose.yml'
      - 'aegis-platform/docker/**'
      - '.github/workflows/external-black-box-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-black-box:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: aegisdb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      SECRET_KEY: ci-only-secret
      JWT_SECRET_KEY: ci-only-jwt-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      AUTH_COOKIE_SECURE: 'False'
      AUTHORIZED_SCAN_TARGETS: aegis-scan-target
      AEGIS_BASE_URL: http://nginx
      AEGIS_DJANGO_URL: http://nginx/api/v1
      AEGIS_FASTAPI_URL: http://nginx
      AEGIS_E2E_TARGET: aegis-scan-target
      AEGIS_E2E_TIMEOUT: '180'
      AEGIS_VERIFY_TLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Start real platform stack
        working-directory: aegis-platform
        run: docker compose up -d --build
      - name: Wait for platform readiness
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost/ready >/dev/null && curl -fsS http://localhost/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 django fastapi celery_worker scan_target nginx
          exit 1
      - name: Run HTTP-only black-box E2E
        working-directory: aegis-platform
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm \
            -v "$PWD/e2e:/e2e:ro" \
            -e AEGIS_BASE_URL=http://nginx \
            -e AEGIS_DJANGO_URL=http://nginx/api/v1 \
            -e AEGIS_FASTAPI_URL=http://nginx \
            -e AEGIS_E2E_TARGET=aegis-scan-target \
            -e AEGIS_E2E_TIMEOUT=180 \
            -e AEGIS_VERIFY_TLS=false \
            fastapi python /e2e/external_black_box_e2e.py
      - name: Print stack state
        if: always()
        working-directory: aegis-platform
        run: docker compose ps
      - name: Collect failure logs
        if: failure()
        working-directory: aegis-platform
        run: docker compose logs --tail=300 django fastapi celery_worker scan_target nginx
      - name: Stop real platform stack
        if: always()
        working-directory: aegis-platform
        run: docker compose down -v
