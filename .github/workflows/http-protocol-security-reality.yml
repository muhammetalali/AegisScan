name: HTTP Protocol Security Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/**'
      - 'aegis-platform/backend/fastapi_app/contracts/http_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/services/http_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_http_protocol_*.py'
      - '.github/workflows/http-protocol-security-reality.yml'
  push:
    branches: [main, codex/http-protocol-consistency-2026-09-12]
    paths:
      - 'aegis-platform/backend/enterprise/**'
      - 'aegis-platform/backend/fastapi_app/contracts/http_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/routers/web_security.py'
      - 'aegis-platform/backend/fastapi_app/services/http_protocol_security.py'
      - 'aegis-platform/backend/fastapi_app/services/credential_execution.py'
      - 'aegis-platform/backend/fastapi_app/services/test_http_protocol_*.py'
      - '.github/workflows/http-protocol-security-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-protocol-security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  http-protocol-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-http-protocol-django-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-http-protocol-jwt-secret-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-http-protocol-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-http-protocol-credential-fingerprint-key-0123456789

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile HTTP protocol plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/web_security_models.py \
            aegis-platform/backend/fastapi_app/contracts/http_protocol_security.py \
            aegis-platform/backend/fastapi_app/services/http_protocol_security.py \
            aegis-platform/backend/fastapi_app/services/credential_execution.py \
            aegis-platform/backend/fastapi_app/services/test_http_protocol_security.py \
            aegis-platform/backend/fastapi_app/services/test_http_protocol_credential_scope.py \
            aegis-platform/backend/fastapi_app/routers/web_security.py

      - name: Django model and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: HTTP framing translation Vault and persistence suite
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_http_protocol_security.py \
            fastapi_app/services/test_http_protocol_credential_scope.py \
            --junitxml=/tmp/http-protocol-security-junit.xml

      - name: Verify API registration and secret-safe contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.contracts.http_protocol_security import HttpProtocolCaseIn, HttpHopObservationIn

          paths = app.openapi()['paths']
          route = '/api/v1/web-security/projects/{project_id}/http-protocol/evaluate'
          assert route in paths, sorted(p for p in paths if 'protocol' in p)
          forbidden = {'raw_body', 'raw_headers', 'authorization', 'cookie', 'request_bytes', 'response_bytes'}
          assert forbidden.isdisjoint(HttpProtocolCaseIn.model_fields)
          assert forbidden.isdisjoint(HttpHopObservationIn.model_fields)
          print('HTTP_PROTOCOL_API_REGISTRATION=PASS')
          print('HTTP_PROTOCOL_SECRET_SAFE_CONTRACT=PASS')
          PY

      - name: Retain HTTP protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-protocol-security-reality-${{ github.sha }}
          path: /tmp/http-protocol-security-junit.xml
          retention-days: 30
          if-no-files-found: warn
