name: Remote Encrypted Backup Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/remote-encrypted-backup-reality.yml'
      - 'aegis-platform/scripts/backup_postgres.sh'
      - 'aegis-platform/scripts/verify_postgres_restore.sh'
      - 'aegis-platform/scripts/remote_backup.py'
      - 'aegis-platform/scripts/remote_backup_service.py'
      - 'aegis-platform/docker/backup/**'
      - 'aegis-platform/docker-compose.backup.yml'
      - 'aegis-platform/scripts/production_preflight.py'
      - 'tests/test_remote_backup.py'
      - 'tests/test_production_preflight.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  remote-encrypted-backup-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: remote-backup-reality-password
          POSTGRES_DB: aegisdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}

      - name: Install backup reality dependencies
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.1.1' 'boto3>=1.35,<2' 'cryptography>=42,<47'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Unit-test authenticated encryption and fail-closed controls
        run: python -m pytest -q tests/test_remote_backup.py tests/test_production_preflight.py

      - name: Start disposable remote S3-compatible object store
        run: |
          set -euo pipefail
          docker run -d --name aegis-backup-object-store \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=aegis-reality-access \
            -e MINIO_ROOT_PASSWORD=aegis-reality-secret-0123456789abcdef \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data --address :9000
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs aegis-backup-object-store; exit 1; fi
            sleep 2
          done

      - name: Create versioned remote bucket and private key material
        run: |
          set -euo pipefail
          mkdir -p /tmp/aegis-backup-secrets /tmp/aegis-local-backups /tmp/aegis-restore
          chmod 0700 /tmp/aegis-backup-secrets /tmp/aegis-local-backups /tmp/aegis-restore
          printf '%s' '{"access_key_id":"aegis-reality-access","secret_access_key":"aegis-reality-secret-0123456789abcdef"}' > /tmp/aegis-backup-secrets/s3.json
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/aegis-backup-secrets/encryption.key').write_bytes(bytes(range(32)))
          PY
          chmod 0600 /tmp/aegis-backup-secrets/s3.json /tmp/aegis-backup-secrets/encryption.key
          python - <<'PY'
          import boto3
          from botocore.config import Config
          s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:9000', region_name='us-east-1',
              aws_access_key_id='aegis-reality-access', aws_secret_access_key='aegis-reality-secret-0123456789abcdef',
              config=Config(signature_version='s3v4', s3={'addressing_style':'path'}))
          s3.create_bucket(Bucket='aegis-backups')
          s3.put_bucket_versioning(Bucket='aegis-backups', VersioningConfiguration={'Status':'Enabled'})
          assert s3.get_bucket_versioning(Bucket='aegis-backups')['Status'] == 'Enabled'
          PY

      - name: Seed authoritative PostgreSQL record and create atomic dump
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: aegis
          PGPASSWORD: remote-backup-reality-password
          PGDATABASE: aegisdb
          AEGIS_BACKUP_DIR: /tmp/aegis-local-backups
        run: |
          set -euo pipefail
          psql --set ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE django_migrations (id bigint PRIMARY KEY, app varchar(255), name varchar(255), applied timestamptz);
          CREATE TABLE users_user (id uuid PRIMARY KEY, email varchar(255) NOT NULL);
          INSERT INTO django_migrations VALUES (1, 'remote_backup', '0001_reality', now());
          INSERT INTO users_user VALUES ('00000000-0000-0000-0000-000000000061', 'remote-restore-proof@aegisscan.local');
          SQL
          backup="$(sh aegis-platform/scripts/backup_postgres.sh)"
          test -s "$backup" && test -s "${backup}.sha256"
          printf 'AEGIS_LOCAL_BACKUP=%s\n' "$backup" >> "$GITHUB_ENV"

      - name: Encrypt client-side and commit only ciphertext to remote store
        env:
          AEGIS_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          AEGIS_BACKUP_S3_REGION: us-east-1
          AEGIS_BACKUP_S3_BUCKET: aegis-backups
          AEGIS_BACKUP_S3_PREFIX: aegisscan/postgres
          AEGIS_BACKUP_S3_CREDENTIALS_FILE: /tmp/aegis-backup-secrets/s3.json
          AEGIS_BACKUP_ENCRYPTION_KEY_FILE: /tmp/aegis-backup-secrets/encryption.key
          AEGIS_BACKUP_REQUIRE_VERSIONING: 'true'
        run: |
          set -euo pipefail
          python aegis-platform/scripts/remote_backup.py push --allow-http --source "$AEGIS_LOCAL_BACKUP" --work-dir /tmp/aegis-local-backups > /tmp/push.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/push.json').read_text())
          assert result['status']=='committed'
          with open(Path('/tmp/aegis-manifest-key'), 'w') as f: f.write(result['manifest_key'])
          with open(Path('/tmp/aegis-object-key'), 'w') as f: f.write(result['object_key'])
          PY
          rm -f "$AEGIS_LOCAL_BACKUP" "${AEGIS_LOCAL_BACKUP}.sha256"
          test ! -e "$AEGIS_LOCAL_BACKUP"

      - name: Prove remote object is encrypted and plaintext marker is absent
        run: |
          set -euo pipefail
          python - <<'PY'
          import boto3
          from pathlib import Path
          from botocore.config import Config
          s3=boto3.client('s3', endpoint_url='http://127.0.0.1:9000', region_name='us-east-1',
            aws_access_key_id='aegis-reality-access', aws_secret_access_key='aegis-reality-secret-0123456789abcdef',
            config=Config(signature_version='s3v4', s3={'addressing_style':'path'}))
          key=Path('/tmp/aegis-object-key').read_text()
          body=s3.get_object(Bucket='aegis-backups', Key=key)['Body'].read()
          assert body.startswith(b'AEGISBK1')
          assert b'remote-restore-proof@aegisscan.local' not in body
          versions=s3.list_object_versions(Bucket='aegis-backups', Prefix='aegisscan/postgres').get('Versions', [])
          assert versions
          PY

      - name: Restore after local-loss simulation and verify authoritative record
        env:
          AEGIS_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          AEGIS_BACKUP_S3_REGION: us-east-1
          AEGIS_BACKUP_S3_BUCKET: aegis-backups
          AEGIS_BACKUP_S3_PREFIX: aegisscan/postgres
          AEGIS_BACKUP_S3_CREDENTIALS_FILE: /tmp/aegis-backup-secrets/s3.json
          AEGIS_BACKUP_ENCRYPTION_KEY_FILE: /tmp/aegis-backup-secrets/encryption.key
          AEGIS_BACKUP_REQUIRE_VERSIONING: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: aegis
          PGPASSWORD: remote-backup-reality-password
          AEGIS_RESTORE_REQUIRED_TABLES: django_migrations,users_user
          AEGIS_RESTORE_ASSERTION_SQL: "SELECT email FROM users_user WHERE id='00000000-0000-0000-0000-000000000061'"
          AEGIS_RESTORE_ASSERTION_EXPECTED: remote-restore-proof@aegisscan.local
        run: |
          set -euo pipefail
          manifest="$(cat /tmp/aegis-manifest-key)"
          python aegis-platform/scripts/remote_backup.py restore --allow-http --manifest-key "$manifest" --output /tmp/aegis-restore/recovered.dump --work-dir /tmp/aegis-restore
          sh aegis-platform/scripts/verify_postgres_restore.sh /tmp/aegis-restore/recovered.dump

      - name: Build and inspect hardened production backup runtime
        working-directory: aegis-platform
        run: |
          set -euo pipefail
          docker build -f docker/backup/Dockerfile -t aegisscan-backup:reality .
          user="$(docker image inspect aegisscan-backup:reality --format '{{.Config.User}}')"
          test "$user" = '10001:10001'
          docker run --rm --entrypoint python aegisscan-backup:reality /app/scripts/remote_backup.py --help >/dev/null

      - name: Cleanup remote reality store
        if: always()
        run: docker rm -f aegis-backup-object-store >/dev/null 2>&1 || true
