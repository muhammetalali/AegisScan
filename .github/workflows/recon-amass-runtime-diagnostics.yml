name: Recon Amass Runtime Diagnostics

'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recon-amass-runtime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recon-amass-runtime-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AEGIS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AEGIS_AMASS_NETWORK: aegis-amass-diagnostic
      AEGIS_AMASS_FIXTURE_IP: 172.31.0.53
      AEGIS_AMASS_NETWORK_GATEWAY: 172.31.0.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AEGIS_EXACT_HEAD }}
      - name: Prove exact diagnostic checkout
        run: test "$(git rev-parse HEAD)" = "${AEGIS_EXACT_HEAD}"

      - name: Build exact legacy scanner runtime and egress helper
        run: |
          set -euo pipefail
          docker build --no-cache -t aegis-amass:legacy -f aegis-platform/backend/Dockerfile.django aegis-platform/backend
          docker build --no-cache -t aegis-amass:scanner-egress aegis-platform/docker/scanner-egress

      - name: Generate fixture certificate
        run: |
          set -euo pipefail
          mkdir -p fixture-tls artifacts
          chmod 0777 artifacts
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -subj '/CN=AegisScan Amass Diagnostic CA' -keyout fixture-tls/ca.key -out fixture-tls/ca.crt
          openssl req -newkey rsa:2048 -sha256 -nodes -subj '/CN=dnsrepo.noc.org' -keyout fixture-tls/server.key -out fixture-tls/server.csr
          cat > fixture-tls/server.ext <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:dnsrepo.noc.org
          EOF
          openssl x509 -req -sha256 -days 1 -in fixture-tls/server.csr -CA fixture-tls/ca.crt -CAkey fixture-tls/ca.key -CAcreateserial -extfile fixture-tls/server.ext -out fixture-tls/server.crt
          chmod 0644 fixture-tls/ca.crt fixture-tls/server.crt
          chmod 0600 fixture-tls/ca.key fixture-tls/server.key

      - name: Start isolated fixture and shared namespace
        run: |
          set -euo pipefail
          docker network create --internal --subnet 172.31.0.0/16 "${AEGIS_AMASS_NETWORK}"
          docker run -d --name aegis-amass-diagnostic-fixture --network "${AEGIS_AMASS_NETWORK}" --ip "${AEGIS_AMASS_FIXTURE_IP}" --user 0:0 -v "$PWD/aegis-platform/e2e/amass_passive_fixture.py:/opt/aegis-amass-fixture.py:ro" -v "$PWD/fixture-tls/server.crt:/tls/server.crt:ro" -v "$PWD/fixture-tls/server.key:/tls/server.key:ro" --entrypoint python aegis-amass:legacy /opt/aegis-amass-fixture.py --cert /tls/server.crt --key /tls/server.key --fixture-ip "${AEGIS_AMASS_FIXTURE_IP}"
          for _ in $(seq 1 30); do docker logs aegis-amass-diagnostic-fixture 2>&1 | grep -q AEGIS_AMASS_PASSIVE_FIXTURE_READY && break; sleep 1; done
          docker logs aegis-amass-diagnostic-fixture 2>&1 | grep -q AEGIS_AMASS_PASSIVE_FIXTURE_READY
          docker run -d --name aegis-amass-diagnostic-legacy --user 0:0 --network "${AEGIS_AMASS_NETWORK}" --dns "${AEGIS_AMASS_FIXTURE_IP}" -v "$PWD/fixture-tls/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro" -v "$PWD/artifacts:/artifacts" --entrypoint sleep aegis-amass:legacy infinity
          docker run -d --name aegis-amass-diagnostic-redirect --network container:aegis-amass-diagnostic-legacy --cap-add NET_ADMIN -e AEGIS_AMASS_FIXTURE_IP -e AEGIS_AMASS_NETWORK_GATEWAY --entrypoint sh aegis-amass:scanner-egress -c '
            set -eu
            IFACE="$(ip route show 172.31.0.0/16 | awk '"'"'NR==1 {print $3}'"'"')"
            test -n "$IFACE"
            ip route replace default via "$AEGIS_AMASS_NETWORK_GATEWAY" dev "$IFACE"
            nft add table ip aegis_amass_fixture
            nft "add chain ip aegis_amass_fixture output { type nat hook output priority -100; policy accept; }"
            nft add rule ip aegis_amass_fixture output ip daddr != 127.0.0.0/8 udp dport 53 dnat to ${AEGIS_AMASS_FIXTURE_IP}:53
            nft add rule ip aegis_amass_fixture output ip daddr != 127.0.0.0/8 tcp dport 53 dnat to ${AEGIS_AMASS_FIXTURE_IP}:53
            exec tail -f /dev/null
          '
          sleep 1

      - name: Execute real managed runtime while preserving execution state
        run: |
          set -euo pipefail
          docker exec -i aegis-amass-diagnostic-legacy python - <<'PY'
          import json
          from pathlib import Path
          from fastapi_app.services import amass_managed_runtime as runtime

          # Private runtime state stays inside the disposable container. Only
          # the selected diagnostic exports belong in the host artifact mount.
          state_dir=Path('/tmp/aegis-diagnostic-state')
          state_dir.mkdir(mode=0o700)
          original_rmtree=runtime.shutil.rmtree
          runtime.shutil.rmtree=lambda *_args, **_kwargs: None
          try:
              code,stdout,stderr=runtime.run_managed_amass(
                  target='parity.test',
                  timeout_minutes=1,
                  root_dir=str(state_dir),
              )
          finally:
              runtime.shutil.rmtree=original_rmtree
          json.dump({'exit_code':code,'stdout':stdout,'stderr':stderr},open('/artifacts/runtime-result.json','w'),sort_keys=True,indent=2)
          roots=list(state_dir.glob('aegis-amass-*'))
          assert len(roots)==1, roots
          root=roots[0]
          (Path('/artifacts')/'managed-root.txt').write_text(str(root),encoding='utf-8')
          for name in ('engine.log','enum.stdout','enum.stderr','subs.stdout','subs.stderr'):
              source=root/name
              if source.exists():
                  (Path('/artifacts')/name).write_bytes(source.read_bytes())
          store=root/'home'/'.config'/'amass'
          json.dump({'files':[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()]},open('/artifacts/runtime-files.json','w'),sort_keys=True,indent=2)
          if (store/'asset.db').exists():
              import sqlite3
              db=sqlite3.connect(store/'asset.db')
              try:
                  tables=[r[0] for r in db.execute("select name from sqlite_master where type='table' order by name")]
                  dump={'tables':tables}
                  for table in tables:
                      if table.lower() in {'fqdn','asset','assets'}:
                          try:
                              dump[table]=db.execute(f'SELECT * FROM "{table}" LIMIT 200').fetchall()
                          except Exception as exc:
                              dump[table+'_error']=repr(exc)
                  json.dump(dump,open('/artifacts/asset-db-inspection.json','w'),default=str,sort_keys=True,indent=2)
              finally:
                  db.close()
          PY
          cat artifacts/runtime-result.json
          cat artifacts/engine.log || true
          cat artifacts/enum.stderr || true
          cat artifacts/subs.stderr || true
          cat artifacts/runtime-files.json
          cat artifacts/asset-db-inspection.json || true
          docker logs aegis-amass-diagnostic-fixture 2>&1

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-amass-runtime-diagnostics-${{ env.AEGIS_EXACT_HEAD }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker rm -f aegis-amass-diagnostic-redirect aegis-amass-diagnostic-legacy aegis-amass-diagnostic-fixture >/dev/null 2>&1 || true
          docker network rm "${AEGIS_AMASS_NETWORK}" >/dev/null 2>&1 || true
