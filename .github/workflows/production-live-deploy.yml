name: Internal Production Deploy and Acceptance

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to run the protected internal production rollout from main'
        required: true
        type: string
      repair_checkout:
        description: 'Restore tracked host files to its current approved HEAD before deployment; preserve local changes first'
        required: false
        type: boolean
        default: false
      file_acceptance:
        description: 'Run the one-release governed file upload and Semgrep production acceptance'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/deployment-requests/internal-production.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: aegisscan-internal-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resilience-runner-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, aegisscan-resilience]
    timeout-minutes: 10
    steps:
      - name: Prove downstream resilience runner runtime
        shell: bash
        run: |
          set -euo pipefail
          for command_name in git ssh ssh-keygen python3; do
            command -v "$command_name" >/dev/null
          done
          python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)' >/dev/null
          echo 'AEGISSCAN_RESILIENCE_RUNNER_READINESS=PASS'

  deploy-and-accept:
    needs: resilience-runner-readiness
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, aegisscan-production]
    timeout-minutes: 360
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.AEGIS_PRODUCTION_SSH_HOST }}
      PROD_SSH_PORT: ${{ vars.AEGIS_PRODUCTION_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.AEGIS_PRODUCTION_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.AEGIS_PRODUCTION_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.AEGIS_PRODUCTION_SSH_KNOWN_HOSTS }}
      PROD_ORIGIN: ${{ secrets.AEGIS_PRODUCTION_ORIGIN }}
      PROD_ENTERPRISE_CA_BUNDLE: ${{ secrets.AEGIS_PRODUCTION_ENTERPRISE_CA_BUNDLE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require pinned Python and isolated deployment venv
        shell: bash
        run: |
          set -euo pipefail
          command -v python >/dev/null
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f'production runner requires workflow-pinned Python 3.12, found {sys.version.split()[0]}')
          print(f'production_runner_python={sys.version.split()[0]}')
          PY
          python -m venv "$RUNNER_TEMP/aegis-production-venv"
          "$RUNNER_TEMP/aegis-production-venv/bin/python" -m pip --version
          echo "$RUNNER_TEMP/aegis-production-venv/bin" >> "$GITHUB_PATH"

      - name: Require explicit bounded production authorization and exact main release
        shell: bash
        env:
          AEGIS_DEPLOY_CONFIRM: ${{ inputs.confirm }}
          AEGIS_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python aegis-platform/scripts/production_deploy_request.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --current-sha "$GITHUB_SHA" \
            --event-before "${AEGIS_EVENT_BEFORE:-}" \
            --confirm "${AEGIS_DEPLOY_CONFIRM:-}" \
            --request-file .github/deployment-requests/internal-production.json \
            | tee /tmp/aegis-production-authorization.json
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          printf 'production_release_sha=%s\n' "$GITHUB_SHA"

      - name: Wait for exact-SHA Required CI Governance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci/wait_for_required_ci.py \
            --sha "$GITHUB_SHA" \
            --branch main \
            --workflow-name "Required CI Governance" \
            --event push \
            --timeout-seconds 4500 \
            --poll-seconds 15

      - name: Validate protected internal production transport material
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            PROD_SSH_HOST \
            PROD_SSH_PORT \
            PROD_SSH_USER \
            PROD_SSH_PRIVATE_KEY \
            PROD_SSH_KNOWN_HOSTS \
            PROD_ORIGIN \
            PROD_ENTERPRISE_CA_BUNDLE; do
            value="${!name:-}"
            [ -n "$value" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Protected production transport material is incomplete: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          case "$PROD_SSH_PORT" in
            ''|*[!0-9]*) echo 'PROD_SSH_PORT must be numeric' >&2; exit 1 ;;
          esac
          test "$PROD_SSH_PORT" -ge 1
          test "$PROD_SSH_PORT" -le 65535
          python - <<'PYVALIDATE'
          import ipaddress
          import os
          from urllib.parse import urlparse

          value = os.environ['PROD_ORIGIN'].strip()
          parsed = urlparse(value)
          if (
              parsed.scheme != 'https'
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.fragment
              or parsed.path not in {'', '/'}
              or parsed.query
              or parsed.params
          ):
              raise SystemExit('PROD_ORIGIN must be a valid HTTPS origin')
          host = parsed.hostname.strip().lower().strip('[]')
          try:
              address = ipaddress.ip_address(host)
          except ValueError:
              address = None
          if address is not None and (
              address.is_loopback
              or address.is_link_local
              or address.is_unspecified
              or address.is_multicast
          ):
              raise SystemExit('PROD_ORIGIN uses an unsafe endpoint address')
          PYVALIDATE
          LIVE_ORIGIN="${PROD_ORIGIN%/}"
          test -n "$LIVE_ORIGIN"
          printf 'AEGIS_LIVE_ORIGIN=%s\n' "$LIVE_ORIGIN" >> "$GITHUB_ENV"

      - name: Materialize pinned SSH and enterprise trust material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 /tmp/aegis-production
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > /tmp/aegis-production/id
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > /tmp/aegis-production/known_hosts
          printf '%s\n' "$PROD_ENTERPRISE_CA_BUNDLE" > /tmp/aegis-production/enterprise-ca.pem
          chmod 0600 \
            /tmp/aegis-production/id \
            /tmp/aegis-production/known_hosts \
            /tmp/aegis-production/enterprise-ca.pem
          test -s /tmp/aegis-production/id
          ssh-keygen -y -f /tmp/aegis-production/id >/dev/null
          test -s /tmp/aegis-production/known_hosts
          test -s /tmp/aegis-production/enterprise-ca.pem
          python - <<'PY'
          import hashlib
          import ssl
          from pathlib import Path
          path = Path('/tmp/aegis-production/enterprise-ca.pem')
          if path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit('enterprise CA bundle exceeds 2 MiB')
          ssl.create_default_context(cafile=str(path))
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f'enterprise_ca_sha256={digest}')
          PY
          {
            echo 'AEGIS_ENTERPRISE_CA_BUNDLE=/tmp/aegis-production/enterprise-ca.pem'
            echo 'REQUESTS_CA_BUNDLE=/tmp/aegis-production/enterprise-ca.pem'
            echo 'SSL_CERT_FILE=/tmp/aegis-production/enterprise-ca.pem'
          } >> "$GITHUB_ENV"
          echo 'AEGIS_PROD_TRANSPORT_READY=true' >> "$GITHUB_ENV"

      - name: Install internal acceptance client dependency
        run: python -m pip install requests==2.32.5

      - name: Reclaim bounded non-durable production storage
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/scripts/production_storage_reclaim.py \
            --path /opt/aegisscan/AegisScan/aegis-platform \
            --minimum-free-gib 60 \
            --target-free-gib 68 \
            --defer-on-docker-unavailable \
            | tee /tmp/aegis-production/storage-reclaim.json

      - name: Deploy exact main SHA through private enterprise perimeter
        shell: bash
        run: |
          set -euo pipefail
          repair_args=()
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.repair_checkout }}" = 'true' ]; then
            repair_args+=(--repair-current-checkout)
          fi
          python aegis-platform/scripts/production_remote_deploy.py \
            --host "$PROD_SSH_HOST" \
            --port "$PROD_SSH_PORT" \
            --user "$PROD_SSH_USER" \
            --private-key /tmp/aegis-production/id \
            --known-hosts /tmp/aegis-production/known_hosts \
            --release-sha "$GITHUB_SHA" \
            --origin "$AEGIS_LIVE_ORIGIN" \
            --output-json /tmp/aegis-production/deploy.json \
            "${repair_args[@]}"


      - name: Prove Alertmanager and committed encrypted remote backup on production host
        id: operational_acceptance
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/scripts/production_remote_operational_acceptance.py \
            --host "$PROD_SSH_HOST" \
            --port "$PROD_SSH_PORT" \
            --user "$PROD_SSH_USER" \
            --private-key /tmp/aegis-production/id \
            --known-hosts /tmp/aegis-production/known_hosts \
            --release-sha "$GITHUB_SHA" \
            --e2e-fixture-output /tmp/aegis-production/e2e-fixture.json \
            | tee /tmp/aegis-production/operational-acceptance.json

      - name: Verify internal HTTPS, private resolution, enterprise CA and security headers
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/scripts/public_acceptance.py \
            --origin "$AEGIS_LIVE_ORIGIN" \
            | tee /tmp/aegis-production/internal-acceptance.json

      - name: Load one-run governed E2E identities
        shell: bash
        env:
          AEGIS_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import stat
          from pathlib import Path

          path = Path('/tmp/aegis-production/e2e-fixture.json')
          if not path.is_file() or path.is_symlink():
              raise SystemExit('private E2E fixture file is missing or unsafe')
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit('private E2E fixture file must be mode 0600')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('schema') != 'aegisscan.production-e2e-fixture.v1':
              raise SystemExit('private E2E fixture schema mismatch')
          if payload.get('release_sha') != os.environ['AEGIS_RELEASE_SHA']:
              raise SystemExit('private E2E fixture release SHA mismatch')
          required = ('actor_email','actor_password','approver_email','approver_password','target')
          missing = [name for name in required if not str(payload.get(name) or '').strip()]
          if missing:
              raise SystemExit(f'private E2E fixture fields missing: {missing}')
          for key in ('actor_password','approver_password'):
              print(f"::add-mask::{payload[key]}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f"AEGIS_E2E_EMAIL={payload['actor_email']}\n")
              handle.write(f"AEGIS_E2E_PASSWORD={payload['actor_password']}\n")
              handle.write(f"AEGIS_E2E_APPROVER_EMAIL={payload['approver_email']}\n")
              handle.write(f"AEGIS_E2E_APPROVER_PASSWORD={payload['approver_password']}\n")
              handle.write(f"AEGIS_E2E_TARGET={payload['target']}\n")
              handle.write('AEGIS_E2E_EPHEMERAL_FIXTURE=true\n')
          PY
      - name: Run real internal-network black-box production E2E
        shell: bash
        env:
          AEGIS_E2E_TIMEOUT: '900'
          AEGIS_VERIFY_TLS: 'true'
          AEGIS_E2E_FILE_ACCEPTANCE: ${{ inputs.file_acceptance || false }}
          AEGIS_E2E_FILE_REQUIRE_FINDING: ${{ inputs.file_acceptance || false }}
        run: |
          set -euo pipefail
          export AEGIS_BASE_URL="$AEGIS_LIVE_ORIGIN"
          export AEGIS_DJANGO_URL="$AEGIS_LIVE_ORIGIN/api/v1"
          export AEGIS_FASTAPI_URL="$AEGIS_LIVE_ORIGIN"
          export AEGIS_API_URL="$AEGIS_LIVE_ORIGIN/api/v1"
          python aegis-platform/e2e/external_black_box_e2e.py \
            2>&1 | tee /tmp/aegis-production/internal-black-box.log

      - name: Prove installed CLI against internal production
        shell: bash
        env:
          AEGIS_PLATFORM_URL: ${{ env.AEGIS_LIVE_ORIGIN }}
          AEGIS_EMAIL: ${{ env.AEGIS_E2E_EMAIL }}
          AEGIS_PASSWORD: ${{ env.AEGIS_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          python -m pip install -e .
          aegis platform-status --json \
            | tee /tmp/aegis-production/cli-platform-status.json

      - name: Deactivate one-run E2E identities
        if: always()
        shell: bash
        env:
          AEGIS_E2E_CLEANUP_ONLY: 'true'
          AEGIS_VERIFY_TLS: 'true'
        run: |
          set -euo pipefail
          if [ "${AEGIS_E2E_EPHEMERAL_FIXTURE:-}" != "true" ]; then
            echo 'No ephemeral E2E fixture was loaded; identity cleanup is not required.'
            exit 0
          fi
          export AEGIS_BASE_URL="$AEGIS_LIVE_ORIGIN"
          export AEGIS_DJANGO_URL="$AEGIS_LIVE_ORIGIN/api/v1"
          export AEGIS_FASTAPI_URL="$AEGIS_LIVE_ORIGIN"
          python aegis-platform/e2e/external_black_box_e2e.py \
            2>&1 | tee /tmp/aegis-production/e2e-cleanup.log
          rm -f /tmp/aegis-production/e2e-fixture.json

      - name: Restore fail-closed production scanner scope
        if: always()
        shell: bash
        env:
          AEGIS_OPERATIONAL_OUTCOME: ${{ steps.operational_acceptance.outcome }}
        run: |
          set -euo pipefail
          if [ "${AEGIS_PROD_TRANSPORT_READY:-}" != "true" ]; then
            echo 'Protected SSH/CA material was not fully materialized; remote scope cleanup is not applicable.'
            exit 0
          fi
          case "${AEGIS_OPERATIONAL_OUTCOME:-}" in
            success|failure|cancelled) ;;
            skipped|'')
              echo 'Operational acceptance never started; this run did not activate an E2E scope.'
              exit 0
              ;;
            *) echo 'Unexpected operational acceptance outcome' >&2; exit 1 ;;
          esac
          python aegis-platform/scripts/production_remote_operational_acceptance.py \
            --host "$PROD_SSH_HOST" \
            --port "$PROD_SSH_PORT" \
            --user "$PROD_SSH_USER" \
            --private-key /tmp/aegis-production/id \
            --known-hosts /tmp/aegis-production/known_hosts \
            --release-sha "$GITHUB_SHA" \
            --cleanup-e2e-scope \
            | tee /tmp/aegis-production/e2e-scope-cleanup.json

      - name: Build internal go-live evidence manifest
        if: success()
        shell: bash
        env:
          AEGIS_RELEASE_SHA: ${{ github.sha }}
          AEGIS_RUN_ID: ${{ github.run_id }}
          AEGIS_RUN_ATTEMPT: ${{ github.run_attempt }}
          AEGIS_INTERNAL_ORIGIN: ${{ env.AEGIS_LIVE_ORIGIN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('/tmp/aegis-production')
          evidence_files = [
              'storage-reclaim.json',
              'deploy.json',
              'operational-acceptance.json',
              'internal-acceptance.json',
              'internal-black-box.log',
              'cli-platform-status.json',
              'e2e-cleanup.log',
              'e2e-scope-cleanup.json',
          ]
          def load_json(name):
              try:
                  return json.loads((root / name).read_text(encoding='utf-8'))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'internal go-live evidence is not valid JSON: {name}: {exc}') from exc

          digests = {}
          for name in evidence_files:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing required internal go-live evidence: {name}')
              digests[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          storage = load_json('storage-reclaim.json')
          if storage.get('schema') != 'aegisscan.production-storage-reclaim.v1' or storage.get('status') != 'success':
              raise SystemExit('production storage reclaim evidence mismatch')
          if storage.get('volume_prune_performed') is not False:
              raise SystemExit('production storage reclaim must never prune volumes')
          deployment = load_json('deploy.json')
          if deployment.get('schema') != 'aegisscan.remote-production-deploy.v1' or deployment.get('status') != 'success':
              raise SystemExit('remote deployment evidence mismatch')
          if deployment.get('release_sha') != os.environ['AEGIS_RELEASE_SHA']:
              raise SystemExit('remote deployment release SHA mismatch')
          remote_deployment = deployment.get('remote_deployment') or {}
          host_storage = remote_deployment.get('storage_reclaim') or {}
          if host_storage.get('schema') != 'aegisscan.production-host-storage-reclaim.v1':
              raise SystemExit('privileged production-host storage reclaim evidence is missing')
          if host_storage.get('status') != 'success' or host_storage.get('volume_prune_performed') is not False:
              raise SystemExit('privileged production-host storage reclaim evidence is invalid')
          if int(host_storage.get('after_free_bytes') or 0) < 60 * 1024**3:
              raise SystemExit('privileged production-host storage reclaim did not restore the 60 GiB minimum')
          if int(storage.get('after_free_bytes') or 0) < 60 * 1024**3 and storage.get('deferred_to_privileged_deploy') is not True:
              raise SystemExit('runner-side storage below minimum was not explicitly deferred to privileged deploy')

          operational = load_json('operational-acceptance.json')
          if operational.get('schema') != 'aegisscan.remote-production-operational-acceptance.v1' or operational.get('status') != 'success':
              raise SystemExit('remote operational acceptance evidence mismatch')
          if operational.get('release_sha') != os.environ['AEGIS_RELEASE_SHA']:
              raise SystemExit('remote operational acceptance release SHA mismatch')
          host_acceptance = operational.get('operational_acceptance') or {}
          if host_acceptance.get('schema') != 'aegisscan.production-operational-acceptance.v1':
              raise SystemExit('production-host operational acceptance schema mismatch')
          alertmanager = host_acceptance.get('alertmanager') or {}
          backup = host_acceptance.get('backup') or {}
          if alertmanager.get('status') != 'ready':
              raise SystemExit('Alertmanager readiness evidence is missing')
          if backup.get('status') != 'healthy' or not backup.get('backup_id'):
              raise SystemExit('committed encrypted remote backup evidence is missing')

          acceptance = load_json('internal-acceptance.json')
          if acceptance.get('schema') != 'aegisscan.internal-production-acceptance.v1':
              raise SystemExit('internal acceptance schema mismatch')
          if acceptance.get('deployment_mode') != 'internal':
              raise SystemExit('internal acceptance mode mismatch')
          enterprise_ca = acceptance.get('enterprise_ca') or {}
          ca_sha256 = str(enterprise_ca.get('sha256', ''))
          if len(ca_sha256) != 64:
              raise SystemExit('internal acceptance enterprise CA evidence is missing')

          manifest = {
              'schema': 'aegisscan.go-live-evidence.v3',
              'status': 'success',
              'deployment_mode': 'internal',
              'network_scope': 'rfc1918-or-ipv6-ula',
              'release_sha': os.environ['AEGIS_RELEASE_SHA'],
              'run_id': os.environ['AEGIS_RUN_ID'],
              'run_attempt': os.environ['AEGIS_RUN_ATTEMPT'],
              'internal_origin': os.environ['AEGIS_INTERNAL_ORIGIN'],
              'enterprise_ca_sha256': ca_sha256,
              'storage_after_free_bytes': host_storage['after_free_bytes'],
              'storage_reclaimed_bytes': host_storage['reclaimed_bytes'],
              'storage_volume_prune_performed': host_storage['volume_prune_performed'],
              'runner_storage_deferred_to_privileged_deploy': bool(storage.get('deferred_to_privileged_deploy')),
              'alertmanager_status': alertmanager['status'],
              'backup_status': backup['status'],
              'backup_id': backup['backup_id'],
              'completed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'sha256': digests,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload internal go-live evidence
        if: success()
        uses: ./.github/actions/resilient-evidence-upload
        with:
          name: aegisscan-internal-go-live-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/aegis-production/storage-reclaim.json
            /tmp/aegis-production/deploy.json
            /tmp/aegis-production/operational-acceptance.json
            /tmp/aegis-production/internal-acceptance.json
            /tmp/aegis-production/internal-black-box.log
            /tmp/aegis-production/cli-platform-status.json
            /tmp/aegis-production/e2e-cleanup.log
            /tmp/aegis-production/e2e-scope-cleanup.json
            /tmp/aegis-production/manifest.json
          retention-days: 90

      - name: Destroy local protected transport and trust material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f /tmp/aegis-production-authorization.json
          if [ -d /tmp/aegis-production ]; then
            rm -f \
              /tmp/aegis-production/id \
              /tmp/aegis-production/known_hosts \
              /tmp/aegis-production/enterprise-ca.pem \
              /tmp/aegis-production/e2e-fixture.json
          fi
