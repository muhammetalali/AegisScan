name: Scanner Reliability Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/tasks/**'
      - '.github/workflows/scanner-reliability-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/tasks/**'
      - '.github/workflows/scanner-reliability-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-reliability-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  scanner-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-scanner-reliability-secret-012345678901234567890123
      JWT_SECRET_KEY: ci-scanner-reliability-jwt-012345678901234567890123
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      AUTHORIZED_SCAN_TARGETS: 127.0.0.1
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: '1'
      DJANGO_SETTINGS_MODULE: django_project.settings
      PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Migrate durable state
        working-directory: aegis-platform/backend
        run: python manage.py migrate --noinput
      - name: Prove failure, retry, redelivery and worker reliability contracts
        working-directory: aegis-platform/backend
        run: >-
          python -m pytest -q
          fastapi_app/tasks/test_nmap_failure_contract.py
          fastapi_app/tasks/test_scanner_retry_recovery.py
          fastapi_app/tasks/test_scanner_redelivery.py
          fastapi_app/tasks/test_celery_reliability_contract.py
