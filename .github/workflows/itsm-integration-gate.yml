name: AegisScan ITSM Integration Gate

on:
  push:
    branches:
      - main
      - feature/enterprise-platform-ui-v2
  pull_request:
    paths:
      - 'packages/backend/fastapi_app/**'
      - 'tests/**'
      - '.github/workflows/itsm-integration-gate.yml'

permissions:
  contents: read

jobs:
  itsm-contract:
    name: ITSM lifecycle and provider contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: django_project.settings
      SECRET_KEY: ci-itsm-secret-key-012345678901234567890123
      JWT_SECRET_KEY: ci-itsm-jwt-secret-key-012345678901234567890123
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegisdb
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      WS_ALLOW_QUERY_TOKEN: "0"
      LOG_TO_FILE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and platform dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Python compile gate
        run: |
          python -m compileall -q aegis packages/backend/fastapi_app tests
      - name: Core integration tests
        run: python -m pytest -q tests/test_integration.py tests/test_platform.py
      - name: ITSM provider contract smoke gate
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "packages.backend.fastapi_app.services.itsm_capability",
              "packages.backend.fastapi_app.services.fusion_engine",
          ]
          for module in modules:
              importlib.import_module(module)
          print("ITSM provider modules imported successfully")
          PY
