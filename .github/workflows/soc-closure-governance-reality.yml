name: SOC Closure Governance Reality

on:
  push:
    branches: [codex/soc-closure-governance-2026-09-13, main]
    paths:
      - 'aegis-platform/backend/enterprise/soc_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0024_soc_closure_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/security_operations.py'
      - 'aegis-platform/backend/fastapi_app/services/soc_closure_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/test_security_operations.py'
      - 'aegis-platform/backend/fastapi_app/services/test_soc_closure_governance.py'
      - 'aegis-platform/backend/fastapi_app/routers/security_operations.py'
      - '.github/workflows/soc-closure-governance-reality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soc-closure-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  closure-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-soc-closure-secret-key-0123456789abcdef
      JWT_SECRET_KEY: ci-soc-closure-jwt-secret-key-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-soc-closure-evidence-hmac-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-soc-closure-fingerprint-key-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt
      - run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile closure plane
        run: |
          python -m py_compile aegis-platform/backend/enterprise/soc_models.py aegis-platform/backend/enterprise/migrations/0024_soc_closure_governance.py aegis-platform/backend/fastapi_app/services/security_operations.py aegis-platform/backend/fastapi_app/services/soc_closure_governance.py aegis-platform/backend/fastapi_app/routers/security_operations.py aegis-platform/backend/fastapi_app/services/test_security_operations.py aegis-platform/backend/fastapi_app/services/test_soc_closure_governance.py
      - name: Schema and migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: API closure contract
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from fastapi_app.main import app
          from fastapi_app.routers.security_operations import CaseClosureIn
          base='/api/v1/investigation/soc/projects/{project_id}/cases/{case_id}/closure'
          assert base in app.openapi()['paths']
          assert CaseClosureIn.model_config.get('extra') == 'forbid'
          print('SOC_CLOSURE_API=PASS')
          PY
      - name: Run closure governance PostgreSQL reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_soc_closure_governance.py --junitxml=/tmp/soc-closure-junit.xml
      - name: Run lineage regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_security_operations.py fastapi_app/services/test_remediation_verification_lineage.py fastapi_app/services/test_finding_disposition.py --junitxml=/tmp/soc-closure-regression.xml
      - name: Retain closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-closure-governance-${{ github.sha }}
          path: |
            /tmp/soc-closure-junit.xml
            /tmp/soc-closure-regression.xml
          retention-days: 30
          if-no-files-found: warn
