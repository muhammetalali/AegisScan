name: Codex Archive Prune Once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-archive-prune-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  archive-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify archives and prune historical branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const codexArchiveRef = 'heads/archive/codex-history-2026-09-12';
            const codexArchiveSha = 'bd00a9ecfb168590683f75f30f9ea0a503701f19';
            const legacyArchiveRef = 'heads/archive/feature-enterprise-platform-ui-v2-50698f5';
            const legacyArchiveSha = '50698f5dbda1f7eb0a1e9a743e752278323a4c7d';
            const retiredFeatureRef = 'heads/feature/enterprise-platform-ui-v2';

            const { data: codexArchive } = await github.rest.git.getRef({
              owner, repo, ref: codexArchiveRef,
            });
            if (codexArchive.object.sha !== codexArchiveSha) {
              core.setFailed(`Codex archive ref mismatch: expected ${codexArchiveSha}, got ${codexArchive.object.sha}`);
              return;
            }

            const { data: legacyArchive } = await github.rest.git.getRef({
              owner, repo, ref: legacyArchiveRef,
            });
            if (legacyArchive.object.sha !== legacyArchiveSha) {
              core.setFailed(`Legacy archive ref mismatch: expected ${legacyArchiveSha}, got ${legacyArchive.object.sha}`);
              return;
            }

            const { data: manifestFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'docs/archive/CODEX_BRANCH_ARCHIVE_2026-09-12.json',
              ref: context.sha,
            });
            if (Array.isArray(manifestFile) || !manifestFile.content) {
              core.setFailed('Codex branch archive manifest is missing or not a file');
              return;
            }
            const manifest = JSON.parse(Buffer.from(manifestFile.content, 'base64').toString('utf8'));
            if (manifest.codex_archive_root_sha !== codexArchiveSha) {
              core.setFailed('Manifest is not bound to the expected codex archive root');
              return;
            }

            const uniqueHeads = [...new Set(manifest.branches.map((entry) => entry.sha))];
            for (const sha of uniqueHeads) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${sha}...${codexArchiveSha}`,
              });
              if (comparison.merge_base_commit?.sha !== sha) {
                core.setFailed(`Archive reachability proof failed for historical head ${sha}`);
                return;
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref)
            );

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const current = new Map(branches.map((branch) => [branch.name, branch.commit.sha]));
            const changed = [];
            const skippedOpen = [];
            const deleteTargets = [];
            const alreadyMissing = [];

            for (const entry of manifest.branches) {
              if (openHeads.has(entry.name)) {
                skippedOpen.push(entry.name);
                continue;
              }
              const liveSha = current.get(entry.name);
              if (!liveSha) {
                alreadyMissing.push(entry.name);
                continue;
              }
              if (liveSha !== entry.sha) {
                changed.push({ branch: entry.name, manifest_sha: entry.sha, live_sha: liveSha });
                continue;
              }
              deleteTargets.push(entry.name);
            }

            if (changed.length > 0) {
              core.info(JSON.stringify({ changed }, null, 2));
              core.setFailed(`${changed.length} branch refs changed after archival snapshot; refusing deletion`);
              return;
            }
            if (skippedOpen.length > 0) {
              core.info(JSON.stringify({ skippedOpen }, null, 2));
              core.setFailed(`${skippedOpen.length} codex branches are open PR heads; refusing historical bulk prune`);
              return;
            }

            const failures = [];
            const deleted = [];
            for (const branch of deleteTargets) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                deleted.push(branch);
                await new Promise((resolve) => setTimeout(resolve, 75));
              } catch (error) {
                failures.push({
                  branch,
                  status: error.status ?? null,
                  message: error.message,
                });
              }
            }

            if (!openHeads.has('feature/enterprise-platform-ui-v2')) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: retiredFeatureRef,
                });
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) {
                  failures.push({
                    branch: 'feature/enterprise-platform-ui-v2',
                    status: error.status ?? null,
                    message: error.message,
                  });
                }
              }
            }

            core.summary
              .addHeading('Historical Branch Archive & Prune')
              .addRaw(`Codex manifest entries: ${manifest.branches.length}\\n\\n`)
              .addRaw(`Unique historical head SHAs verified reachable: ${uniqueHeads.length}\\n\\n`)
              .addRaw(`Codex refs deleted: ${deleted.length}\\n\\n`)
              .addRaw(`Already missing: ${alreadyMissing.length}\\n\\n`)
              .addRaw(`Failures: ${failures.length}\\n\\n`)
              .write();

            core.info(JSON.stringify({
              archive_ref: codexArchiveRef,
              archive_sha: codexArchiveSha,
              manifest_entries: manifest.branches.length,
              unique_heads_verified: uniqueHeads.length,
              deleted_count: deleted.length,
              already_missing_count: alreadyMissing.length,
              failures,
            }, null, 2));

            if (failures.length > 0) {
              core.setFailed(`Historical ref pruning had ${failures.length} failures`);
            }
