name: Sol Web Messaging Cutover Migration

on:
  push:
    branches:
      - sol-web-messaging-validator
    paths:
      - .github/workflows/sol-web-messaging-cutover.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-web-messaging-validator
          fetch-depth: 0
      - name: Apply deterministic WSTG CLNT-11 cutover
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('aegis-platform/backend/resources/methodologies/wstg/v4.2')
          tests_path = root / 'tests.json'
          requirements_path = root / 'capability_requirements.json'
          manifest_path = root / 'manifest.json'

          tests = json.loads(tests_path.read_text(encoding='utf-8'))
          matches = [row for row in tests if row.get('id') == 'WSTG-v42-CLNT-11']
          if len(matches) != 1:
              raise SystemExit(f'expected one WSTG-v42-CLNT-11 record, found {len(matches)}')
          if matches[0].get('classification') not in {'GAP_NATIVE_SMALL', 'ASSISTED_EXISTING'}:
              raise SystemExit(f'unexpected prior classification: {matches[0].get("classification")!r}')
          matches[0]['classification'] = 'ASSISTED_EXISTING'
          tests_path.write_text(json.dumps(tests, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          requirements = json.loads(requirements_path.read_text(encoding='utf-8'))
          matches = [row for row in requirements if row.get('id') == 'web.clnt.web-messaging']
          if len(matches) != 1:
              raise SystemExit(f'expected one web.clnt.web-messaging record, found {len(matches)}')
          requirement = matches[0]
          requirement['availability'] = 'existing'
          requirement['provider_bindings'] = [
              {'kind': 'registry_capability', 'ref': 'browser.spa-discovery'},
          ]
          requirements_path.write_text(
              json.dumps(requirements, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          counts = manifest.get('classification_counts')
          if not isinstance(counts, dict):
              raise SystemExit('manifest classification_counts missing')
          actual_counts = {}
          for row in tests:
              classification = row.get('classification')
              actual_counts[classification] = actual_counts.get(classification, 0) + 1
          if sum(actual_counts.values()) != 97:
              raise SystemExit(f'classification total is not 97: {actual_counts}')
          manifest['classification_counts'] = actual_counts
          manifest['files']['tests.json'] = hashlib.sha256(tests_path.read_bytes()).hexdigest()
          manifest['capability_mapping_files']['capability_requirements.json'] = hashlib.sha256(
              requirements_path.read_bytes()
          ).hexdigest()
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          if actual_counts.get('ASSISTED_EXISTING') != 46:
              raise SystemExit(f'unexpected ASSISTED_EXISTING count: {actual_counts}')
          if actual_counts.get('GAP_NATIVE_SMALL') != 4:
              raise SystemExit(f'unexpected GAP_NATIVE_SMALL count: {actual_counts}')
          print(json.dumps({
              'classification_counts': actual_counts,
              'tests_sha256': manifest['files']['tests.json'],
              'requirements_sha256': manifest['capability_mapping_files']['capability_requirements.json'],
          }, sort_keys=True))
          PY
      - name: Commit generated methodology changes
        shell: bash
        run: |
          if git diff --quiet -- aegis-platform/backend/resources/methodologies/wstg/v4.2; then
            echo 'Methodology already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aegis-platform/backend/resources/methodologies/wstg/v4.2/tests.json \
                  aegis-platform/backend/resources/methodologies/wstg/v4.2/capability_requirements.json \
                  aegis-platform/backend/resources/methodologies/wstg/v4.2/manifest.json
          git commit -m 'Cut over WSTG web messaging to existing capability'
          git push origin HEAD:sol-web-messaging-validator
