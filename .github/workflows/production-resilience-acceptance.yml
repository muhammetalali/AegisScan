name: Production Resilience Acceptance

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DRILL to run the protected production resilience acceptance'
        required: true
        type: string
  workflow_run:
    workflows: ['Internal Production Deploy and Acceptance']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: aegisscan-production-resilience
  cancel-in-progress: false

jobs:
  resilience-acceptance:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, aegisscan-resilience]
    timeout-minutes: 240
    environment: production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: resilience-restore-password
          POSTGRES_DB: aegis_restore_control
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_restore_control"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      PROD_ORIGIN: ${{ secrets.AEGIS_PRODUCTION_ORIGIN }}
      PROD_SSH_HOST: ${{ secrets.AEGIS_PRODUCTION_SSH_HOST }}
      PROD_SSH_PORT: ${{ vars.AEGIS_PRODUCTION_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.AEGIS_PRODUCTION_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.AEGIS_PRODUCTION_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.AEGIS_PRODUCTION_SSH_KNOWN_HOSTS }}
      PROD_ENTERPRISE_CA_BUNDLE: ${{ secrets.AEGIS_PRODUCTION_ENTERPRISE_CA_BUNDLE }}
      BACKUP_ENDPOINT: ${{ secrets.AEGIS_PRODUCTION_BACKUP_S3_ENDPOINT }}
      BACKUP_REGION: ${{ vars.AEGIS_PRODUCTION_BACKUP_S3_REGION || 'us-east-1' }}
      BACKUP_BUCKET: ${{ secrets.AEGIS_PRODUCTION_BACKUP_S3_BUCKET }}
      BACKUP_PREFIX: ${{ vars.AEGIS_PRODUCTION_BACKUP_S3_PREFIX || 'aegisscan/postgres' }}
      BACKUP_ADDRESSING_STYLE: ${{ vars.AEGIS_PRODUCTION_BACKUP_S3_ADDRESSING_STYLE || 'path' }}
      BACKUP_CREDENTIALS_JSON: ${{ secrets.AEGIS_PRODUCTION_BACKUP_S3_CREDENTIALS_JSON }}
      BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.AEGIS_PRODUCTION_BACKUP_ENCRYPTION_KEY_B64 }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require authorized exact-main resilience acceptance
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm }}" = "DRILL"
          else
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.head_branch }}" = "main"
            test "${{ github.event.workflow_run.head_repository.full_name }}" = "$GITHUB_REPOSITORY"
          fi
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') echo 'release SHA must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Validate protected production material
        shell: bash
        run: |
          set -euo pipefail
          for name in             PROD_ORIGIN             PROD_SSH_HOST             PROD_SSH_PORT             PROD_SSH_USER             PROD_SSH_PRIVATE_KEY             PROD_SSH_KNOWN_HOSTS             PROD_ENTERPRISE_CA_BUNDLE             BACKUP_ENDPOINT             BACKUP_REGION             BACKUP_BUCKET             BACKUP_PREFIX             BACKUP_ADDRESSING_STYLE             BACKUP_CREDENTIALS_JSON             BACKUP_ENCRYPTION_KEY_B64; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Required protected production material is missing: $name" >&2
              exit 1
            fi
          done
          case "$PROD_SSH_PORT" in
            ''|*[!0-9]*) echo 'PROD_SSH_PORT must be numeric' >&2; exit 1 ;;
          esac
          test "$PROD_SSH_PORT" -ge 1
          test "$PROD_SSH_PORT" -le 65535
          case "$BACKUP_ENDPOINT" in
            https://*) ;;
            *) echo 'Production backup endpoint must use HTTPS' >&2; exit 1 ;;
          esac

      - name: Verify provisioned resilience dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in docker git ssh curl; do
            command -v "$command_name" >/dev/null
          done
          docker info >/dev/null
          python -m pip install 'boto3>=1.35,<2' 'cryptography>=42,<47'
          docker run --rm --pull=missing postgres:16-alpine psql --version
          docker run --rm --pull=missing postgres:16-alpine pg_restore --version

      - name: Materialize ephemeral protected transport material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 /tmp/aegis-resilience /tmp/aegis-resilience/recovery
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > /tmp/aegis-resilience/id
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > /tmp/aegis-resilience/known_hosts
          printf '%s' "$BACKUP_CREDENTIALS_JSON" > /tmp/aegis-resilience/s3.json
          printf '%s' "$BACKUP_ENCRYPTION_KEY_B64" | base64 --decode > /tmp/aegis-resilience/backup.key
          printf '%s\n' "$PROD_ENTERPRISE_CA_BUNDLE" > /tmp/aegis-resilience/enterprise-ca.pem
          chmod 0600             /tmp/aegis-resilience/id             /tmp/aegis-resilience/known_hosts             /tmp/aegis-resilience/s3.json             /tmp/aegis-resilience/backup.key             /tmp/aegis-resilience/enterprise-ca.pem
          ssh-keygen -y -f /tmp/aegis-resilience/id >/dev/null
          test "$(stat -c '%s' /tmp/aegis-resilience/backup.key)" = 32
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/aegis-resilience/s3.json').read_text())
          assert isinstance(payload, dict)
          assert payload.get('access_key_id')
          assert payload.get('secret_access_key')
          import ssl
          ssl.create_default_context(cafile='/tmp/aegis-resilience/enterprise-ca.pem')
          PY

      - name: Trigger fresh exact-release remote encrypted backup
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/scripts/production_resilience_backup.py             --host "$PROD_SSH_HOST"             --port "$PROD_SSH_PORT"             --user "$PROD_SSH_USER"             --private-key /tmp/aegis-resilience/id             --known-hosts /tmp/aegis-resilience/known_hosts             --release-sha "$RELEASE_SHA"             | tee /tmp/aegis-resilience/remote-backup.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/aegis-resilience/remote-backup.json').read_text().splitlines()[-1])
          assert payload['schema'] == 'aegisscan.production-resilience-backup.v1'
          assert payload['status'] == 'success'
          backup = payload['backup']
          for name in ('backup_id', 'manifest_key', 'manifest_version_id', 'object_version_id', 'source_sha256'):
              assert backup.get(name), (name, backup)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"AEGIS_DR_BACKUP_ID={backup['backup_id']}\n")
              stream.write(f"AEGIS_DR_MANIFEST_KEY={backup['manifest_key']}\n")
              stream.write(f"AEGIS_DR_MANIFEST_VERSION_ID={backup['manifest_version_id']}\n")
              stream.write(f"AEGIS_DR_OBJECT_VERSION_ID={backup['object_version_id']}\n")
              stream.write(f"AEGIS_DR_SOURCE_SHA256={backup['source_sha256']}\n")
          PY

      - name: Restore exact manifest version from external encrypted storage
        shell: bash
        env:
          AEGIS_BACKUP_S3_ENDPOINT: ${{ env.BACKUP_ENDPOINT }}
          AEGIS_BACKUP_S3_REGION: ${{ env.BACKUP_REGION }}
          AEGIS_BACKUP_S3_BUCKET: ${{ env.BACKUP_BUCKET }}
          AEGIS_BACKUP_S3_PREFIX: ${{ env.BACKUP_PREFIX }}
          AEGIS_BACKUP_S3_ADDRESSING_STYLE: ${{ env.BACKUP_ADDRESSING_STYLE }}
          AEGIS_BACKUP_REQUIRE_VERSIONING: 'true'
          AEGIS_BACKUP_S3_CREDENTIALS_FILE: /tmp/aegis-resilience/s3.json
          AEGIS_BACKUP_ENCRYPTION_KEY_FILE: /tmp/aegis-resilience/backup.key
        run: |
          set -euo pipefail
          python aegis-platform/scripts/remote_backup.py restore             --manifest-key "$AEGIS_DR_MANIFEST_KEY"             --manifest-version-id "$AEGIS_DR_MANIFEST_VERSION_ID"             --output /tmp/aegis-resilience/recovery/production.dump             --work-dir /tmp/aegis-resilience             | tee /tmp/aegis-resilience/remote-restore.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/aegis-resilience/remote-restore.json').read_text().splitlines()[-1])
          assert payload['status'] == 'restored-locally', payload
          assert payload['backup_id'] == os.environ['AEGIS_DR_BACKUP_ID'], payload
          assert payload['manifest_version_id'] == os.environ['AEGIS_DR_MANIFEST_VERSION_ID'], payload
          assert payload['object_version_id'] == os.environ['AEGIS_DR_OBJECT_VERSION_ID'], payload
          assert payload['source_sha256'] == os.environ['AEGIS_DR_SOURCE_SHA256'], payload
          PY

      - name: Destructive restore into disposable PostgreSQL and verify authoritative tables
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: aegis
          PGPASSWORD: resilience-restore-password
          PGDATABASE: aegis_restore_control
          AEGIS_RESTORE_REQUIRED_TABLES: django_migrations,users_user
        run: |
          set -euo pipefail
          docker run --rm --pull=missing \
            --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=67108864 \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD \
            -e AEGIS_RESTORE_REQUIRED_TABLES \
            -v "$GITHUB_WORKSPACE/aegis-platform/scripts/verify_postgres_restore.sh:/verify_postgres_restore.sh:ro" \
            -v /tmp/aegis-resilience/recovery:/recovery:ro \
            postgres:16-alpine \
            sh /verify_postgres_restore.sh /recovery/production.dump \
            | tee /tmp/aegis-resilience/postgres-restore.txt
          grep -q 'RESTORE_VERIFICATION=PASS' /tmp/aegis-resilience/postgres-restore.txt

      - name: Recover the production API and verify HTTPS and scanner health
        shell: bash
        run: |
          set -euo pipefail
          python aegis-platform/scripts/production_resilience_backup.py \
            --host "$PROD_SSH_HOST" --port "$PROD_SSH_PORT" --user "$PROD_SSH_USER" \
            --private-key /tmp/aegis-resilience/id --known-hosts /tmp/aegis-resilience/known_hosts \
            --release-sha "$RELEASE_SHA" --action recover-services --origin "$PROD_ORIGIN" \
            | tee /tmp/aegis-resilience/service-recovery.json

      - name: Prove authenticated internal alert delivery after recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          lines = [line.strip() for line in Path('/tmp/aegis-resilience/service-recovery.json').read_text().splitlines() if line.strip()]
          if not lines:
              raise SystemExit('service recovery returned no JSON')
          payload = json.loads(lines[-1])
          if payload.get('status') != 'success':
              raise SystemExit('service recovery did not succeed')
          remote = payload.get('recovery')
          if not isinstance(remote, dict):
              raise SystemExit('service recovery remote result is missing')
          delivery = remote.get('alert_delivery')
          if not isinstance(delivery, dict):
              raise SystemExit('service recovery did not prove alert delivery')
          baseline = float(delivery.get('baseline_events', -1))
          current = float(delivery.get('current_events', -1))
          if (
              delivery.get('status') != 'success'
              or delivery.get('authenticated') is not True
              or delivery.get('transport') != 'https'
              or delivery.get('receiver') != 'internal'
              or delivery.get('proof_alertname') != 'AegisProductionAlertDeliveryAcceptance'
              or delivery.get('proof_release_sha') != payload.get('release_sha')
              or len(str(delivery.get('audit_payload_sha256', ''))) != 64
              or any(ch not in '0123456789abcdef' for ch in str(delivery.get('audit_payload_sha256', '')))
              or current <= baseline
          ):
              raise SystemExit('authenticated internal alert delivery proof is invalid')
          evidence = {
              'status':'success', 'baseline':baseline, 'current':current, 'failed':0.0,
              'authenticated':True, 'transport':'https', 'receiver':'internal',
              'proof_alertname':delivery['proof_alertname'],
              'proof_release_sha':delivery['proof_release_sha'],
              'audit_payload_sha256':delivery['audit_payload_sha256'],
          }
          Path('/tmp/aegis-resilience/external-alert-delivery.json').write_text(
              json.dumps(evidence, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('/tmp/aegis-resilience/alertmanager-metrics.txt').write_text(
              f'aegis_alert_receiver_events_total {current}\n', encoding='utf-8'
          )
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Build production resilience evidence manifest
        if: success()
        shell: bash
        env:
          AEGIS_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          AEGIS_RUN_ID: ${{ github.run_id }}
          AEGIS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('/tmp/aegis-resilience')
          required = [
              'remote-backup.json',
              'remote-restore.json',
              'postgres-restore.txt',
              'service-recovery.json',
              'external-alert-delivery.json',
              'alertmanager-metrics.txt',
          ]
          digests = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing required resilience evidence: {name}')
              digests[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              'schema': 'aegisscan.production-resilience-evidence.v1',
              'status': 'success',
              'release_sha': os.environ['AEGIS_RELEASE_SHA'],
              'run_id': os.environ['AEGIS_RUN_ID'],
              'run_attempt': os.environ['AEGIS_RUN_ATTEMPT'],
              'completed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'backup_id': os.environ['AEGIS_DR_BACKUP_ID'],
              'manifest_version_id': os.environ['AEGIS_DR_MANIFEST_VERSION_ID'],
              'object_version_id': os.environ['AEGIS_DR_OBJECT_VERSION_ID'],
              'sha256': digests,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Prove evidence contains no protected secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for secret in             "$BACKUP_CREDENTIALS_JSON"             "$BACKUP_ENCRYPTION_KEY_B64"             "$PROD_SSH_PRIVATE_KEY"; do
            if [ -n "$secret" ] && grep -R -F -- "$secret" /tmp/aegis-resilience                 --exclude=id --exclude=known_hosts --exclude=s3.json --exclude=backup.key 2>/dev/null; then
              echo 'protected production material leaked into resilience evidence' >&2
              exit 1
            fi
          done

      - name: Upload production resilience evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aegisscan-production-resilience-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: |
            /tmp/aegis-resilience/remote-backup.json
            /tmp/aegis-resilience/remote-restore.json
            /tmp/aegis-resilience/service-recovery.json
            /tmp/aegis-resilience/postgres-restore.txt
            /tmp/aegis-resilience/external-alert-delivery.json
            /tmp/aegis-resilience/alertmanager-metrics.txt
            /tmp/aegis-resilience/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Destroy ephemeral production secret material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f             /tmp/aegis-resilience/id             /tmp/aegis-resilience/known_hosts             /tmp/aegis-resilience/s3.json             /tmp/aegis-resilience/backup.key             /tmp/aegis-resilience/enterprise-ca.pem
