name: Cryptographic Asset CBOM Reality

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-a/cryptographic-asset-cbom-20260922]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cryptographic-asset-cbom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-test-crypto-cbom-key
      JWT_SECRET_KEY: ci-test-crypto-cbom-jwt
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Compile Cryptographic Asset Plane
        run: python -m py_compile aegis-platform/backend/enterprise/crypto_asset_models.py aegis-platform/backend/enterprise/migrations/0043_crypto_asset_cbom_plane.py aegis-platform/backend/fastapi_app/services/crypto_asset_plane.py aegis-platform/backend/fastapi_app/services/test_crypto_asset_plane.py aegis-platform/backend/fastapi_app/routers/crypto_assets.py aegis-platform/backend/fastapi_app/main.py
      - name: PostgreSQL migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: CBOM governance reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q fastapi_app/services/test_crypto_asset_plane.py --junitxml=/tmp/cryptographic-asset-cbom-junit.xml
      - name: Retain CBOM Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptographic-asset-cbom-${{ github.sha }}
          path: /tmp/cryptographic-asset-cbom-junit.xml
          retention-days: 30
          if-no-files-found: warn
