name: AGOM Evidence Qualification Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0031_agom_evidence_qualification.py'
      - 'aegis-platform/backend/fastapi_app/services/evidence_qualification.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/test_evidence_qualification.py'
      - '.github/workflows/agom-evidence-qualification-reality.yml'
  push:
    branches: [main, chatgpt-a/evidence-qualification-2026-09-19]
    paths:
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0031_agom_evidence_qualification.py'
      - 'aegis-platform/backend/fastapi_app/services/evidence_qualification.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/test_evidence_qualification.py'
      - '.github/workflows/agom-evidence-qualification-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agom-evidence-qualification-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-agom-evidence-qualification-django-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-agom-evidence-qualification-jwt-secret-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-agom-evidence-qualification-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-agom-evidence-qualification-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile Evidence Qualification plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/governed_action_models.py \
            aegis-platform/backend/enterprise/migrations/0031_agom_evidence_qualification.py \
            aegis-platform/backend/fastapi_app/services/evidence_qualification.py \
            aegis-platform/backend/fastapi_app/services/governed_action_executor.py \
            aegis-platform/backend/fastapi_app/services/test_evidence_qualification.py

      - name: Verify Django schema reality and migration drift
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.governed_action_models import EvidenceQualificationEvaluation

          assert connection.vendor == 'postgresql', connection.vendor
          fields = {field.name for field in EvidenceQualificationEvaluation._meta.fields}
          required = {
              'organization', 'project', 'requested_by', 'subject_type', 'subject_id',
              'target', 'authorization_ref', 'execution_ref', 'policy_version',
              'policy_snapshot', 'requested_evidence_ids', 'evidence_snapshot',
              'evidence_set_hash', 'decision', 'qualified', 'reason_codes', 'reasons',
              'evaluation_context', 'evaluation_fingerprint', 'evaluated_at',
          }
          assert required <= fields, sorted(required - fields)
          print('AGOM_EVIDENCE_QUALIFICATION_SCHEMA=WIRED')
          PY

      - name: Run Evidence Qualification Reality tests on PostgreSQL
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q --junitxml=agom-evidence-qualification-junit.xml \
            fastapi_app/services/test_evidence_qualification.py

      - name: Run governed Finding and AGOM regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_finding_governed_actions.py \
            fastapi_app/services/test_governed_action_executor.py \
            fastapi_app/services/test_entity_capability_adapters.py \
            fastapi_app/services/test_entity_capability_freshness.py \
            fastapi_app/services/test_entity_capability_scope_guards.py

      - name: Prove Evidence to Qualification to Governed Decision wiring
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from enterprise.governed_action_models import EvidenceQualificationEvaluation

          service = Path('fastapi_app/services/evidence_qualification.py').read_text()
          executor = Path('fastapi_app/services/governed_action_executor.py').read_text()
          assert 'class EvidenceQualificationPolicy' in service
          assert 'def qualify_evidence' in service
          assert "policy_version='finding-confirmation-evidence.v1'" in executor
          assert "'evidence_qualification': _qualification_view(qualification)" in executor
          assert len(EvidenceQualificationEvaluation.Decision.values) >= 10
          print('EVIDENCE_TO_QUALIFICATION_TO_GOVERNED_DECISION=WIRED')
          PY

      - name: Retain Evidence Qualification Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agom-evidence-qualification-${{ github.sha }}
          path: aegis-platform/backend/agom-evidence-qualification-junit.xml
          retention-days: 30
          if-no-files-found: warn
