name: AGOM Global Temporal Policy Reality

on:
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/governed_temporal_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0032_agom_global_time_exception_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_temporal_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/workflow_sla.py'
      - 'aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/finding_disposition.py'
      - 'aegis-platform/backend/fastapi_app/services/test_governed_temporal_policy.py'
      - '.github/workflows/agom-global-temporal-policy-reality.yml'
  push:
    branches: [main, chatgpt-a/agom-global-time-exception-policy-2026-09-19]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/governed_temporal_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0032_agom_global_time_exception_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_temporal_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_action_executor.py'
      - 'aegis-platform/backend/fastapi_app/services/workflow_sla.py'
      - 'aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py'
      - 'aegis-platform/backend/fastapi_app/services/finding_disposition.py'
      - 'aegis-platform/backend/fastapi_app/services/test_governed_temporal_policy.py'
      - '.github/workflows/agom-global-temporal-policy-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agom-global-temporal-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  temporal-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-agom-temporal-django-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-agom-temporal-jwt-secret-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-agom-temporal-evidence-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-agom-temporal-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile global temporal plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/apps.py \
            aegis-platform/backend/enterprise/governed_temporal_models.py \
            aegis-platform/backend/enterprise/migrations/0032_agom_global_time_exception_policy.py \
            aegis-platform/backend/fastapi_app/services/governed_temporal_policy.py \
            aegis-platform/backend/fastapi_app/services/governed_action_executor.py \
            aegis-platform/backend/fastapi_app/services/workflow_sla.py \
            aegis-platform/backend/fastapi_app/services/assurance_obligation_governance.py \
            aegis-platform/backend/fastapi_app/services/finding_disposition.py \
            aegis-platform/backend/fastapi_app/services/test_governed_temporal_policy.py

      - name: Verify schema and migration drift on PostgreSQL
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.governed_temporal_models import (
              GovernedTemporalEvaluation,
              GovernedTemporalException,
              GovernedTemporalExceptionRevocation,
          )
          assert connection.vendor == 'postgresql', connection.vendor
          assert GovernedTemporalException._meta.get_field('grant_fingerprint').unique is True
          assert GovernedTemporalExceptionRevocation._meta.get_field('exception').one_to_one is True
          assert GovernedTemporalEvaluation._meta.get_field('evaluation_fingerprint').unique is True
          names = {item.name for item in GovernedTemporalEvaluation._meta.constraints}
          assert 'govtemp_eval_decision_allowed' in names
          print('AGOM_GLOBAL_TEMPORAL_SCHEMA=WIRED')
          PY

      - name: Run global temporal policy Reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q --junitxml=agom-global-temporal-junit.xml \
            fastapi_app/services/test_governed_temporal_policy.py

      - name: Run temporal consumer regressions
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q \
            fastapi_app/services/test_finding_disposition.py \
            fastapi_app/services/test_assurance_obligation_governance.py \
            fastapi_app/services/test_finding_governed_actions.py \
            fastapi_app/services/test_governed_action_executor.py

      - name: Prove all current governed actions depend on temporal authority
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()
          from enterprise.governed_temporal_models import GovernedTemporalEvaluation

          executor = Path('fastapi_app/services/governed_action_executor.py').read_text()
          temporal = Path('fastapi_app/services/governed_temporal_policy.py').read_text()
          sla = Path('fastapi_app/services/workflow_sla.py').read_text()
          assurance = Path('fastapi_app/services/assurance_obligation_governance.py').read_text()
          disposition = Path('fastapi_app/services/finding_disposition.py').read_text()

          assert '_preflight_temporal_policy(' in executor
          assert "'temporal_policy': _temporal_view(temporal)" in executor
          assert 'hard_blocks_non_overridable' in temporal
          for hard in (
              'tenant_authority',
              'separation_of_duties',
              'revoked_evidence',
              'expired_authorization',
              'immutable_security_control',
          ):
              assert hard in temporal
          assert 'classify_sla(' in sla
          assert 'classify_deadline(' in assurance
          assert 'validate_review_deadline(' in disposition
          assert set(GovernedTemporalEvaluation.Decision.values) == {
              'active', 'not_yet_effective', 'expired', 'grace_active',
              'review_due', 'exception_active', 'waiver_active', 'hard_blocked',
          }
          print('GLOBAL_TIME_EXCEPTION_POLICY=AUTHORITATIVE')
          PY

      - name: Retain global temporal Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agom-global-temporal-${{ github.sha }}
          path: aegis-platform/backend/agom-global-temporal-junit.xml
          retention-days: 30
          if-no-files-found: warn
