  push:
    branches:
      - chatgpt-a/complete-governed-action-executors-2026-09-20
    paths:
      - 'aegis-platform/backend/enterprise/governed_action_models.py'
      - 'aegis-platform/backend/enterprise/detection_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0035_detection_publication_delivery.py'
      - 'aegis-platform/backend/fastapi_app/services/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/routers/detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/services/test_detection_engineering.py'
      - 'aegis-platform/backend/fastapi_app/services/test_governed_detection_publication.py'
      - 'aegis-platform/backend/enterprise/models.py'
      - 'aegis-platform/backend/enterprise/migrations/0034_integration_live_acceptance.py'
      - 'aegis-platform/backend/enterprise/tasks.py'
      - 'aegis-platform/backend/fastapi_app/celery_app.py'
      - 'aegis-platform/backend/fastapi_app/tasks/test_celery_reliability_contract.py'
