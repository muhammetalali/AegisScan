name: Enterprise Operational Workspace Reality

on:
  push:
    branches:
      - main
      - chatgpt-a/enterprise-operational-workspace-2026-09-21
    paths:
      - 'aegis-platform/frontend/src/pages/assurance/WorkflowControlTowerPage.tsx'
      - 'aegis-platform/frontend/src/pages/assurance/WorkflowControlTowerPage.test.tsx'
      - 'aegis-platform/frontend/src/components/layout/Layout.tsx'
      - 'aegis-platform/frontend/src/components/layout/Sidebar.tsx'
      - 'aegis-platform/frontend/src/components/layout/CommandPalette.tsx'
      - 'aegis-platform/frontend/src/contracts/agom.ts'
      - 'aegis-platform/frontend/src/services/agom.ts'
      - 'aegis-platform/backend/fastapi_app/routers/work_queue.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_work_queue.py'
      - '.github/workflows/enterprise-operational-workspace-reality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/frontend/src/pages/assurance/WorkflowControlTowerPage.tsx'
      - 'aegis-platform/frontend/src/pages/assurance/WorkflowControlTowerPage.test.tsx'
      - 'aegis-platform/frontend/src/components/layout/Layout.tsx'
      - 'aegis-platform/frontend/src/components/layout/Sidebar.tsx'
      - 'aegis-platform/frontend/src/components/layout/CommandPalette.tsx'
      - 'aegis-platform/frontend/src/contracts/agom.ts'
      - 'aegis-platform/frontend/src/services/agom.ts'
      - 'aegis-platform/backend/fastapi_app/routers/work_queue.py'
      - 'aegis-platform/backend/fastapi_app/services/governed_work_queue.py'
      - '.github/workflows/enterprise-operational-workspace-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-operational-workspace-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  operational-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-a7-operational-workspace-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-a7-operational-workspace-jwt-0123456789abcdef
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-a7-operational-workspace-evidence-key-0123456789
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-a7-operational-workspace-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: aegis-disposition-target,aegis-scan-target
      ALLOW_SINGLE_LABEL_SCAN_TARGETS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout is exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aegis-platform/frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: aegis-platform/frontend
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Run operational workspace contract tests
        working-directory: aegis-platform/frontend
        run: |
          set -o pipefail
          npx vitest run             src/pages/assurance/WorkflowControlTowerPage.test.tsx             src/services/agom.test.ts             | tee /tmp/a7-workspace-tests.txt

      - name: Typecheck and build frontend
        working-directory: aegis-platform/frontend
        run: |
          set -o pipefail
          npm run build | tee /tmp/a7-frontend-build.txt

      - name: Reject direct work-queue transport bypass in workspace
        run: |
          if grep -nE "apiHelpers\.(get|post|patch|put|delete).*work-queue|/work-queue"             aegis-platform/frontend/src/pages/assurance/WorkflowControlTowerPage.tsx; then
            echo "Operational workspace must consume the governed queue through agomSdk only." >&2
            exit 1
          fi
          echo "A7_AGOM_SDK_ONLY=PASS" | tee /tmp/a7-sdk-boundary.txt

      - name: Verify governed queue backend reality on PostgreSQL
        working-directory: aegis-platform/backend
        run: |
          set -o pipefail
          python manage.py migrate --noinput
          pytest -q             fastapi_app/services/test_governed_work_queue.py             fastapi_app/routers/test_governed_work_queue_api.py             | tee /tmp/a7-backend-work-queue-tests.txt

      - name: Prove operational route and AGOM queue routes remain registered
        working-directory: aegis-platform/backend
        run: |
          set -o pipefail
          python - <<'PY' | tee /tmp/a7-route-proof.txt
          from fastapi_app.main import app
          paths = app.openapi()['paths']
          required = {
              '/api/v1/work-queue',
              '/api/v1/work-queue/{source_type}/{source_id}/claim',
              '/api/v1/work-queue/{source_type}/{source_id}/renew',
              '/api/v1/work-queue/{source_type}/{source_id}/release',
          }
          missing = sorted(required - set(paths))
          assert not missing, missing
          print('A7_GOVERNED_WORK_QUEUE_ROUTES=WIRED')
          PY
          grep -F 'path="/assurance/workflow"' ../frontend/src/App.tsx >/dev/null
          echo "A7_OPERATIONAL_WORKSPACE_ROUTE=WIRED" | tee -a /tmp/a7-route-proof.txt

      - name: Retain A7 Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-operational-workspace-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/a7-workspace-tests.txt
            /tmp/a7-frontend-build.txt
            /tmp/a7-sdk-boundary.txt
            /tmp/a7-backend-work-queue-tests.txt
            /tmp/a7-route-proof.txt
