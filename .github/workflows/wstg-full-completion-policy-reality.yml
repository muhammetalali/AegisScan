name: WSTG Full Completion Policy Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_completion_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_completion_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/wstg_completion_attestation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_completion_attestation.py'
      - 'aegis-platform/backend/enterprise/models.py'
      - 'aegis-platform/backend/enterprise/migrations/0048_wstg_methodology_attestation.py'
      - 'aegis-platform/backend/scripts/wstg_full_completion_policy_reality.py'
      - 'aegis-platform/backend/fastapi_app/services/wstg_capability_mapping.py'
      - 'aegis-platform/backend/resources/methodologies/wstg/v4.2/**'
      - '.github/workflows/wstg-full-completion-policy-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_completion_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_completion_policy.py'
      - 'aegis-platform/backend/fastapi_app/services/wstg_completion_attestation.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_completion_attestation.py'
      - 'aegis-platform/backend/enterprise/models.py'
      - 'aegis-platform/backend/enterprise/migrations/0048_wstg_methodology_attestation.py'
      - 'aegis-platform/backend/scripts/wstg_full_completion_policy_reality.py'
      - 'aegis-platform/backend/fastapi_app/services/wstg_capability_mapping.py'
      - 'aegis-platform/backend/resources/methodologies/wstg/v4.2/**'
      - '.github/workflows/wstg-full-completion-policy-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wstg-full-completion-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  wstg-full-completion-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-wstg-completion-django-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-wstg-completion-jwt-secret-0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Validate WSTG completion schema
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Test governed WSTG completion policy
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: python -m pytest -q fastapi_app/services/test_wstg_completion_policy.py fastapi_app/services/test_wstg_completion_attestation.py
      - name: Prove 97 of 97 completion paths without inventing verdicts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONPATH=aegis-platform/backend             python aegis-platform/backend/scripts/wstg_full_completion_policy_reality.py             | tee artifacts/wstg-full-completion-policy-reality.json
      - uses: actions/upload-artifact@v4
        with:
          name: wstg-full-completion-policy-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/wstg-full-completion-policy-reality.json
          if-no-files-found: error
          retention-days: 30
