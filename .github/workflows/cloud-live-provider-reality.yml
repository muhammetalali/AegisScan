name: Cloud Live Provider Reality

'on':
  workflow_dispatch:

concurrency:
  group: cloud-live-provider-reality-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-provider-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AEGIS_AWS_CLOUD_TARGET: ${{ secrets.AEGIS_AWS_CLOUD_TARGET }}
      AEGIS_AWS_CLOUD_CREDENTIAL_JSON: ${{ secrets.AEGIS_AWS_CLOUD_CREDENTIAL_JSON }}
      AEGIS_AZURE_CLOUD_TARGET: ${{ secrets.AEGIS_AZURE_CLOUD_TARGET }}
      AEGIS_AZURE_CLOUD_CREDENTIAL_JSON: ${{ secrets.AEGIS_AZURE_CLOUD_CREDENTIAL_JSON }}
      AEGIS_GCP_CLOUD_TARGET: ${{ secrets.AEGIS_GCP_CLOUD_TARGET }}
      AEGIS_GCP_CLOUD_CREDENTIAL_JSON: ${{ secrets.AEGIS_GCP_CLOUD_CREDENTIAL_JSON }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt

      - name: Install exact cloud runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Require at least one complete live-provider binding
        id: configured
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for provider in AWS AZURE GCP; do
            target_var="AEGIS_${provider}_CLOUD_TARGET"
            credential_var="AEGIS_${provider}_CLOUD_CREDENTIAL_JSON"
            target="${!target_var:-}"
            credential="${!credential_var:-}"
            if { [ -n "$target" ] && [ -z "$credential" ]; } || { [ -z "$target" ] && [ -n "$credential" ]; }; then
              echo "::error::${provider} live-provider binding is partial; target and credential must be configured together"
              exit 78
            fi
            if [ -n "$target" ]; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -lt 1 ]; then
            echo "::error::Cloud Live Provider Reality requires at least one real AWS, Azure, or GCP target+credential binding"
            exit 78
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Configured live providers: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute and validate configured live providers
        working-directory: aegis-platform/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-live-proof"
          chmod 0700 "$RUNNER_TEMP/cloud-live-proof"

          run_provider() {
            provider="$1"
            target="$2"
            credential="$3"
            if [ -z "$target" ]; then
              return 0
            fi

            credential_file="$RUNNER_TEMP/cloud-live-proof/${provider}-credential.json"
            result_file="$RUNNER_TEMP/cloud-live-proof/${provider}-result.json"
            proof_file="$RUNNER_TEMP/cloud-live-proof/${provider}-proof.json"
            umask 077
            printf '%s' "$credential" > "$credential_file"
            chmod 0600 "$credential_file"

            python -m fastapi_app.services.cloud_security               "$target" --credentials-file "$credential_file" > "$result_file"

            python -m fastapi_app.services.cloud_live_provider_reality               --provider "$provider"               --target "$target"               --credential-file "$credential_file"               --result-file "$result_file"               --source-sha "$GITHUB_SHA"               --output "$proof_file"

            rm -f -- "$credential_file" "$result_file"
            echo "${provider}: live provider proof PASSED" >> "$GITHUB_STEP_SUMMARY"
          }

          run_provider aws "${AEGIS_AWS_CLOUD_TARGET:-}" "${AEGIS_AWS_CLOUD_CREDENTIAL_JSON:-}"
          run_provider azure "${AEGIS_AZURE_CLOUD_TARGET:-}" "${AEGIS_AZURE_CLOUD_CREDENTIAL_JSON:-}"
          run_provider gcp "${AEGIS_GCP_CLOUD_TARGET:-}" "${AEGIS_GCP_CLOUD_CREDENTIAL_JSON:-}"

          test "$(find "$RUNNER_TEMP/cloud-live-proof" -name '*-proof.json' -type f | wc -l)" -eq "${{ steps.configured.outputs.count }}"

      - name: Prove artifacts contain no raw credential material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof_dir = Path(os.environ['RUNNER_TEMP']) / 'cloud-live-proof'
          proofs = sorted(proof_dir.glob('*-proof.json'))
          assert proofs
          for proof in proofs:
              data = json.loads(proof.read_text(encoding='utf-8'))
              assert data['schema'] == 'aegis.cloud-live-provider-proof.v1'
              assert data['identity_verified'] is True
              assert data['read_only'] is True
              assert data['ambient_credentials_used'] is False
              assert len(data['result_sha256']) == 64
          print(f'validated-live-provider-artifacts={len(proofs)}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-live-provider-proof-${{ github.sha }}
          path: ${{ runner.temp }}/cloud-live-proof/*-proof.json
          if-no-files-found: error
          retention-days: 14
