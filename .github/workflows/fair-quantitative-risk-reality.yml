name: FAIR Quantitative Risk Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/fair_risk_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0045_fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/services/fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/services/test_fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/routers/fair_risk.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/fair-quantitative-risk-reality.yml'
  push:
    branches: [main, chatgpt-a/fair-quantitative-risk-20260922]
    paths:
      - 'aegis-platform/backend/enterprise/apps.py'
      - 'aegis-platform/backend/enterprise/fair_risk_models.py'
      - 'aegis-platform/backend/enterprise/migrations/0045_fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/services/fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/services/test_fair_quantitative_risk.py'
      - 'aegis-platform/backend/fastapi_app/routers/fair_risk.py'
      - 'aegis-platform/backend/fastapi_app/main.py'
      - '.github/workflows/fair-quantitative-risk-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fair-quantitative-risk-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  fair-quantitative-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-fair-risk-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-fair-risk-jwt-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AEGIS_EVIDENCE_HMAC_KEY: ci-fair-risk-evidence-hmac-0123456789abcdef
      CREDENTIAL_VAULT_KEYS: Gda3DhfD-EcoacpdQeTFnHHH1Q_rxQZaUISBiMvSwUM=
      CREDENTIAL_FINGERPRINT_KEY: ci-fair-risk-credential-fingerprint-0123456789
      AUTHORIZED_SCAN_TARGETS: 127.0.0.1/32

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt

      - name: Compile FAIR quantitative risk plane
        run: |
          python -m py_compile \
            aegis-platform/backend/enterprise/fair_risk_models.py \
            aegis-platform/backend/enterprise/migrations/0045_fair_quantitative_risk.py \
            aegis-platform/backend/fastapi_app/services/fair_quantitative_risk.py \
            aegis-platform/backend/fastapi_app/services/test_fair_quantitative_risk.py \
            aegis-platform/backend/fastapi_app/routers/fair_risk.py \
            aegis-platform/backend/fastapi_app/main.py

      - name: PostgreSQL migration and schema reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          from enterprise.fair_risk_models import FAIRQuantitativeRiskAnalysis

          assert connection.vendor == 'postgresql', connection.vendor
          fields = {field.name for field in FAIRQuantitativeRiskAnalysis._meta.fields}
          assert {
              'organization', 'project', 'vulnerability', 'risk_correlation', 'predecessor',
              'analysis_version', 'simulation_iterations', 'simulation_seed', 'currency',
              'assumptions', 'assumption_evidence', 'evidence_snapshot',
              'assumptions_sha256', 'evidence_sha256', 'result_summary', 'result_sha256',
              'request_fingerprint',
          } <= fields
          assert FAIRQuantitativeRiskAnalysis._meta.db_table in connection.introspection.table_names()
          print('FAIR_DATABASE=POSTGRESQL')
          print('FAIR_SCHEMA=WIRED')
          PY

      - name: FAIR deterministic simulation evidence and tenant reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          pytest -q fastapi_app/services/test_fair_quantitative_risk.py \
            --junitxml=/tmp/fair-quantitative-risk-junit.xml

      - name: Risk correlation lineage regression
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: pytest -q enterprise/test_risk_correlation.py

      - name: Prove FAIR fail-closed policy wiring
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import django
          django.setup()
          from fastapi_app.services.fair_quantitative_risk import FAIR_FACTOR_KEYS, FAIR_POLICY_VERSION

          service = Path('fastapi_app/services/fair_quantitative_risk.py').read_text()
          router = Path('fastapi_app/routers/fair_risk.py').read_text()
          assert FAIR_POLICY_VERSION == 'fair-quantitative-risk.v1'
          assert len(FAIR_FACTOR_KEYS) == 5
          assert 'random.Random(int(seed))' in service
          assert 'latest.id != correlation.id' in service
          assert 'computed != row.sha256' in service
          assert "metadata.get('fair_factors'" in service
          assert 'subject_matches' in service
          assert 'must reference at least one evidence record' in service
          assert "ConfigDict(extra='forbid')" in router
          print('FAIR_DETERMINISTIC_SEED=PROVEN')
          print('FAIR_EVIDENCE_LINKAGE=FAIL_CLOSED')
          print('FAIR_LATEST_RISK_LINEAGE=PINNED')
          PY

      - name: Retain FAIR Reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-quantitative-risk-${{ github.sha }}
          path: /tmp/fair-quantitative-risk-junit.xml
          retention-days: 30
          if-no-files-found: warn
