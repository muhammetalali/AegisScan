name: WSTG Observation Evidence Finding Reality

'on':
  pull_request:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_observation_lineage.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_observation_lineage.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_observation_persistence.py'
      - 'aegis-platform/backend/fastapi_app/services/native_finding_projection.py'
      - 'aegis-platform/backend/fastapi_app/services/nmap_finding_ingestion.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/fastapi_app/tasks/security_scan.py'
      - 'aegis-platform/backend/fastapi_app/tasks/advanced_scans.py'
      - 'aegis-platform/backend/django_project/vulnerabilities/test_native_finding_projection.py'
      - 'aegis-platform/backend/resources/methodologies/wstg/v4.2/**'
      - 'aegis-platform/backend/scripts/wstg_observation_evidence_finding_reality.py'
      - 'docs/WSTG_OBSERVATION_EVIDENCE_FINDING.md'
      - '.github/workflows/wstg-observation-evidence-finding-reality.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-platform/backend/fastapi_app/services/wstg_observation_lineage.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_observation_lineage.py'
      - 'aegis-platform/backend/fastapi_app/services/test_wstg_observation_persistence.py'
      - 'aegis-platform/backend/fastapi_app/services/native_finding_projection.py'
      - 'aegis-platform/backend/fastapi_app/services/nmap_finding_ingestion.py'
      - 'aegis-platform/backend/fastapi_app/tasks/native_capabilities.py'
      - 'aegis-platform/backend/fastapi_app/tasks/security_scan.py'
      - 'aegis-platform/backend/fastapi_app/tasks/advanced_scans.py'
      - 'aegis-platform/backend/django_project/vulnerabilities/test_native_finding_projection.py'
      - 'aegis-platform/backend/resources/methodologies/wstg/v4.2/**'
      - 'aegis-platform/backend/scripts/wstg_observation_evidence_finding_reality.py'
      - 'docs/WSTG_OBSERVATION_EVIDENCE_FINDING.md'
      - '.github/workflows/wstg-observation-evidence-finding-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wstg-observation-evidence-finding-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  lineage-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-django-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: 'postgresql://aegis:aegis@127.0.0.1:5432/aegisdb'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/0'
      JWT_SECRET_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisdb"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aegis-platform/backend/requirements.txt
      - name: Prove checkout is exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install backend test dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Django migration reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: WSTG lineage unit contract
        env:
          PYTHONPATH: aegis-platform/backend
        run: python -m unittest fastapi_app.services.test_wstg_observation_lineage -v
      - name: Persisted evidence and finding lineage reality
        working-directory: aegis-platform/backend
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
        run: >-
          python -m pytest -q
          fastapi_app/services/test_wstg_observation_persistence.py
          django_project/vulnerabilities/test_native_finding_projection.py
      - name: Capture exact-head lineage evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/head-sha.txt
          PYTHONPATH=aegis-platform/backend             python aegis-platform/backend/scripts/wstg_observation_evidence_finding_reality.py             | tee artifacts/wstg-observation-evidence-finding-reality.json
      - uses: actions/upload-artifact@v4
        with:
          name: wstg-observation-evidence-finding-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
