name: HTTP Protocol Integration Bootstrap

on:
  push:
    branches: [codex/http-protocol-consistency-2026-09-12]
    paths:
      - '.github/workflows/http-protocol-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/http-protocol-consistency-2026-09-12
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply deterministic integration patch
        run: python scripts/http_protocol_integration_patch.py
      - name: Commit integrated product files and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(http): integrate protocol consistency plane'
          git push origin HEAD:codex/http-protocol-consistency-2026-09-12
