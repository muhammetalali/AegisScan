name: Domain Integrity Reality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-integrity-reality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisdb
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-domain-integrity-secret-012345678901234567890123
      JWT_SECRET_KEY: ci-domain-integrity-jwt-012345678901234567890123
      DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegisdb
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: django_project.settings
      PYTHONPATH: ${{ github.workspace }}/aegis-platform/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r aegis-platform/backend/requirements.txt
      - name: Migrate durable state
        working-directory: aegis-platform/backend
        run: python manage.py migrate --noinput
      - name: Prove atomic bulk import and intelligence lineage
        working-directory: aegis-platform/backend
        run: python -m pytest -q fastapi_app/routers/test_bulk_import_atomicity.py enterprise/test_intelligence_lineage.py
