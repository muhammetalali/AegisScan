apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisscan-config
data:
  AEGIS_ENV: "production"
  AEGIS_VALIDATION_WORKSPACE_ROOT: "/var/lib/aegisscan/workspaces"
  INTELLIGENCE_EXTERNAL_TIMEOUT: "12"
  REDIS_URL: "redis://redis.example.internal:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegisscan-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@postgres.example.internal:5432/aegisscan"
  SECRET_KEY: "REPLACE_ME"
  JIRA_BASE_URL: "https://your-domain.atlassian.net"
  JIRA_USER_EMAIL: "security@example.com"
  JIRA_API_TOKEN: "REPLACE_ME"
  JIRA_PROJECT_KEY: "SEC"
  SERVICENOW_BASE_URL: "https://instance.service-now.com"
  SERVICENOW_API_TOKEN: "REPLACE_ME"
  GREYNOISE_API_KEY: "REPLACE_ME"
  SHODAN_API_KEY: "REPLACE_ME"
