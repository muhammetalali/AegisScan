services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisdb}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegis} -d $${POSTGRES_DB:-aegisdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; set a real secret in packages/platform/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile.fastapi
    restart: unless-stopped
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001 --workers 2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      SECRET_KEY: ${FASTAPI_SECRET_KEY:?FASTAPI_SECRET_KEY is required; set a real secret in packages/platform/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      DJANGO_API_URL: http://django:8000/api/v1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AEGIS_CONTAINERIZED: ${AEGIS_CONTAINERIZED:-1}
      AEGIS_HOST_GATEWAY: ${AEGIS_HOST_GATEWAY:-host.docker.internal}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
    ports:
      - "8001:8001"
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app worker -l info -Q default,health -c ${CELERY_DEFAULT_WORKER_CONCURRENCY:-2} --hostname=core@%h
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-development}
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; set a real secret in packages/platform/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.celery_app inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_workflow:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app worker -l info -Q workflow -c ${CELERY_WORKFLOW_WORKER_CONCURRENCY:-2} --hostname=workflow@%h
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-development}
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; set a real secret in packages/platform/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.celery_app inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_reports:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app worker -l info -Q reports -c ${CELERY_REPORT_WORKER_CONCURRENCY:-2} --hostname=reports@%h
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-development}
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; set a real secret in packages/platform/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.celery_app inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app beat -l info --max-interval=30 --schedule=/tmp/aegisscan-celerybeat-schedule
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-development}
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set a real password in packages/platform/.env}@postgres:5432/${POSTGRES_DB:-aegisdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; set a real secret in packages/platform/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; set a real secret in packages/platform/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
