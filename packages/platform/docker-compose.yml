services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisdb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    container_name: aegis-django
    restart: unless-stopped
    command: gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      DEBUG: "1"
      SECRET_KEY: ${DJANGO_SECRET_KEY:-aegisscan-local-dev-secret-change-me}
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-aegisscan-local-jwt-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "1"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: AegisScan <noreply@aegisscan.local>
    volumes:
      - ../backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile.fastapi
    container_name: aegis-fastapi
    restart: unless-stopped
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001 --workers 2
    environment:
      SECRET_KEY: ${FASTAPI_SECRET_KEY:-aegisscan-local-fastapi-secret-change-me}
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      DJANGO_API_URL: http://django:8000/api/v1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../backend:/app
    ports:
      - "8001:8001"
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    container_name: aegis-celery-worker
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app worker -l info -c ${CELERY_WORKER_CONCURRENCY:-4} --hostname=worker@%h
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:-aegisscan-local-dev-secret-change-me}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A fastapi_app.celery_app inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.django
    container_name: aegis-celery-beat
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app beat -l info --max-interval=30
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegisdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${DJANGO_SECRET_KEY:-aegisscan-local-dev-secret-change-me}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
