# Docker's embedded DNS resolver lets nginx follow recreated Compose service IPs
# without requiring a frontend container restart whenever the backend changes.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        add_header Content-Type text/plain;
        return 200 'aegis-frontend-ok\n';
    }

    # Durable Django-owned APIs: authentication, user management and
    # PostgreSQL-backed workspace resources.
    location ~ ^/api/v1/(auth|users|projects|assets|scans|vulnerabilities|reports|compliance|knowledge|audit)(/|$) {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # FastAPI owns live platform orchestration, dashboard aggregation,
    # intelligence and assurance/control-plane APIs.
    location /api/ {
        set $fastapi_upstream http://fastapi:8001;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Bridge the HttpOnly JWT cookie to FastAPI's existing bearer-aware
        # HTTP dependencies without exposing the token to frontend JavaScript.
        proxy_set_header Authorization "Bearer $cookie_aegis_access";
    }

    # Realtime FastAPI WebSockets. Cookie remains the source of truth for
    # authentication; no JWT is embedded in the URL or subprotocol.
    location /ws/ {
        set $fastapi_ws_upstream http://fastapi:8001;
        proxy_pass $fastapi_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
    }
}
