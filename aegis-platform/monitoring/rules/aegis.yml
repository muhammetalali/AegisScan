groups:
  - name: aegis-production
    rules:
      - alert: AegisPublicEndpointDown
        expr: probe_success{job="aegis-https"} == 0
        for: 2m
        labels: {severity: critical, service: gateway}
        annotations:
          summary: AegisScan public HTTPS endpoint is unavailable
      - alert: AegisPostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical, service: postgres}
        annotations:
          summary: AegisScan PostgreSQL is unavailable
      - alert: AegisRedisDown
        expr: redis_up == 0
        for: 1m
        labels: {severity: critical, service: redis}
        annotations:
          summary: AegisScan Redis is unavailable
      - alert: AegisPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / clamp_min(sum(pg_settings_max_connections), 1) > 0.85
        for: 10m
        labels: {severity: warning, service: postgres}
        annotations:
          summary: PostgreSQL connection utilization exceeds 85 percent
