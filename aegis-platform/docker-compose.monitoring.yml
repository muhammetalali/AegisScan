services:
  postgres:
    networks:
      - default
      - observability

  redis:
    networks:
      - default
      - observability

  nginx:
    networks:
      - default
      - observability

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: aegis-blackbox-exporter
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: aegis-postgres-exporter
    restart: unless-stopped
    user: "65534:65534"
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-aegisdb}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-aegis}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for monitoring}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]
    depends_on:
      postgres: {condition: service_healthy}

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    container_name: aegis-redis-exporter
    restart: unless-stopped
    user: "65534:65534"
    environment:
      REDIS_ADDR: redis://redis:6379
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]
    depends_on:
      redis: {condition: service_healthy}

  alertmanager:
    build:
      context: .
      dockerfile: docker/alertmanager/Dockerfile
    container_name: aegis-alertmanager
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?ALERT_WEBHOOK_URL is required for monitoring}
      AEGIS_ALLOW_HTTP_ALERT_WEBHOOK: ${AEGIS_ALLOW_HTTP_ALERT_WEBHOOK:-false}
    volumes:
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [alert_delivery]

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: aegis-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - observability
      - alert_delivery
    depends_on:
      alertmanager: {condition: service_started}
      blackbox-exporter: {condition: service_started}
      postgres-exporter: {condition: service_started}
      redis-exporter: {condition: service_started}

networks:
  observability:
    internal: true
  alert_delivery:

volumes:
  prometheus_data:
  alertmanager_data:
