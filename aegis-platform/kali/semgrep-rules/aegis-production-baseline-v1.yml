rules:
  - id: aegis.python.dynamic-eval
    languages: [python]
    message: Dynamic eval can execute attacker-controlled code.
    severity: ERROR
    pattern: eval(...)

  - id: aegis.python.dynamic-exec
    languages: [python]
    message: Dynamic exec can execute attacker-controlled code.
    severity: ERROR
    pattern: exec(...)

  - id: aegis.python.os-system
    languages: [python]
    message: os.system invokes a shell and can enable command injection.
    severity: ERROR
    pattern: os.system(...)

  - id: aegis.python.subprocess-shell-true
    languages: [python]
    message: subprocess with shell=True can enable command injection.
    severity: ERROR
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: aegis.python.requests-verify-false
    languages: [python]
    message: TLS certificate verification is disabled for an outbound HTTP request.
    severity: WARNING
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)

  - id: aegis.javascript.dynamic-eval
    languages: [javascript, typescript]
    message: Dynamic eval can execute attacker-controlled JavaScript.
    severity: ERROR
    pattern: eval(...)
