server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /assets is a protected SPA route, while /assets/... contains Vite build artifacts.
    # An exact match prevents nginx from canonicalizing the SPA route to the static
    # assets directory and returning 403 on direct navigation or browser refresh.
    location = /assets {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
