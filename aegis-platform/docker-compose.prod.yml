x-backend-production-environment: &backend-production-environment
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: ${REDIS_URL:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  CREDENTIAL_VAULT_KEYS: ${CREDENTIAL_VAULT_KEYS:-}
  CREDENTIAL_FINGERPRINT_KEY: ${CREDENTIAL_FINGERPRINT_KEY:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  AEGIS_SCAN_SCOPE_MODE: ${AEGIS_SCAN_SCOPE_MODE:-asset-authorization}
  DJANGO_SETTINGS_MODULE: django_project.settings

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - static_data:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro

  django:
    env_file: !reset []
    ports: !reset []
    volumes: !override
      - media_data:/app/media
      - static_data:/app/staticfiles
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      <<: *backend-production-environment
      AUTH_COOKIE_SECURE: "True"

  fastapi:
    env_file: !reset []
    ports: !reset []
    volumes: !reset []
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      <<: *backend-production-environment
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-}
    depends_on: !override
      django: {condition: service_started}
      redis: {condition: service_healthy}

  scanner_egress:
    environment:
      SCANNER_EGRESS_INTERFACE: ${SCANNER_EGRESS_INTERFACE:-eth0}
      SCANNER_CONTROL_ENDPOINTS: ${SCANNER_CONTROL_ENDPOINTS:-postgres:5432/tcp,redis:6379/tcp,django:8000/tcp}
      SCANNER_EGRESS_PRIVATE_TARGETS: ${SCANNER_EGRESS_PRIVATE_TARGETS:-}
    depends_on: !override
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      django: {condition: service_started}

  celery_worker:
    env_file: !reset []
    volumes: !reset []
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *backend-production-environment
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-}
      SEMGREP_CONFIG: ${SEMGREP_CONFIG:-auto}
    depends_on: !override
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  scanner_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.django
      target: production-no-legacy-recon
      args:
        AEGIS_RETIRE_NMAP: "1"
        AEGIS_RETIRE_NUCLEI: "1"
        AEGIS_RETIRE_SEMGREP: "1"
        AEGIS_RETIRE_MASSCAN: "1"
    env_file: !reset []
    volumes: !override
      - semgrep_workspace:/var/lib/aegis-semgrep
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *backend-production-environment
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-}
      SEMGREP_CONFIG: ${SEMGREP_CONFIG:-auto}
      AEGIS_RECON_PROVIDER: ${AEGIS_RECON_PROVIDER:-default-kali}
      AEGIS_RECON_LEGACY_DISABLED: "true"
      AEGIS_KALI_RECON_CANARY_BPS: ${AEGIS_KALI_RECON_CANARY_BPS:-0}
      AEGIS_KALI_RECON_URL: ${AEGIS_KALI_RECON_URL:-http://127.0.0.1:18765}
      AEGIS_KALI_RECON_AUTH_TOKEN: ${AEGIS_KALI_RECON_AUTH_TOKEN:-}
      AEGIS_KALI_RECON_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_RECON_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_RECON_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_RECON_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_RECON_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
      AEGIS_NMAP_PROVIDER: "default-kali"
      AEGIS_NMAP_LEGACY_DISABLED: "true"
      AEGIS_KALI_NMAP_CANARY_BPS: "0"
      AEGIS_KALI_NETWORK_URL: "http://127.0.0.1:18766"
      AEGIS_KALI_NETWORK_AUTH_TOKEN: ${AEGIS_KALI_NETWORK_AUTH_TOKEN:-}
      AEGIS_KALI_NETWORK_IMAGE: ${AEGIS_KALI_NETWORK_IMAGE:-aegis-kali:network-provider}
      AEGIS_KALI_NETWORK_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_NETWORK_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_NETWORK_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_NETWORK_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_NETWORK_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_NETWORK_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_NETWORK_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_NETWORK_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_NETWORK_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_NETWORK_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_NETWORK_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_NETWORK_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
      AEGIS_MASSCAN_PROVIDER: "default-kali"
      AEGIS_MASSCAN_LEGACY_DISABLED: "true"
      AEGIS_KALI_MASSCAN_CANARY_BPS: "0"
      AEGIS_KALI_MASSCAN_URL: "http://127.0.0.1:18767"
      AEGIS_KALI_MASSCAN_AUTH_TOKEN: ${AEGIS_KALI_MASSCAN_AUTH_TOKEN:-}
      AEGIS_KALI_MASSCAN_IMAGE: ${AEGIS_KALI_MASSCAN_IMAGE:-aegis-kali:masscan-provider}
      AEGIS_KALI_MASSCAN_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_MASSCAN_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_MASSCAN_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_MASSCAN_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_MASSCAN_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_MASSCAN_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_MASSCAN_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_MASSCAN_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_MASSCAN_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_MASSCAN_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_MASSCAN_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_MASSCAN_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
      AEGIS_MASSCAN_INTERFACE: ${AEGIS_MASSCAN_INTERFACE:-}
      AEGIS_MASSCAN_ADAPTER_IP: ${AEGIS_MASSCAN_ADAPTER_IP:-}
      AEGIS_MASSCAN_ADAPTER_MAC: ${AEGIS_MASSCAN_ADAPTER_MAC:-}
      AEGIS_MASSCAN_ROUTER_MAC: ${AEGIS_MASSCAN_ROUTER_MAC:-}
      AEGIS_NUCLEI_PROVIDER: "default-kali"
      AEGIS_NUCLEI_LEGACY_DISABLED: "true"
      AEGIS_KALI_NUCLEI_CANARY_BPS: "0"
      AEGIS_KALI_WEB_URL: "http://127.0.0.1:18770"
      AEGIS_KALI_WEB_AUTH_TOKEN: ${AEGIS_KALI_WEB_AUTH_TOKEN:-}
      AEGIS_KALI_WEB_IMAGE: ${AEGIS_KALI_WEB_IMAGE:-aegis-kali:web-provider}
      AEGIS_KALI_WEB_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_WEB_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_WEB_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_WEB_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_WEB_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_WEB_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_WEB_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_WEB_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_WEB_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_WEB_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_WEB_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_WEB_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
      AEGIS_SEMGREP_PROVIDER: "default-kali"
      AEGIS_SEMGREP_LEGACY_DISABLED: "true"
      AEGIS_KALI_SEMGREP_CANARY_BPS: "0"
      AEGIS_KALI_CODE_URL: "http://127.0.0.1:18771"
      AEGIS_KALI_CODE_AUTH_TOKEN: ${AEGIS_KALI_CODE_AUTH_TOKEN:-}
      AEGIS_KALI_CODE_IMAGE: ${AEGIS_KALI_CODE_IMAGE:-aegis-kali:code-provider}
      AEGIS_KALI_CODE_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_CODE_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_CODE_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_CODE_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_CODE_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_CODE_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_CODE_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_CODE_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_CODE_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_CODE_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_CODE_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_CODE_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
      AEGIS_SEMGREP_WORKSPACE_ROOT: /var/lib/aegis-semgrep
    depends_on: !override
      scanner_egress: {condition: service_healthy}
      kali_network: {condition: service_healthy}
      kali_masscan: {condition: service_healthy}
      kali_web: {condition: service_healthy}
      kali_code: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      django: {condition: service_started}

  kali_network:
    image: ${AEGIS_KALI_NETWORK_IMAGE:-aegis-kali:network-provider}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "python3", "/opt/aegis-runner/network_service.py"]
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      AEGIS_NETWORK_LISTEN_HOST: "127.0.0.1"
      AEGIS_NETWORK_LISTEN_PORT: "18766"
      AEGIS_KALI_NETWORK_AUTH_TOKEN: ${AEGIS_KALI_NETWORK_AUTH_TOKEN:-}
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    depends_on: !override
      scanner_egress: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18766/healthz',timeout=2)); assert d['status']=='ok' and d['profile']=='network'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  kali_masscan:
    image: ${AEGIS_KALI_MASSCAN_IMAGE:-aegis-kali:masscan-provider}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "python3", "/opt/aegis-runner/network_masscan_service.py"]
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      AEGIS_MASSCAN_LISTEN_HOST: "127.0.0.1"
      AEGIS_MASSCAN_LISTEN_PORT: "18767"
      AEGIS_KALI_MASSCAN_AUTH_TOKEN: ${AEGIS_KALI_MASSCAN_AUTH_TOKEN:-}
      HOME: /tmp/aegis-home
      TMPDIR: /tmp
    depends_on: !override
      scanner_egress: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18767/healthz',timeout=2)); assert d['status']=='ok' and d['capability_id']=='network.masscan'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  kali_web:
    image: ${AEGIS_KALI_WEB_IMAGE:-aegis-kali:web-provider}
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/usr/bin/tini", "--", "python3", "/opt/aegis-runner/web_service.py"]
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=192m
    environment:
      AEGIS_WEB_LISTEN_HOST: "127.0.0.1"
      AEGIS_WEB_LISTEN_PORT: "18770"
      AEGIS_KALI_WEB_AUTH_TOKEN: ${AEGIS_KALI_WEB_AUTH_TOKEN:-}
      NUCLEI_TEMPLATES_DIR: /opt/nuclei-templates
      HOME: /tmp/aegis-home
      TMPDIR: /tmp
    depends_on: !override
      scanner_egress: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18770/healthz',timeout=2)); assert d['status']=='ok' and d['profile']=='web'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s


  kali_code:
    image: ${AEGIS_KALI_CODE_IMAGE:-aegis-kali:code-provider}
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/usr/bin/tini", "--", "python3", "/opt/aegis-runner/code_service.py"]
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=192m
    volumes:
      - semgrep_workspace:/var/lib/aegis-semgrep:ro
    environment:
      AEGIS_CODE_LISTEN_HOST: "127.0.0.1"
      AEGIS_CODE_LISTEN_PORT: "18771"
      AEGIS_KALI_CODE_AUTH_TOKEN: ${AEGIS_KALI_CODE_AUTH_TOKEN:-}
      AEGIS_CODE_WORKSPACE_ROOT: /var/lib/aegis-semgrep
      AEGIS_CODE_SEMGREP_CONFIG: ${SEMGREP_CONFIG:-auto}
      HOME: /tmp/aegis-home
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/aegis-home/.cache
      XDG_CONFIG_HOME: /tmp/aegis-home/.config
    depends_on: !override
      scanner_egress: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18771/healthz',timeout=2)); assert d['status']=='ok' and d['profile']=='code'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  browser_worker:
    env_file: !reset []
    volumes: !reset []
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *backend-production-environment
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    depends_on: !override
      scanner_egress: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      django: {condition: service_started}

  celery_beat:
    env_file: !reset []
    volumes: !reset []
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      <<: *backend-production-environment
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-}
    depends_on: !override
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  redis:
    ports: !reset []

  scan_target:
    profiles: [ci-only]

volumes:
  static_data:
  media_data:
  semgrep_workspace:
