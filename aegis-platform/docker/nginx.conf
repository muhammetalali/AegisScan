events {}

http {
    # Docker can assign a new address whenever an application container is recreated.
    # Resolve service names during runtime, including while a backend is unavailable.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    upstream frontend {
        zone frontend_peers 64k;
        server frontend:80 resolve;
    }
    upstream django {
        zone django_peers 64k;
        server django:8000 resolve;
    }
    upstream fastapi {
        zone fastapi_peers 64k;
        server fastapi:8001 resolve;
        keepalive 128;
    }

    proxy_http_version 1.1;
    # proxy_set_header directives are inherited only when a child context
    # defines none of its own. Proxied locations below therefore redeclare
    # Connection "" explicitly so upstream HTTP/1.1 keep-alive is preserved.
    proxy_set_header Connection "";

    # Internal observability listener. Port 8080 is never published by Compose;
    # monitoring reaches it only through the container network. This avoids
    # weakening public HTTPS verification just to obtain a stable health probe.
    server {
        listen 8080;
        server_name _;
        access_log off;

        location = /health {
            proxy_pass http://fastapi/ready;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto http;
        }

        location / { return 404; }
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        # Django owns authentication and the existing DRF project API.
        location /api/v1/auth/ {
            proxy_pass http://django/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/projects/ {
            proxy_pass http://django/api/v1/projects/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI owns the platform validation/workflow APIs under /api/v1.
        location /api/v1/ {
            proxy_pass http://fastapi/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Explicit compatibility routes prevent API paths from falling into
        # the frontend SPA while clients migrate to the canonical /api/v1 namespace.
        location /vulnerabilities/ {
            proxy_pass http://fastapi/api/v1/vulnerabilities/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /scans/ {
            proxy_pass http://fastapi/api/v1/scans/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://fastapi/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The public platform health contract is served by FastAPI.
        # Django keeps its own internal container healthcheck at /health/.
        location = /health {
            proxy_pass http://fastapi/health;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Readiness is a FastAPI dependency check and must not fall through to
        # the frontend, otherwise the black-box probe can report a false API
        # failure while the platform is actually running.
        location = /ready {
            proxy_pass http://fastapi/ready;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Explicit Django health endpoint for diagnostics without changing the
        # public /health contract used by the platform black-box checks.
        location = /django-health {
            proxy_pass http://django/health/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
