events {}

http {
    # Docker can assign a new address whenever an application container is recreated.
    # Resolve service names during runtime, including while a backend is unavailable.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    limit_req_zone $binary_remote_addr zone=aegis_alert_ingress:1m rate=120r/m;

    upstream frontend {
        zone frontend_peers 64k;
        server frontend:80 resolve;
    }
    upstream django {
        zone django_peers 64k;
        server django:8000 resolve;
    }
    upstream fastapi {
        zone fastapi_peers 64k;
        server fastapi:8001 resolve;
        keepalive 128;
    }
    upstream alert_receiver {
        zone alert_receiver_peers 64k;
        server alert_receiver:8080 resolve;
    }

    proxy_http_version 1.1;
    # proxy_set_header directives are inherited only when a child context
    # defines none of its own. Proxied locations below therefore redeclare
    # Connection "" explicitly so upstream HTTP/1.1 keep-alive is preserved.
    proxy_set_header Connection "";

    # Internal observability listener. Compose does not publish port 8080, so
    # the monitoring plane can verify gateway-to-application readiness without
    # disabling TLS verification or depending on a certificate for the Docker
    # service name.
    server {
        listen 8080;
        server_name _;
        access_log off;

        location = /health {
            proxy_pass http://fastapi/ready;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto http;
        }

        location / { return 404; }
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Authenticated alert ingress is TLS-only and intentionally not published
    # by Compose. It is reachable only on the internal alert_delivery network.
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        access_log off;

        location = /_aegis/alerts {
            limit_except POST { deny all; }
            limit_req zone=aegis_alert_ingress burst=60 nodelay;
            client_max_body_size 1m;
            proxy_pass http://alert_receiver/alert;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / { return 404; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        client_max_body_size 100m;

        location /api/v1/auth/ {
            proxy_pass http://django/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/projects/ {
            proxy_pass http://django/api/v1/projects/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/ {
            proxy_pass http://fastapi/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Explicit legacy compatibility routes keep API traffic out of the SPA.
        location /vulnerabilities/ {
            proxy_pass http://fastapi/api/v1/vulnerabilities/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /scans/ {
            proxy_pass http://fastapi/api/v1/scans/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/ {
            proxy_pass http://fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /ws/ {
            proxy_pass http://fastapi/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /health {
            proxy_pass http://fastapi/health;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /ready {
            proxy_pass http://fastapi/ready;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    }
}
