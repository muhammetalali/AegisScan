services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisdb}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  scan_target:
    image: nginx:alpine
    container_name: aegis-scan-target
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
  django:
    build: {context: ./backend, dockerfile: Dockerfile.django}
    container_name: aegis-django
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes: [./backend:/app, media_data:/app/media, static_data:/app/staticfiles]
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,os; h=os.environ.get('ALLOWED_HOSTS','').split(',')[0].strip(); assert h, 'ALLOWED_HOSTS is empty'; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health/',headers={'Host':h}); r=c.getresponse(); assert r.status < 400, r.status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  fastapi:
    build: {context: ./backend, dockerfile: Dockerfile.fastapi}
    container_name: aegis-fastapi
    restart: unless-stopped
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001 --workers 4 --loop uvloop --http httptools --no-access-log
    volumes: [./backend:/app]
    ports: ["8001:8001"]
    env_file: ./backend/.env
    environment:
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-aegis-scan-target}
    depends_on:
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
      scan_target: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  scanner_egress:
    build: {context: ./docker/scanner-egress, dockerfile: Dockerfile}
    container_name: aegis-scanner-egress
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /run]
    environment:
      SCANNER_EGRESS_INTERFACE: ${SCANNER_EGRESS_INTERFACE:-eth0}
      SCANNER_CONTROL_ENDPOINTS: ${SCANNER_CONTROL_ENDPOINTS:-postgres:5432/tcp,redis:6379/tcp,django:8000/tcp}
      SCANNER_EGRESS_PRIVATE_TARGETS: ${SCANNER_EGRESS_PRIVATE_TARGETS:-aegis-scan-target}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      scan_target: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nft list table netdev aegis_egress >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  celery_worker:
    build: {context: ./backend, dockerfile: Dockerfile.django}
    container_name: aegis-celery-worker
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app worker -l info -c 4 -Q default
    volumes: [./backend:/app]
    env_file: ./backend/.env
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-aegis-scan-target}
      SEMGREP_CONFIG: ${SEMGREP_CONFIG:-auto}
      DJANGO_SETTINGS_MODULE: django_project.settings
    depends_on:
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  scanner_worker:
    build: {context: ./backend, dockerfile: Dockerfile.django}
    container_name: aegis-scanner-worker
    restart: unless-stopped
    user: "0:0"
    command: sh /app/scanner-worker-entrypoint.sh
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SETPCAP]
    volumes: [./backend:/app]
    env_file: ./backend/.env
    environment:
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-aegis-scan-target}
      SEMGREP_CONFIG: ${SEMGREP_CONFIG:-auto}
      DJANGO_SETTINGS_MODULE: django_project.settings
      AEGIS_RECON_PROVIDER: ${AEGIS_RECON_PROVIDER:-legacy}
      AEGIS_KALI_RECON_CANARY_BPS: ${AEGIS_KALI_RECON_CANARY_BPS:-0}
      AEGIS_KALI_RECON_URL: ${AEGIS_KALI_RECON_URL:-http://127.0.0.1:18765}
      AEGIS_KALI_RECON_AUTH_TOKEN: ${AEGIS_KALI_RECON_AUTH_TOKEN:-}
      AEGIS_KALI_RECON_EXPECTED_RUNNER_VERSION: ${AEGIS_KALI_RECON_EXPECTED_RUNNER_VERSION:-}
      AEGIS_KALI_RECON_EXPECTED_BUILD_COMMIT: ${AEGIS_KALI_RECON_EXPECTED_BUILD_COMMIT:-}
      AEGIS_KALI_RECON_EXPECTED_BASE_IMAGE_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_BASE_IMAGE_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_TOOL_MANIFEST_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_TOOL_MANIFEST_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_IMAGE_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_IMAGE_DIGEST:-}
      AEGIS_KALI_RECON_EXPECTED_RUNTIME_MANIFEST_DIGEST: ${AEGIS_KALI_RECON_EXPECTED_RUNTIME_MANIFEST_DIGEST:-}
    depends_on:
      scanner_egress: {condition: service_healthy}
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  kali_recon:
    image: ${AEGIS_KALI_RECON_IMAGE:-aegis-kali:recon}
    container_name: aegis-kali-recon
    profiles: [kali-recon]
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/usr/bin/tini", "--", "python3", "/opt/aegis-runner/recon_service.py"]
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700
    environment:
      AEGIS_RECON_LISTEN_HOST: 127.0.0.1
      AEGIS_RECON_LISTEN_PORT: "18765"
      AEGIS_KALI_RECON_AUTH_TOKEN: ${AEGIS_KALI_RECON_AUTH_TOKEN:-}
      HOME: /tmp/aegis-home
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/aegis-home/.cache
      XDG_CONFIG_HOME: /tmp/aegis-home/.config
    depends_on:
      scanner_egress: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18765/healthz',timeout=2)); assert d['status']=='ok' and d['profile']=='recon'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  browser_worker:
    build: {context: ./backend, dockerfile: Dockerfile.django}
    container_name: aegis-browser-worker
    restart: unless-stopped
    user: "10001:10001"
    command: celery -A fastapi_app.celery_app worker -l info -c 2 -Q browser
    network_mode: "service:scanner_egress"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [./backend:/app]
    env_file: ./backend/.env
    environment:
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-aegis-scan-target}
      DJANGO_SETTINGS_MODULE: django_project.settings
      AEGIS_KALI_RECON_AUTH_TOKEN: ""
    depends_on:
      scanner_egress: {condition: service_healthy}
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  celery_beat:
    build: {context: ./backend, dockerfile: Dockerfile.django}
    container_name: aegis-celery-beat
    restart: unless-stopped
    command: celery -A fastapi_app.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    volumes: [./backend:/app]
    env_file: ./backend/.env
    environment:
      AUTHORIZED_SCAN_TARGETS: ${AUTHORIZED_SCAN_TARGETS:-aegis-scan-target}
      DJANGO_SETTINGS_MODULE: django_project.settings
    depends_on:
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    container_name: aegis-frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      django: {condition: service_started}
      fastapi: {condition: service_healthy}
  nginx:
    image: nginx:alpine
    container_name: aegis-nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      django: {condition: service_healthy}
      fastapi: {condition: service_healthy}
      frontend: {condition: service_started}
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
